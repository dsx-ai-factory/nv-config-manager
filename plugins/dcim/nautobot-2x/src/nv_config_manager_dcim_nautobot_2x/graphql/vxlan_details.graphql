query RenderVxlanDetails($ids: [String]) {
  vxlans(id: $ids) {
    id
    name
    vnid
    vni_type
    l3_vlan_id
    overlay {
      id
      name
    }
    vlan {
      id
      vid
      name
    }
    vrf {
      id
      name
      rd
    }
    import_targets {
      name
    }
    export_targets {
      name
    }
  }
}
