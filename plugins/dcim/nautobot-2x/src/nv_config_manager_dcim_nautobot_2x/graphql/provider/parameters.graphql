query ListLocations($location_types: [String]) {
  locations(location_type: $location_types) { id name }
}

query GetLocationById($id: ID!) {
  location(id: $id) { id name }
}

query ListTenants {
  tenants { id name }
}

query ListRoles {
  roles { id name }
}

query ListManagedTenants($limit: Int!, $offset: Int!) {
  config_manager_devices(limit: $limit, offset: $offset) {
    device { tenant { id name } }
  }
}

query ListManagedRoles($limit: Int!, $offset: Int!) {
  config_manager_devices(limit: $limit, offset: $offset) {
    device { role { id name } }
  }
}

query ListNamespaceTags($location: String) {
  namespaces(location: $location) { tags { name } }
}

query ListStatuses($content_types: [String]) {
  statuses(content_types: $content_types) { id name }
}

query ListDeviceSelections(
  $site: [String]
  $status: [String]
  $role: [String]
  $tenant: [String]
  $device_type_id: [String]
  $manufacturer: [String]
  $platform: [String]
  $managed_only: Boolean
) {
  devices(
    location: $site
    status: $status
    role: $role
    tenant: $tenant
    device_type: $device_type_id
    manufacturer: $manufacturer
    platform: $platform
    has_primary_ip: true
    nv_config_manager_device_status: $managed_only
  ) {
    id
    name
    platform { name }
  }
}

query GetDeviceSelectionByName($name: [String]!) {
  devices(name: $name) { id name }
}
