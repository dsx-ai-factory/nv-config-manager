query GetCableStatusInterfaces($device_id: [String], $names: [String]!) {
  devices(id: $device_id) {
    id
  }
  # Preserve the REST filter's module and virtual-chassis interface scope.
  interfaces(device_id: $device_id, name: $names) {
    name
    cable {
      id
    }
  }
}
