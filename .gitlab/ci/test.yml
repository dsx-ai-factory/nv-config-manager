# Playwright E2E tests for UI merge requests
test-mr-ui-e2e:
  stage: test
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "ui/**/*"
      when: always
    - when: never
  image: $NVCM_CI_IMAGE_PLAYWRIGHT
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/
      - ui/.next/cache/
  before_script:
    - cd ui
    - npm ci
    - npm run build
  script:
    - npx playwright test
    - echo "Playwright report available at https://$CI_PROJECT_NAMESPACE.gitlab.io/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/playwright-report/index.html"
  after_script:
    - cd ui
    # Generate coverage badge from test results
    - |
      if [ -f test-results/results.json ]; then
        TOTAL=$(jq '.stats.expected // 0' test-results/results.json)
        PASSED=$(jq '.stats.expected - .stats.unexpected // 0' test-results/results.json)
        if [ "$TOTAL" -gt 0 ]; then
          PERCENT=$((PASSED * 100 / TOTAL))
          echo "E2E_COVERAGE=$PERCENT" >> ../e2e-coverage.env
          echo "E2E Tests: $PASSED/$TOTAL passed ($PERCENT%)"
        fi
      fi
  artifacts:
    when: always
    paths:
      - ui/playwright-report/
      - ui/test-results/
    reports:
      junit: ui/test-results/results.xml
    expire_in: 1 week
  coverage: '/E2E Tests: \d+\/\d+ passed \((\d+)%\)/'

# =============================================================================
# Integration Test - Kind Cluster with Full Stack
# =============================================================================
# Manually triggered integration test that deploys the full NVIDIA Config Manager stack to a
# Kind cluster and validates that all devices render successfully.
#
# The tests use pytest and can also be run locally against any running cluster:
#   pytest src/tests/integration/ -v --base-hostname config-manager.local
# =============================================================================

integration-test:
  stage: test
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  image: $NVCM_CI_IMAGE_PYTHON_311_BOOKWORM
  services:
    - name: $NVCM_CI_IMAGE_DOCKER_DIND
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    KIND_CLUSTER_NAME: nv-config-manager
    NV_CONFIG_MANAGER_HOSTNAME: config-manager.local
    NV_CONFIG_MANAGER_NAMESPACE: nv-config-manager
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - when: never
  timeout: 45m
  before_script:
    - |
      set -e
      echo "=== Installing dependencies ==="
      apt-get update -qq
      apt-get install -y -qq curl jq rsync ca-certificates gnupg make > /dev/null

      # Install Docker CLI (official version with buildx support)
      echo "Installing Docker CLI..."
      install -m 0755 -d /etc/apt/keyrings
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
      apt-get update -qq
      apt-get install -y -qq docker-ce-cli docker-buildx-plugin > /dev/null

      # Install yq
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o /usr/local/bin/yq
      chmod +x /usr/local/bin/yq

      # Install kubectl
      echo "Installing kubectl..."
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://dl.k8s.io/release/$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
      chmod +x /usr/local/bin/kubectl

      # Install kind
      echo "Installing kind..."
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64 -o /usr/local/bin/kind
      chmod +x /usr/local/bin/kind

      # Install helm
      echo "Installing helm..."
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz | tar -xz
      mv linux-amd64/helm /usr/local/bin/helm

      # Install uv and Python dependencies (uses pyproject.toml and uv.lock)
      echo "Installing uv..."
      pip install --quiet uv
      echo "Installing Python dependencies with uv..."
      uv sync --frozen

      # Wait for Docker to be ready
      echo "Waiting for Docker..."
      until docker info > /dev/null 2>&1; do
        echo "Waiting for docker daemon..."
        sleep 2
      done
      echo "Docker is ready"

      # Login to the configured image target to pull base images during docker builds
      image_target_exports="$(bash .gitlab/ci/scripts/image_target_env.sh)" || exit $?
      eval "$image_target_exports"
      image_token="$(printenv "$NVCM_IMAGE_TOKEN_VAR" || true)"
      test -n "$image_token" || (echo "Image target ${NVCM_IMAGE_TARGET_NAME} references ${NVCM_IMAGE_TOKEN_VAR}, but it is empty or unset" && exit 1)
      printf '%s' "$image_token" | docker login -u "$NVCM_IMAGE_USERNAME" --password-stdin "$NVCM_IMAGE_REGISTRY"
  script:
    - |
      set -e
      echo "=== Setting inotify limits for Kind ==="
      sysctl -w fs.inotify.max_user_instances=512
      sysctl -w fs.inotify.max_user_watches=524288

      echo "=== Creating Kind cluster ==="
      kind create cluster --name $KIND_CLUSTER_NAME --config deploy/kind-config.yaml --wait 5m

      # Fix kubeconfig for DinD: Kind binds the API server to 0.0.0.0 (per kind-config.yaml)
      # but from the CI container, we need to connect via the 'docker' service hostname.
      echo "=== Fixing kubeconfig for DinD environment ==="
      # Extract the port Kind is using (mapped to the DinD host)
      KIND_PORT=$(sed -n 's/.*0\.0\.0\.0:\([0-9]*\).*/\1/p' ~/.kube/config | head -1)
      echo "Kind API server port: ${KIND_PORT}"
      # Replace 0.0.0.0 with 'docker' (the DinD service alias)
      sed -i "s/0.0.0.0:${KIND_PORT}/docker:${KIND_PORT}/g" ~/.kube/config
      echo "Updated kubeconfig to use docker:${KIND_PORT}"

      echo "=== Cluster info ==="
      kubectl cluster-info
      kubectl get nodes

      echo "=== Configuring /etc/hosts for NVIDIA Config Manager hostnames ==="
      # Resolve the docker hostname to an IP and add NVIDIA Config Manager hostnames
      DOCKER_IP=$(getent hosts docker | awk '{print $1}')
      NV_CONFIG_MANAGER_HOSTS="config-manager.local nautobot.config-manager.local render.config-manager.local ztp.config-manager.local dhcp.config-manager.local workflow.config-manager.local config-store.config-manager.local svc-workflow.config-manager.local svc-render.config-manager.local svc-ztp.config-manager.local svc-dhcp.config-manager.local svc-nautobot.config-manager.local svc-config-store.config-manager.local"
      echo "${DOCKER_IP} ${NV_CONFIG_MANAGER_HOSTS}" >> /etc/hosts
      echo "Added /etc/hosts entry: ${DOCKER_IP} ${NV_CONFIG_MANAGER_HOSTS}"

      echo "=== Deploying NVIDIA Config Manager ==="
      # make kind-up detects the existing cluster and skips creation, then calls
      # nv-config-manager-installer which builds images, loads them into Kind, and deploys via Helm.
      # APT_MIRROR/APT_MIRROR_GPG_KEY_URL are set as CI global variables and passed
      # through to docker build by the installer.
      make kind-up \
        KIND_CLUSTER_NAME=$KIND_CLUSTER_NAME \
        INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml \
        HELM_TIMEOUT=20m

      echo "=== Pod status ==="
      kubectl get pods -n $NV_CONFIG_MANAGER_NAMESPACE

      echo "=== Running integration tests ==="
      # Run pytest integration tests (uses hostnames via /etc/hosts)
      # Retry up to 3 times with 10s sleep between attempts
      for attempt in 1 2 3; do
        echo "=== Attempt $attempt of 3 ==="
        if uv run pytest src/tests/integration/ -v \
          --ci \
          --nv-config-manager-namespace $NV_CONFIG_MANAGER_NAMESPACE \
          --tb=short \
          --junitxml=integration-test-results.xml; then
          echo "=== Tests passed on attempt $attempt ==="
          break
        else
          if [ $attempt -lt 3 ]; then
            echo "=== Tests failed on attempt $attempt, retrying in 10s ==="
            sleep 10
          else
            echo "=== Tests failed on all 3 attempts ==="
            exit 1
          fi
        fi
      done
  after_script:
    - |
      echo "=== Collecting logs ==="
      mkdir -p integration-test-logs
      kubectl get pods -n $NV_CONFIG_MANAGER_NAMESPACE -o wide > integration-test-logs/pods.txt 2>&1 || true
      kubectl get events -n $NV_CONFIG_MANAGER_NAMESPACE --sort-by='.lastTimestamp' > integration-test-logs/events.txt 2>&1 || true
      for pod in $(kubectl get pods -n $NV_CONFIG_MANAGER_NAMESPACE -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        kubectl logs -n $NV_CONFIG_MANAGER_NAMESPACE $pod --all-containers > integration-test-logs/$pod.log 2>&1 || true
      done
      
      echo "=== Cleanup ==="
      kind delete cluster --name $KIND_CLUSTER_NAME 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - integration-test-logs/
      - integration-test-results.xml
    reports:
      junit: integration-test-results.xml
    expire_in: 1 week

# =============================================================================
# Test Stage - Default Branch And Release Tags
# =============================================================================

# Python tests for default branch and release tags
test-main-py:
  stage: test
  needs: []
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    # Skip default-branch triggered pipelines without trusting their supplied
    # variables; the promote validators authorize their dedicated jobs.
    - if: (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  image: $NVCM_CI_IMAGE_PYTHON_313
  # DinD service is required for Testcontainers
  services:
    - name: $NVCM_CI_IMAGE_DOCKER_DIND
      alias: docker
      command: ["--tls=false"]
  variables:
    # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
  script:
    - uv run pytest packages/dcim/tests -v
    - uv run pytest -n auto --cov=src/nv_config_manager --cov-report=xml:coverage.xml --cov-report=term
    - *nautobot-coverage-script
  artifacts:
    when: always
    paths:
      - coverage.xml
      - components/nautobot/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)/'

