.network-template-paths: &network-template-paths
  - "packages/templates/**/*"
  - pyproject.toml
  - uv.lock

.nautobot-coverage-script: &nautobot-coverage-script |
  set -e
  cd components/nautobot
  uv run pytest tests/ -n auto --cov=nv_config_manager_auth --cov=nv_config_manager_jobs --cov-report=term
  uv run coverage xml --include='nv_config_manager_auth/*,nv_config_manager_jobs/*' -o coverage.xml

test-mr-py:
  stage: test
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*"
        - "components/nautobot/**/*"
        - "packages/dcim/**/*"
        - "packages/workflows/**/*"
        - "plugins/dcim/nautobot-2x/**/*"
        - pyproject.toml
        - uv.lock
      when: on_success
    - when: never
  image: $NVCM_CI_IMAGE_PYTHON_313
  # DinD service is required for Testcontainers
  services:
    - name: $NVCM_CI_IMAGE_DOCKER_DIND
      alias: docker
      command: ["--tls=false"]
  variables:
    # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
  script:
    - uv run pytest packages/dcim/tests -v
    - uv run pytest -n auto --cov=src/nv_config_manager --cov-report=xml:coverage.xml --cov-report=term
    - *nautobot-coverage-script
  artifacts:
    when: always
    paths:
      - coverage.xml
      - components/nautobot/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)/'

