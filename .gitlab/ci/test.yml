.network-template-paths: &network-template-paths
  - "packages/templates/**/*"
  - pyproject.toml
  - uv.lock

.nautobot-coverage-script: &nautobot-coverage-script |
  set -e
  cd components/nautobot
  uv run pytest tests/ -n auto --cov=nv_config_manager_auth --cov=nv_config_manager_jobs --cov-report=term
  uv run coverage xml --include='nv_config_manager_auth/*,nv_config_manager_jobs/*' -o coverage.xml

.test-job-policy: &test-job-policy
  interruptible: true
  timeout: 1h

# =============================================================================
# Test Stage - Default Branch And Release Tags
# =============================================================================

# Python tests for default branch and release tags
test-main-py:
  <<: *test-job-policy
  stage: test
  needs: []
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    # Skip default-branch triggered pipelines without trusting their supplied
    # variables; the promote validators authorize their dedicated jobs.
    - if: (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  image: $NVCM_CI_IMAGE_PYTHON_313
  # DinD service is required for Testcontainers
  services:
    - name: $NVCM_CI_IMAGE_DOCKER_DIND
      alias: docker
      command: ["--tls=false"]
  variables:
    # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
  script:
    - uv run pytest packages/dcim/tests -v
    - uv run pytest -n auto --cov=src/nv_config_manager --cov-report=xml:coverage.xml --cov-report=term
    - *nautobot-coverage-script
  artifacts:
    when: always
    paths:
      - coverage.xml
      - components/nautobot/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)/'

