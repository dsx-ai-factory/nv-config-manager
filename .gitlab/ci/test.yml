# Playwright E2E tests for UI default branch and release tags
test-main-ui-e2e:
  <<: *test-job-policy
  stage: test
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    # Skip default-branch triggered pipelines (see test-main-py).
    - if: (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $GITLAB_USER_EMAIL == $CI_PUSH_EMAIL
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "ui/**/*"
      when: on_success
    - when: never
  image: $NVCM_CI_IMAGE_PLAYWRIGHT
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/
      - ui/.next/cache/
  before_script:
    - cd ui
    - npm ci
    - npm run build
  script:
    - npx playwright test
  after_script:
    - cd ui
    # Generate coverage badge from test results
    - |
      if [ -f test-results/results.json ]; then
        TOTAL=$(jq '.stats.expected // 0' test-results/results.json)
        PASSED=$(jq '.stats.expected - .stats.unexpected // 0' test-results/results.json)
        if [ "$TOTAL" -gt 0 ]; then
          PERCENT=$((PASSED * 100 / TOTAL))
          echo "E2E Tests: $PASSED/$TOTAL passed ($PERCENT%)"
        fi
      fi
  artifacts:
    when: always
    paths:
      - ui/playwright-report/
      - ui/test-results/
    reports:
      junit: ui/test-results/results.xml
    expire_in: 1 week
  coverage: '/E2E Tests: \d+\/\d+ passed \((\d+)%\)/'
