---
# =============================================================================
# Sonar Stage - Code Quality Analysis
# =============================================================================

.sonar-change-paths: &sonar-change-paths
  - ".github/**/*"
  - ".gitlab/**/*"
  - "build/**/*"
  - "components/**/*"
  - "packages/**/*"
  - "plugins/**/*"
  - "db/**/*"
  - "deploy/**/*"
  - "development/**/*"
  - "installer/**/*"
  - "scripts/**/*"
  - "src/**/*"
  - "ui/**/*"
  - .gitlab-ci.yml
  - pyproject.toml
  - sonar-project.properties
  - uv.lock

sonar-scanner:
  stage: sonar
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: test-mr-py
      optional: true
      artifacts: true
    - job: test-main-py
      optional: true
      artifacts: true
    - job: test-mr-installer
      optional: true
      artifacts: true
    - job: test-mr-network-templates
      optional: true
      artifacts: true
    - job: test-main-network-templates
      optional: true
      artifacts: true
    - job: test-main-installer
      optional: true
      artifacts: true
  image:
    name: $NVCM_CI_IMAGE_SONAR
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    # A main-branch scan without coverage replaces valid dashboard coverage
    # with 0%. Skip that scan if an expected producer/artifact regresses.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        missing=0
        for report in \
          coverage.xml \
          components/nautobot/coverage.xml \
          packages/templates/coverage.xml \
          installer/coverage.xml; do
          if [ ! -s "$report" ]; then
            echo "Missing required Sonar coverage report: $report" >&2
            missing=1
          fi
        done
        test "$missing" -eq 0
      fi
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.projectKey="${NVCM_SONAR_PROJECT_KEY}"
  # The internal mirror is post-merge reporting, not an upstream merge gate.
  allow_failure: true
  rules:
    # Skip default-branch triggered pipelines without trusting their supplied
    # variables; the promote validators authorize their dedicated jobs.
    - if: (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sonar-change-paths
      when: always
    # Pull-mirror updates arrive as default-branch pushes. Analyze every one,
    # including bot-authored commits and commits outside the source paths above.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

sonarqube-vulnerability-report:
  stage: sonar
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: sonar-scanner
      optional: true
  image: $NVCM_CI_IMAGE_ALPINE
  variables:
    # This job only calls the SonarQube API and consumes scanner artifacts.
    GIT_STRATEGY: empty
  script:
    - apk add -q curl jq
    - |
      auth_config="$(mktemp)"
      trap 'rm -f "$auth_config"' EXIT
      chmod 600 "$auth_config"
      printf 'user = "%s:"\n' "$SONAR_TOKEN" > "$auth_config"
      sonar_host_url="${SONAR_HOST_URL%/}"
      curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --retry-connrefused --config "$auth_config" "${sonar_host_url}/api/issues/gitlab_sast_export?projectKey=${NVCM_SONAR_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json
    - 'jq -e ''.version and (.vulnerabilities | type == "array")'' gl-sast-sonar-report.json >/dev/null'
  allow_failure: true
  rules:
    # Skip default-branch triggered pipelines (see sonar-scanner).
    - if: (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sonar-change-paths
      when: always
    # Keep the SAST export paired with every default-branch analysis.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json
