include:
  - local: .gitlab/ci/images.yml

stages:
  - lint
  - build
  - security
  - test
  - sonar
  - deploy
  - release
  # Airgapped bundle stages (manual trigger)
  - prepare-airgapped
  - build-airgapped
  - test-airgapped
  - publish-airgapped

# Run automatic pipelines for merge requests, the default branch, tags, and
# vetted copy-pr-bot refs. Mirrored feature branches can be deleted upstream
# while jobs are queued, so do not create push pipelines for ordinary feature
# branches. A pull-request/<n> sync is different: it is the vetted snapshot for
# the secret-free build and its webhook-created promotion buttons.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Vetted copy-pr-bot refs may run only from a mirror sync or a deliberate
    # trigger. These pipelines execute untrusted code, but only on the isolated
    # runner pool and without protected variables (see pr-build.yml).
    - if: $CI_COMMIT_BRANCH =~ /^pull-request\/[0-9]+$/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - if: $CI_COMMIT_BRANCH =~ /^pull-request\//
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH
    # Go module tags should not trigger release jobs.
    - if: $CI_COMMIT_TAG =~ /^bindings\/go\/v/
      when: never
    - if: $CI_COMMIT_TAG

variables:
  # Images for the untrusted PR build only. Kept separate
  # so a registry override can be scoped to pr-build.yml without
  # moving the ~30 other jobs (including the release path) onto it.
  NVCM_PR_IMAGE_ALPINE: "$NVCM_CI_IMAGE_ALPINE"
  NVCM_PR_IMAGE_DOCKER_DIND: "$NVCM_CI_IMAGE_DOCKER_DIND"
  APT_MIRROR: "$NVCM_APT_MIRROR"
  APT_MIRROR_DEBIAN: "$NVCM_APT_MIRROR_DEBIAN"
  APT_MIRROR_GPG_KEY_URL: "$NVCM_APT_MIRROR_GPG_KEY_URL"

# Always-run job to ensure pipeline has at least one job
# Prevents GitLab UI confusion when all other jobs are skipped
pipeline-status:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  image: $NVCM_CI_IMAGE_ALPINE
  variables:
    GIT_STRATEGY: empty
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never
  script:
    - echo "✅ Pipeline running for commit ${CI_COMMIT_SHORT_SHA}"
