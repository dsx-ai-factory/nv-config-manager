---
.release-job-timeout: &release-job-timeout
  timeout: 1h

# =============================================================================
# Release Stage
# =============================================================================

# Validate the mirrored upstream tag and expose it under the existing release
# variable names used by publish jobs.
release-version:
  <<: *release-job-timeout
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  script:
    - |
      set -e
      if ! printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
        echo "Release tags must be Docker-compatible semver, for example 1.2.3 or 1.2.3-rc.1"
        echo "Got: ${CI_COMMIT_TAG}"
        exit 1
      fi
      base_version="${CI_COMMIT_TAG%%-*}"
      {
        echo "NEW_VERSION=${CI_COMMIT_TAG}"
        echo "RELEASE_VERSION=${CI_COMMIT_TAG}"
        echo "BASE_VERSION=${base_version}"
      } > build.env
      cat build.env
  artifacts:
    reports:
      dotenv: build.env

# Publish Helm chart to GitLab and configured external targets for upstream tags.
helm-publish-release:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image:
    name: $NVCM_CI_IMAGE_UBUNTU
    entrypoint: ['']
  before_script:
    - |
      set -e  # Exit on error
      apt update
      apt install -y curl gpg apt-transport-https
      curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
      echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | tee /etc/apt/sources.list.d/helm-stable-debian.list
      apt update
      apt install -y helm git wget unzip
      # Install Go version of yq (not Python version from apt)
      wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      chmod +x /usr/local/bin/yq
    - wget --content-disposition https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/4.8.2/files/ngccli_linux.zip -O ngccli_linux.zip
    - unzip ngccli_linux.zip
    - chmod u+x ngc-cli/ngc
  script:
    - |
      set -e  # Exit on error
      
      echo "📦 Publishing Helm chart with version ${NEW_VERSION}..."
      
      CHART_PATH="deploy/helm"
      yq -i '.version = "'${NEW_VERSION}'"' "${CHART_PATH}/Chart.yaml"
      yq -i '.appVersion = "'${NEW_VERSION}'"' "${CHART_PATH}/Chart.yaml"
      CHART_NAME=$(yq -r '.name' ${CHART_PATH}/Chart.yaml)

      # Subchart .tgz files are gitignored, so materialize them via
      # `helm dependency build` before packaging. The repository URLs must be
      # registered by name for dependency resolution.
      echo "📥 Fetching helm subchart dependencies..."
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      helm repo add grafana https://grafana.github.io/helm-charts
      helm repo update
      helm dependency build "${CHART_PATH}"

      # Package with semver version
      image_target_exports="$(bash .gitlab/ci/scripts/image_target_env.sh "${NVCM_VALUES_IMAGE_TARGET:-}")" || exit $?
      eval "$image_target_exports"
      echo "📝 Updating image repositories to ${NVCM_IMAGE_REPOSITORY} and tags to ${NEW_VERSION}..."
      bash .gitlab/ci/scripts/update_helm_image_values.sh deploy/helm/values.yaml "$NVCM_IMAGE_REPOSITORY" "$NEW_VERSION"

      echo "📦 Packaging Helm chart ${CHART_NAME} with version ${NEW_VERSION}..."
      helm package "${CHART_PATH}" --version "${NEW_VERSION}"
      filename="${CHART_NAME}-${NEW_VERSION}.tgz"
      
      if [ ! -f "$filename" ]; then
        echo "❌ Error: Expected file $filename not found"
        exit 1
      fi
      # Push to GitLab package registry
      echo "📦 Pushing to GitLab package registry (stable channel)..."
      curl --retry 3 --retry-delay 5 --retry-connrefused --fail --request POST \
            --form "chart=@$filename" \
            --user "\$oauth2:$CI_PUSH_TOKEN" \
            "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/helm/api/stable/charts"
      echo "✅ Pushed $filename to GitLab (stable)"
      
      bash .gitlab/ci/scripts/publish_chart_targets.sh "$filename" "$NEW_VERSION" "$CHART_NAME"
      rm -f "$filename"
      echo "🧹 Cleaned up $filename"
      echo "🎉 Chart published as version ${NEW_VERSION}!"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  needs:
    - job: release-version
      artifacts: true
    - job: update-version

# Tag and push Docker images with the mirrored upstream release tag (multi-arch)
update-version:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_DOCKER
  services:
    - name: $NVCM_CI_IMAGE_DOCKER_DIND
      alias: docker
      command: ["--tls=false"]
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache bash git yq
    - until docker info > /dev/null 2>&1; do echo "Waiting for docker to start..."; sleep 5; done
    - |
      image_target_exports="$(bash .gitlab/ci/scripts/image_target_env.sh)" || exit $?
      eval "$image_target_exports"
    - export IMAGE_REPOSITORY_BASE="$NVCM_IMAGE_REPOSITORY"
    - image_token="$(printenv "$NVCM_IMAGE_TOKEN_VAR" || true)"
    - test -n "$image_token" || (echo "Image target ${NVCM_IMAGE_TARGET_NAME} references ${NVCM_IMAGE_TOKEN_VAR}, but it is empty or unset" && exit 1)
    - printf '%s' "$image_token" | docker login -u "$NVCM_IMAGE_USERNAME" --password-stdin "$NVCM_IMAGE_REGISTRY"
    # Set up Docker Buildx for multi-arch manifest operations
    - docker buildx create --name multiarch-builder --driver docker-container --use || docker buildx use multiarch-builder
    - docker buildx inspect --bootstrap
  script:
    # Use buildx imagetools to create semver tags from existing multi-arch manifests
    - echo "Creating release tag $NEW_VERSION for multi-arch images..."
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-kea:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-kea:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-kea-admin:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-kea-admin:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-ui:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-ui:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-nautobot:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-nautobot:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-nats-ready:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-nats-ready:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-bootstrap:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-bootstrap:$CI_COMMIT_SHORT_SHA
    - docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-ui:$NEW_VERSION $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-ui:$CI_COMMIT_SHORT_SHA
    - |
      if [ "${NEW_VERSION#*-}" = "$NEW_VERSION" ]; then
        echo "Creating latest tags for stable release $NEW_VERSION..."
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager:latest $IMAGE_REPOSITORY_BASE/nv-config-manager:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-kea:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-kea:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-kea-admin:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-kea-admin:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-ui:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-ui:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-nautobot:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-nautobot:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-nats-ready:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-nats-ready:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-bootstrap:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-bootstrap:$NEW_VERSION
        docker buildx imagetools create -t $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-ui:latest $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-ui:$NEW_VERSION
      else
        echo "Skipping latest tags for prerelease $NEW_VERSION"
      fi
    - echo "✅ Pushed multi-arch images with tag $NEW_VERSION to configured registry"
    # Verify multi-arch manifests
    - echo "📋 Verifying multi-arch manifests:"
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-kea:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-kea-admin:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-ui:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-nautobot:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-nats-ready:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-bootstrap:$NEW_VERSION
    - docker buildx imagetools inspect $IMAGE_REPOSITORY_BASE/nv-config-manager-temporal-ui:$NEW_VERSION
  needs:
    - job: release-version
      artifacts: true
    - job: docker-manifest-main
      optional: false

# Record the release artifact version without creating Git tags in the mirror.
make-release:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  script:
    - echo "NEW_VERSION is ${NEW_VERSION}"
    - echo "Skipping GitLab release creation so the mirror does not create local Git tags."
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  needs:
    - job: release-version
      artifacts: true
    - job: update-version

# Publish network template engine/reference package from the tagged mirrored commit.
publish-network-templates-release:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_PYTHON_313
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  before_script:
    - pip install --upgrade pip
    - pip install uv
  script:
    - uv build --package nv-config-manager-templates --out-dir dist --clear
    - >
      uv publish dist/*
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --check-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      --username gitlab-ci-token
      --password "$CI_JOB_TOKEN"
  needs:
    - job: release-version
      artifacts: true
    - job: make-release

# Publish the bundled Nautobot overlays app from the tagged mirrored commit.
publish-nautobot-app-overlays-release:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_PYTHON_311_BOOKWORM
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  before_script:
    - pip install --upgrade pip
    - pip install uv
  script:
    - cd components/nautobot/nautobot-app-overlays
    - export SETUPTOOLS_SCM_PRETEND_VERSION="${NEW_VERSION}"
    - uv build --out-dir dist --clear
    - >
      uv publish dist/*
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --check-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      --username gitlab-ci-token
      --password "$CI_JOB_TOKEN"
  needs:
    - job: release-version
      artifacts: true
    - job: make-release

# Publish the bundled Nautobot NVIDIA Config Manager app from the tagged mirrored commit.
publish-nautobot-nv-config-manager-release:
  <<: *release-job-timeout
  stage: release
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_PYTHON_311_BOOKWORM
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  before_script:
    - pip install --upgrade pip
    - pip install uv
  script:
    - cd components/nautobot/nautobot-nv-config-manager
    - export SETUPTOOLS_SCM_PRETEND_VERSION="${NEW_VERSION}"
    - uv build --out-dir dist --clear
    - >
      uv publish dist/*
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --check-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      --username gitlab-ci-token
      --password "$CI_JOB_TOKEN"
  needs:
    - job: release-version
      artifacts: true
    - job: make-release
