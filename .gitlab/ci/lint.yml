# SPDX license header check for merge requests
lint-mr-spdx:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.py"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.go"
      when: always
  image: $NVCM_CI_IMAGE_ALPINE
  script:
    - |
      SPDX_ID="SPDX-License-Identifier: Apache-2.0"
      LICENSE_TEXT="Licensed under the Apache License"
      CHECK_DIRS="src/ ui/src/ ui/tests/ packages/ plugins/ components/ db/migrations/ scripts/ development/ installer/src/"
      EXTENSIONS="py ts tsx go"
      FAILED=0
      for dir in $CHECK_DIRS; do
        if [ ! -d "$dir" ]; then continue; fi
        for ext in $EXTENSIONS; do
          for file in $(find "$dir" -name "*.$ext" -not -path '*__pycache__*' -not -path '*node_modules*' -not -path '*.git*'); do
            if [ ! -s "$file" ]; then continue; fi
            if ! head -n 20 "$file" | grep -q "$SPDX_ID" || ! head -n 20 "$file" | grep -q "$LICENSE_TEXT"; then
              echo "  ✗ $file"
              FAILED=1
            fi
          done
        done
      done
      if [ "$FAILED" = "1" ]; then
        echo ""
        echo "ERROR: Files above are missing full SPDX license headers."
        echo "Run: uv run python scripts/add_spdx_headers.py"
        exit 1
      fi
      echo "✓ All files have valid SPDX license headers"

# Go linting for merge requests (nats-ready)
lint-mr-go:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "components/nats-ready/**/*.go"
        - "components/nats-ready/go.mod"
        - "components/nats-ready/go.sum"
      when: always
  image: $NVCM_CI_IMAGE_GO
  before_script:
    - apk add -q bash curl make git
    - cd components/nats-ready
  script:
    - go mod tidy
    - if [ -n "$(git status --porcelain)" ]; then echo "Uncommitted changes found. Failing pipeline."; git status; exit 1; fi

# Helm linting for merge requests
lint-mr-helm:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "deploy/helm/**"
      when: always
  image: $NVCM_CI_IMAGE_ALPINE
  before_script:
    - apk add -q bash curl make git
    - curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/
  script:
    # Register the two upstream helm repos. `helm dependency build` resolves
    # the URLs in Chart.yaml against the local repo registry by NAME, not URL,
    # and fails on a fresh runner with "no repository definition for ...".
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo add grafana https://grafana.github.io/helm-charts
    - helm repo update
    # Fetch subchart .tgz files into deploy/helm/charts/. They're gitignored
    # (see .gitignore: deploy/helm/charts/, deploy/helm/*.tgz), and helm
    # template/lint refuse to render when Chart.yaml lists deps that aren't on
    # disk — so this step is required for the observability subcharts
    # (prometheus-operator-crds, prometheus, grafana, loki, alloy).
    # Use `build` (not `update`) so the existing Chart.lock pins the versions;
    # CI fails loudly if the lock is out of sync with Chart.yaml.
    - helm dependency build deploy/helm/
    - helm lint deploy/helm/ -f deploy/helm/values-ci.yaml
    - helm template nv-config-manager deploy/helm/ -f deploy/helm/values-ci.yaml > /dev/null

lint-mr-ui:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "ui/**/*"
      when: always
  image: $NVCM_CI_IMAGE_NODE
  before_script:
    - cd ui
    - npm ci
  script:
    - npx eslint src/ --max-warnings 0

# Validate OpenAPI specs are up-to-date on merge requests
lint-mr-openapi:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *openapi-spec-paths
      when: always
  image: $NVCM_CI_IMAGE_PYTHON_313
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
  script:
    - uv run python scripts/generate_openapi.py --check
  allow_failure: false
