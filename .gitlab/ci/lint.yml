.network-template-paths: &network-template-paths
  - "packages/templates/**/*"
  - pyproject.toml
  - uv.lock

# Workflow modules under e.g. src/nv_config_manager/temporal/ngc/workflows/ are
# auto-registered as FastAPI routes by dynamic_endpoints.py, and shared
# helpers like nv_config_manager.common.auth.install_identity_probe install routes on
# every app -- so narrowing this to "**/api/**" silently misses those
# changes (this previously let an MR add a workflow without regenerating
# the spec).
.openapi-spec-paths: &openapi-spec-paths
  - "src/nv_config_manager/**/*.py"
  - "scripts/generate_openapi.py"
  - "developer-docs/openapi/**/*"
  - "pyproject.toml"
  - "uv.lock"

# Validate OpenAPI specs are up-to-date on merge requests
# =============================================================================
# Lint Stage
# =============================================================================

# Python linting for merge requests (src/)
lint-mr-py:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*.py"
        - "packages/**/*.py"
        - "plugins/**/*.py"
        - pyproject.toml
      when: always
  image: $NVCM_CI_IMAGE_PYTHON_313
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
  script:
    - uv run ruff format --check src/ packages/ plugins/
    - uv run ruff check src/ packages/ plugins/
    - uv run ty check src/nv_config_manager packages/dcim/src
    # ty doesn't have full coverage of mypy yet
    - uv run mypy src/nv_config_manager packages/dcim/src

