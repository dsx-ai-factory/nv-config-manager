---
# Offline CLI resources are independent of charts and container images. Release
# images are copied to all GitLab-configured destinations by release.yml.
.installer-job:
  image: $NVCM_CI_IMAGE_PYTHON_313
  tags: [dca, linux/amd64, docker]
  timeout: 1h

build:installer:
  extends: .installer-job
  stage: build
  before_script:
    - . deploy/helm/files/python-tooling.sh && nvcm_bootstrap_uv
  script:
    - bash deploy/airgapped/create-installer.sh "${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}" dist/installer
  artifacts:
    paths: [dist/installer/]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - installer/**/*
        - deploy/airgapped/**/*
        - deploy/helm/files/python-tooling.sh
        - .gitlab/ci/airgapped.yml
    - when: manual
      allow_failure: true

test:installer-offline:
  extends: .installer-job
  stage: test
  needs:
    - job: build:installer
      artifacts: true
  variables:
    PIP_NO_INDEX: "1"
  script:
    - bash .gitlab/ci/scripts/test_installer_bundle.sh dist/installer
  rules:
    - when: on_success

publish:installer-ngc:
  extends: .installer-job
  stage: release
  image: $NVCM_CI_IMAGE_NGC
  needs:
    - job: build:installer
      artifacts: true
    - job: test:installer-offline
      artifacts: false
    - job: release-version
      artifacts: true
  script:
    - bash .gitlab/ci/scripts/publish_installer_resource.sh "$RELEASE_VERSION" dist/installer
  rules:
    - if: $CI_COMMIT_TAG
