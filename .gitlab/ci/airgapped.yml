# =============================================================================
# Airgapped Bundle Pipeline
# =============================================================================
# Creates airgapped tarballs for NVIDIA Config Manager deployment using containerd runtime.
# The unified nv-config-manager chart is packaged from deploy/helm/, and container
# images are extracted from the chart templates.
#
# IMPORTANT: Airgapped bundle builds are MANUAL (click the play button to trigger)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
#   NGC_REGISTRY_TOKEN - Registry token for pulling required images
#   AWS_ACCESS_KEY_ID - AWS access key for S3 uploads
#   AWS_SECRET_ACCESS_KEY - AWS secret key for S3 uploads
#   S3_BUCKET - Air-gapped bundle bucket name
#   S3_REGION - AWS region for S3 uploads
# =============================================================================

# Shared variables for airgapped jobs
.airgapped-variables: &airgapped-variables
  AIRGAPPED_VERSION: "${CI_COMMIT_SHORT_SHA}"
  AIRGAPPED_OUTPUT_DIR: "${CI_PROJECT_DIR}/deploy/airgapped/output"
  CONTAINER_RUNTIME: "containerd"
  S3_BUCKET: "$NVCM_AIRGAPPED_S3_BUCKET"
  S3_REGION: "$NVCM_AIRGAPPED_S3_REGION"

# Template for airgapped jobs using containerd
.airgapped-template:
  image: $NVCM_CI_IMAGE_UBUNTU
  timeout: 3h
  variables:
    <<: *airgapped-variables
  before_script:
    - |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq curl tar gzip ca-certificates jq git wget openssl
      # Install yq for YAML parsing
      wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      chmod +x /usr/local/bin/yq
      echo "=== Installing containerd (matching version for daemon and ctr) ==="
      CTR_VERSION="1.7.10"
      curl --retry 3 --retry-delay 5 --retry-connrefused -sSL "https://github.com/containerd/containerd/releases/download/v${CTR_VERSION}/containerd-${CTR_VERSION}-linux-amd64.tar.gz" | tar xz -C /usr/local
      chmod +x /usr/local/bin/ctr /usr/local/bin/containerd
      echo "=== Installing crictl ==="
      CRICTL_VERSION="1.30.0"
      curl --retry 3 --retry-delay 5 --retry-connrefused -sSL "https://github.com/kubernetes-sigs/cri-tools/releases/download/v${CRICTL_VERSION}/crictl-v${CRICTL_VERSION}-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      chmod +x /usr/local/bin/crictl
      echo "=== Installing helm ==="
      curl --retry 3 --retry-delay 5 --retry-connrefused -sSL https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz | tar xz
      mv linux-amd64/helm /usr/local/bin/helm
      echo "=== Installing Python and uv (for docs build) ==="
      apt-get install -y -qq python3 python3-pip python3-venv
      curl -LsSf https://astral.sh/uv/install.sh | sh
      ln -sf $HOME/.local/bin/uv /usr/local/bin/uv
      mkdir -p /run/containerd
      echo "=== Starting containerd ==="
      nohup /usr/local/bin/containerd > /tmp/containerd.log 2>&1 &
      sleep 5
      echo "=== Verifying binaries ==="
      ctr version
      crictl version || true
      helm version

# Verify NGC API key is set (MANUAL - only needed for airgapped tarball builds)
check:airgapped-prerequisites:
  extends: .airgapped-template
  stage: prepare-airgapped
  interruptible: true
  timeout: 15m
  tags:
    - dca
    - linux/amd64
    - docker
  when: manual
  script:
    - |
      echo "Checking prerequisites..."
      test -n "${NGC_REGISTRY_TOKEN}" || (echo "Error: NGC_REGISTRY_TOKEN not set" && exit 1)
      echo "✓ NGC_REGISTRY_TOKEN is set"
      ctr version
      helm version
      # Verify chart exists
      test -f deploy/helm/Chart.yaml || (echo "Error: deploy/helm/Chart.yaml not found" && exit 1)
      echo "✓ Chart.yaml found"
      # Verify airgapped script exists
      test -f deploy/airgapped/create-airgapped.sh || (echo "Error: deploy/airgapped/create-airgapped.sh not found" && exit 1)
      echo "✓ create-airgapped.sh found"
      echo "✓ All prerequisites met"
  rules:
    - when: manual
      allow_failure: true

# Build airgapped tarballs for both AMD64 and ARM64 (MANUAL - click play button to trigger)
# Release builds use CI_COMMIT_TAG when run from an upstream mirrored tag.
build:airgapped:
  extends: .airgapped-template
  stage: build-airgapped
  tags:
    - dca
    - linux/amd64
    - docker
  script:
    - |
      echo "Building NVIDIA Config Manager airgapped packages (amd64 + arm64)..."
      
      # Determine version: use CI_COMMIT_TAG if on a tag, otherwise get latest git tag
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG}"
      else
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "${CI_COMMIT_SHORT_SHA}")
      fi
      echo "Using version: ${VERSION}"
      
      mkdir -p "${AIRGAPPED_OUTPUT_DIR}"
      
      cd deploy/airgapped
      chmod +x ./create-airgapped.sh
      ./create-airgapped.sh \
        --version "${VERSION}" \
        --output "${AIRGAPPED_OUTPUT_DIR}" \
        --runtime "${CONTAINER_RUNTIME}" \
        --ngc-api-key "${NGC_REGISTRY_TOKEN}"
      ls -lh "${AIRGAPPED_OUTPUT_DIR}"
      
      # Print manifest from one of the tarballs
      echo ""
      echo "📋 Package Manifest:"
      TARBALL=$(ls "${AIRGAPPED_OUTPUT_DIR}"/nv-config-manager-airgapped-*.tar.gz 2>/dev/null | head -1)
      if [ -n "${TARBALL}" ]; then
        # Extract tarball name without extension to get root folder name
        ROOT_FOLDER=$(basename "${TARBALL}" .tar.gz)
        tar -xzf "${TARBALL}" -O "${ROOT_FOLDER}/manifest.json" 2>/dev/null | jq '.' || tar -xzf "${TARBALL}" -O "${ROOT_FOLDER}/manifest.json" || true
      fi
  artifacts:
    name: "nv-config-manager-airgapped-${CI_COMMIT_SHORT_SHA}"
    paths:
      - deploy/airgapped/output/nv-config-manager-airgapped-*.tar.gz
      - deploy/airgapped/output/nv-config-manager-airgapped-*.tar.gz.sha256
    expire_in: 1 hour
  rules:
    - when: manual
      allow_failure: true

# Build for release tags (MANUAL - click play button to trigger)
build:airgapped-release:
  extends: build:airgapped
  variables:
    <<: *airgapped-variables
    AIRGAPPED_VERSION: "${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true

# Test the airgapped package
test:airgapped-extract:
  extends: .airgapped-template
  stage: test-airgapped
  interruptible: true
  timeout: 1h
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: build:airgapped
      artifacts: true
  rules:
    - when: on_success
  script:
    - |
      echo "Testing airgapped package extraction..."
      cd "${AIRGAPPED_OUTPUT_DIR}" || exit 1
      TARBALL=$(ls nv-config-manager-airgapped-*.tar.gz | head -1)
      if [ -z "${TARBALL}" ]; then
        echo "Error: No tarball found in ${AIRGAPPED_OUTPUT_DIR}"
        exit 1
      fi
      echo "Extracting ${TARBALL}..."
      mkdir -p extract && cd extract
      tar -xzf "../${TARBALL}"
      # Navigate into the extracted root folder (tarball extracts to its own folder)
      ROOT_FOLDER=$(basename "${TARBALL}" .tar.gz)
      if [ ! -d "${ROOT_FOLDER}" ]; then
        echo "Error: Expected root folder ${ROOT_FOLDER} not found after extraction"
        ls -la
        exit 1
      fi
      cd "${ROOT_FOLDER}"
      echo "Checking directory structure in ${ROOT_FOLDER}/..."
      test -d helm || (echo "Error: helm directory not found" && exit 1)
      test -d images || (echo "Error: images directory not found" && exit 1)
      test -f manifest.json || (echo "Error: manifest.json not found" && exit 1)
      
      echo "Checking Helm chart..."
      # Chart source is in helm/ directory for installer bundle use
      if test -f helm/Chart.yaml; then
        echo "✓ Found Helm chart in helm/"
      elif ls helm/nv-config-manager*.tgz 1>/dev/null 2>&1; then
        echo "✓ Found packaged nv-config-manager chart"
      else
        echo "Error: Chart.yaml not found in helm/"
        ls -la helm/
        exit 1
      fi
      
      echo "Checking container images..."
      test -f images/image-list.txt || echo "Warning: images/image-list.txt not found"
      # Use find to safely check for .tar files (handles empty globs)
      TAR_FILES=$(find images -maxdepth 1 -name "*.tar" -type f | sort)
      if [ -n "${TAR_FILES}" ]; then
        echo "Found image tar files:"
        echo "${TAR_FILES}" | sed 's|^|  - |'
        echo "Total: $(echo "${TAR_FILES}" | wc -l) image(s)"
      else
        echo "Warning: No image tar files found"
      fi
      
      echo "Checking deployment files..."
      test -d installer && echo "✓ installer/ found" || echo "Warning: installer/ not found"
      test -f upload-to-registry.sh && echo "✓ upload-to-registry.sh found" || (echo "Error: upload-to-registry.sh not found" && exit 1)
      test -d manifests && echo "✓ manifests/ found" || echo "Warning: manifests/ not found"
      
      echo "✓ Package structure verified"

# Verify checksums
test:airgapped-checksum:
  extends: .airgapped-template
  stage: test-airgapped
  interruptible: true
  timeout: 30m
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: build:airgapped
      artifacts: true
  rules:
    - when: on_success
  script:
    - |
      echo "Verifying checksums..."
      cd "${AIRGAPPED_OUTPUT_DIR}"
      for checksum_file in nv-config-manager-airgapped-*.tar.gz.sha256; do
        if [ -f "${checksum_file}" ]; then
          echo "Verifying ${checksum_file}..."
          sha256sum -c "${checksum_file}"
        fi
      done
      echo "✓ Checksums verified"

# Validate Helm chart from airgapped package
test:airgapped-helm-lint:
  extends: .airgapped-template
  stage: test-airgapped
  interruptible: true
  timeout: 30m
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: build:airgapped
      artifacts: true
  rules:
    - when: on_success
  script:
    - |
      echo "Linting Helm chart..."
      cd "${AIRGAPPED_OUTPUT_DIR}" || exit 1
      TARBALL=$(ls nv-config-manager-airgapped-*.tar.gz | head -1)
      if [ -z "${TARBALL}" ]; then
        echo "Error: No tarball found in ${AIRGAPPED_OUTPUT_DIR}"
        exit 1
      fi
      echo "Extracting ${TARBALL}..."
      mkdir -p extract && cd extract
      tar -xzf "../${TARBALL}"
      # Navigate into the extracted root folder (tarball extracts to its own folder)
      ROOT_FOLDER=$(basename "${TARBALL}" .tar.gz)
      if [ ! -d "${ROOT_FOLDER}" ]; then
        echo "Error: Expected root folder ${ROOT_FOLDER} not found after extraction"
        ls -la
        exit 1
      fi
      cd "${ROOT_FOLDER}"
      if [ ! -d "helm" ]; then
        echo "Error: helm directory not found after extraction"
        exit 1
      fi
      cd helm || exit 1
      
      # Lint the chart source (Chart.yaml is directly in helm/)
      if [ -f "Chart.yaml" ]; then
        echo "Linting chart source in helm/..."
        helm lint . || true
      fi
      # Also lint any packaged charts
      if ls nv-config-manager*.tgz 1>/dev/null 2>&1; then
        for chart in *.tgz; do
          echo "Linting packaged chart ${chart}..."
          helm lint "${chart}" || true
        done
      fi
      echo "✓ Helm chart linting complete"
  allow_failure: true

# Test loading images (verify image tarballs are valid)
test:airgapped-load-images:
  extends: .airgapped-template
  stage: test-airgapped
  interruptible: true
  timeout: 1h
  tags:
    - dca
    - linux/amd64
    - docker
  needs:
    - job: build:airgapped
      artifacts: true
  rules:
    - when: on_success
  script:
    - |
      echo "Testing image loading..."
      cd "${AIRGAPPED_OUTPUT_DIR}" || exit 1
      TARBALL=$(ls nv-config-manager-airgapped-*.tar.gz | head -1)
      if [ -z "${TARBALL}" ]; then
        echo "Error: No tarball found in ${AIRGAPPED_OUTPUT_DIR}"
        exit 1
      fi
      echo "Extracting ${TARBALL}..."
      mkdir -p extract && cd extract
      tar -xzf "../${TARBALL}"
      # Navigate into the extracted root folder (tarball extracts to its own folder)
      ROOT_FOLDER=$(basename "${TARBALL}" .tar.gz)
      if [ ! -d "${ROOT_FOLDER}" ]; then
        echo "Error: Expected root folder ${ROOT_FOLDER} not found after extraction"
        ls -la
        exit 1
      fi
      cd "${ROOT_FOLDER}"
      if [ ! -d "images" ]; then
        echo "Error: images directory not found after extraction"
        exit 1
      fi
      # Check if any .tar files exist using find (handles empty globs safely)
      TAR_FILES=$(find images -maxdepth 1 -name "*.tar" -type f | sort)
      if [ -z "${TAR_FILES}" ]; then
        echo "No image tar files found to test"
        echo "✓ Image test complete (no images to validate)"
        exit 0
      fi
      
      # Test all tar files
      FAILED_TARS=0
      TOTAL_TARS=0
      while IFS= read -r TAR_FILE; do
        [ -z "${TAR_FILE}" ] && continue
        TOTAL_TARS=$((TOTAL_TARS + 1))
        echo "Testing image tar file: ${TAR_FILE}"
        
        # Verify tar file exists and has content
        if [ ! -f "${TAR_FILE}" ]; then
          echo "✗ Error: Image tar file does not exist: ${TAR_FILE}"
          FAILED_TARS=$((FAILED_TARS + 1))
          continue
        fi
        
        if [ ! -s "${TAR_FILE}" ]; then
          echo "✗ Error: Image tar file is empty: ${TAR_FILE}"
          FAILED_TARS=$((FAILED_TARS + 1))
          continue
        fi
        
        FILE_SIZE=$(stat -c%s "${TAR_FILE}" 2>/dev/null || stat -f%z "${TAR_FILE}" 2>/dev/null || echo "unknown")
        echo "  File size: ${FILE_SIZE} bytes"
        
        # Verify it's a valid tar archive
        if ! tar -tf "${TAR_FILE}" >/dev/null 2>&1; then
          echo "✗ Error: Image tar file is not a valid tar archive: ${TAR_FILE}"
          FAILED_TARS=$((FAILED_TARS + 1))
          continue
        fi
        
        echo "  ✓ Image tar file is a valid tar archive"
        
        # Try importing (may fail in CI due to containerd state, but that's OK)
        echo "  Attempting to import image..."
        if ctr image import "${TAR_FILE}" 2>&1; then
          echo "  ✓ Image imported successfully"
        else
          echo "  Note: Import failed (may be expected in CI - tar file structure is still valid)"
        fi
      done <<< "${TAR_FILES}"
      
      # Report results
      echo ""
      echo "=== Image Tar File Validation Summary ==="
      echo "Total tar files tested: ${TOTAL_TARS}"
      echo "Valid tar files: $((TOTAL_TARS - FAILED_TARS))"
      echo "Invalid tar files: ${FAILED_TARS}"
      
      if [ ${FAILED_TARS} -gt 0 ]; then
        echo ""
        echo "✗ Error: ${FAILED_TARS} image tar file(s) failed validation"
        exit 1
      fi
      
      echo "✓ All image tar files are valid"
      echo "✓ Image test complete"

# Upload to S3 (both amd64 and arm64 tarballs)
publish:airgapped-s3:
  stage: build-airgapped
  timeout: 1h
  tags:
    - dca
    - linux/amd64
    - docker
  image:
    name: $NVCM_CI_IMAGE_AWS_CLI
    entrypoint: [""]
  needs:
    - job: build:airgapped
      artifacts: true
  variables:
    <<: *airgapped-variables
  before_script:
    - echo "Preparing S3 upload..."
  script:
    - |
      echo "Uploading to S3 bucket: ${S3_BUCKET}"
      cd "${AIRGAPPED_OUTPUT_DIR}"
      
      # Find actual tarballs (don't assume version - detect from files)
      TARBALLS=$(ls nv-config-manager-airgapped-*.tar.gz 2>/dev/null | grep -v '.sha256' || true)
      
      if [ -z "${TARBALLS}" ]; then
        echo "❌ Error: No airgapped tarballs found in ${AIRGAPPED_OUTPUT_DIR}"
        ls -la
        exit 1
      fi
      
      echo "Found tarballs:"
      echo "${TARBALLS}"
      
      # Extract version from first tarball filename (nv-config-manager-airgapped-VERSION-ARCH.tar.gz)
      FIRST_TARBALL=$(echo "${TARBALLS}" | head -1)
      RELEASE_VERSION=$(echo "${FIRST_TARBALL}" | sed 's/nv-config-manager-airgapped-\(.*\)-\(amd64\|arm64\)\.tar\.gz/\1/')
      echo "Detected version: ${RELEASE_VERSION}"
      
      UPLOADED=0
      for TARBALL in ${TARBALLS}; do
        CHECKSUM="${TARBALL}.sha256"
        ARCH=$(echo "${TARBALL}" | sed 's/.*-\(amd64\|arm64\)\.tar\.gz/\1/')
        
        echo "Uploading ${TARBALL} to s3://${S3_BUCKET}/${RELEASE_VERSION}/"
        aws s3 cp "${TARBALL}" "s3://${S3_BUCKET}/${RELEASE_VERSION}/${TARBALL}" --region "${S3_REGION}"
        echo "✓ Uploaded ${TARBALL}"
        UPLOADED=$((UPLOADED + 1))
        
        # Upload checksum
        if [ -f "${CHECKSUM}" ]; then
          aws s3 cp "${CHECKSUM}" "s3://${S3_BUCKET}/${RELEASE_VERSION}/${CHECKSUM}" --region "${S3_REGION}"
          echo "✓ Uploaded ${CHECKSUM}"
        fi
        
        # Also upload to 'latest' for convenience (only on tags or main branch)
        if [ -n "${CI_COMMIT_TAG}" ] || [ "${CI_COMMIT_BRANCH}" = "main" ]; then
          echo "Uploading to s3://${S3_BUCKET}/latest/"
          aws s3 cp "${TARBALL}" "s3://${S3_BUCKET}/latest/nv-config-manager-airgapped-latest-${ARCH}.tar.gz" --region "${S3_REGION}"
          if [ -f "${CHECKSUM}" ]; then
            aws s3 cp "${CHECKSUM}" "s3://${S3_BUCKET}/latest/nv-config-manager-airgapped-latest-${ARCH}.tar.gz.sha256" --region "${S3_REGION}"
          fi
        fi
      done
      
      if [ "${UPLOADED}" -eq 0 ]; then
        echo "❌ Error: No files were uploaded"
        exit 1
      fi
      
      echo ""
      echo "✓ S3 upload complete (${UPLOADED} tarballs uploaded)"
      echo ""
      echo "Download URLs:"
      echo "  AMD64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${RELEASE_VERSION}/nv-config-manager-airgapped-${RELEASE_VERSION}-amd64.tar.gz"
      echo "  ARM64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${RELEASE_VERSION}/nv-config-manager-airgapped-${RELEASE_VERSION}-arm64.tar.gz"
  rules:
    - when: on_success

# Prepare release information
prepare:airgapped-release-info:
  stage: publish-airgapped
  timeout: 15m
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  needs:
    - job: build:airgapped-release
  before_script:
    - apk add --no-cache bash
  script:
    - |
      echo "Extracting chart information for release notes..."
      
      # Get chart version from Chart.yaml
      CHART_VERSION=$(grep '^version:' deploy/helm/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
      APP_VERSION=$(grep '^appVersion:' deploy/helm/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'" || true)
      APP_VERSION="${APP_VERSION:-$CHART_VERSION}"
      
      # Create release info
      cat > release.env << EOF
      - \`nv-config-manager\` chart version: ${CHART_VERSION}
      - App version: ${APP_VERSION:-N/A}
      EOF
      
      echo "Chart info for release notes:"
      cat release.env
  artifacts:
    name: "release.env"
    paths:
      - release.env
    expire_in: "1 hour"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

# Upload to S3 for release tags
publish:airgapped-s3-release:
  stage: publish-airgapped
  timeout: 1h
  tags:
    - dca
    - linux/amd64
    - docker
  image:
    name: $NVCM_CI_IMAGE_AWS_CLI
    entrypoint: [""]
  needs:
    - job: build:airgapped-release
      artifacts: true
  variables:
    <<: *airgapped-variables
  before_script:
    - echo "Preparing S3 upload for release..."
  script:
    - |
      echo "Uploading release to S3 bucket: ${S3_BUCKET}"
      cd "${AIRGAPPED_OUTPUT_DIR}"
      
      RELEASE_VERSION="${CI_COMMIT_TAG}"
      
      # Upload both architecture tarballs
      for ARCH in amd64 arm64; do
        TARBALL="nv-config-manager-airgapped-${RELEASE_VERSION}-${ARCH}.tar.gz"
        CHECKSUM="${TARBALL}.sha256"
        
        if [ -f "${TARBALL}" ]; then
          echo "Uploading ${TARBALL} to s3://${S3_BUCKET}/${RELEASE_VERSION}/"
          aws s3 cp "${TARBALL}" "s3://${S3_BUCKET}/${RELEASE_VERSION}/${TARBALL}" --region "${S3_REGION}"
          echo "✓ Uploaded ${TARBALL}"
          
          # Upload checksum
          if [ -f "${CHECKSUM}" ]; then
            aws s3 cp "${CHECKSUM}" "s3://${S3_BUCKET}/${RELEASE_VERSION}/${CHECKSUM}" --region "${S3_REGION}"
            echo "✓ Uploaded ${CHECKSUM}"
          fi
          
          # Also upload to 'latest' for releases
          echo "Uploading to s3://${S3_BUCKET}/latest/"
          aws s3 cp "${TARBALL}" "s3://${S3_BUCKET}/latest/nv-config-manager-airgapped-latest-${ARCH}.tar.gz" --region "${S3_REGION}"
          if [ -f "${CHECKSUM}" ]; then
            aws s3 cp "${CHECKSUM}" "s3://${S3_BUCKET}/latest/nv-config-manager-airgapped-latest-${ARCH}.tar.gz.sha256" --region "${S3_REGION}"
          fi
        else
          echo "Warning: Tarball not found: ${TARBALL}"
        fi
      done
      
      echo ""
      echo "✓ S3 release upload complete"
      echo ""
      echo "Download URLs:"
      echo "  AMD64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${RELEASE_VERSION}/nv-config-manager-airgapped-${RELEASE_VERSION}-amd64.tar.gz"
      echo "  ARM64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${RELEASE_VERSION}/nv-config-manager-airgapped-${RELEASE_VERSION}-arm64.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

# Print S3 download links without creating Git tags in the mirror.
publish:airgapped-release:
  stage: publish-airgapped
  timeout: 15m
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  needs:
    - job: build:airgapped-release
    - publish:airgapped-s3-release
    - job: "prepare:airgapped-release-info"
      artifacts: true
  variables:
    S3_BUCKET: "$NVCM_AIRGAPPED_S3_BUCKET"
    S3_REGION: "$NVCM_AIRGAPPED_S3_REGION"
  before_script:
    - echo "Preparing airgapped release links..."
  script:
    - |
      echo "Skipping GitLab release creation so the mirror does not create local Git tags."
      echo "Airgapped bundle amd64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${CI_COMMIT_TAG}/nv-config-manager-airgapped-${CI_COMMIT_TAG}-amd64.tar.gz"
      echo "Airgapped bundle arm64: https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com/${CI_COMMIT_TAG}/nv-config-manager-airgapped-${CI_COMMIT_TAG}-arm64.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

# Scheduled/nightly airgapped builds (manual trigger)
build:airgapped-scheduled:
  extends: build:airgapped
  variables:
    <<: *airgapped-variables
    AIRGAPPED_VERSION: "nightly-${CI_COMMIT_SHORT_SHA}"
  artifacts:
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: manual
      allow_failure: true
