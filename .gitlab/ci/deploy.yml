---
# =============================================================================
# Artifact-affecting paths - used to skip builds for non-artifact changes
# =============================================================================
# These paths affect the published artifacts (images and charts):
#   - build/**          - Dockerfiles and build configurations
#   - components/**     - Go code (nats-ready), Nautobot config
#   - packages/**       - Public Python libraries
#   - plugins/**        - Installable extension implementations
#   - db/**             - Database migrations
#   - deploy/helm/**    - Helm charts
#   - src/**            - Python source code
#   - ui/**             - Frontend code
#   - pyproject.toml    - Python dependencies
#   - uv.lock           - Python lock file
# =============================================================================

.artifact-paths: &artifact-paths
  - "build/**/*"
  - "components/**/*"
  - "packages/**/*"
  - "plugins/**/*"
  - "db/**/*"
  - "deploy/helm/**/*"
  - "src/**/*"
  - "ui/**/*"
# =============================================================================
# Deploy Stage
# =============================================================================

# Historical main-branch RC version calculation is disabled. Releases are now
# driven only by upstream Git tags mirrored into GitLab.
determine-new-version:
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  rules:
    - when: never
  before_script:
    - apk add --no-cache bash curl git jq coreutils
  script:
    - echo "Main-branch release version calculation is disabled; publish an upstream semver tag to release."
  artifacts:
    reports:
      dotenv: build.env
  needs:
    - job: docker-manifest-main
      optional: false
    - job: test-main-py
      optional: true
    - job: test-main-network-templates
      optional: true

# Historical main-branch values preview is disabled. Tag release jobs update
# packaged chart values in-place without committing back to the mirror.
update-image-tags:
  image: $NVCM_CI_IMAGE_ALPINE
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    - when: never
  needs:
    - job: determine-new-version
      artifacts: true
  variables:
    VALUES_FILE_PATH: deploy/helm/values.yaml
  before_script:
    - apk add --no-cache git yq
  script:
    - echo "Previewing image tags and chart version for $NEW_VERSION"
    # Update chart version in Chart.yaml (version and appVersion)
    - yq -i '.version = "'$NEW_VERSION'"' deploy/helm/Chart.yaml
    - yq -i '.appVersion = "'$NEW_VERSION'"' deploy/helm/Chart.yaml
    # Update all image tags in global.images section
    - yq -i '.global.images.nvConfigManager.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.nvConfigManagerUi.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.kea.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.keaAdmin.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.nautobot.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.natsReady.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalServer.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalBootstrap.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalUi.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - git diff -- deploy/helm/Chart.yaml $VALUES_FILE_PATH
    - echo "Skipping commit/push so the mirror does not diverge from upstream."
