sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

# SonarScanner CLI otherwise treats the entire repository as production code.
# Keep test code analyzable with test-specific rules while excluding it from
# production metrics and coverage calculations.
sonar.sources=.
sonar.tests=.
# Include executable test code without treating YAML/JSON fixtures under test
# resource directories as analyzable test source.
sonar.test.inclusions=**/tests/**/*.py,**/tests/**/*.js,**/tests/**/*.ts,**/tests/**/*.tsx,**/*.spec.ts,**/*_test.go
sonar.test.exclusions=bindings/go/**

# Python version for more precise analysis
sonar.python.version=3.11, 3.13

# Python coverage reports (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml,components/nautobot/coverage.xml,packages/templates/coverage.xml,installer/coverage.xml

# Exclude generated Go clients and the generated MSW service worker, Helm
# templates (Go templating), tests from the production source set, and mock
# fixture payloads. Test files remain in the test scope above; generated code
# is intentionally not analyzed at all.
sonar.exclusions=bindings/go/**,ui/public/mockServiceWorker.js,deploy/helm/templates/**,**/tests/**,**/*.spec.ts,**/*_test.go,development/mock_topology/context/**/*.json

# Exclude UI code from coverage analysis (E2E tests don't produce line coverage)
# Python code will still be checked for coverage
sonar.coverage.exclusions=ui/**/*

# Reduce duplication detection for intentionally repetitive code:
# - Mock data and handlers
# - E2E test files (similar test patterns across workflows)
# - UI components with similar card layouts
sonar.cpd.exclusions=ui/src/mocks/**/*,ui/tests/**/*,**/apiMocks.ts,**/*.spec.ts

# Duplication thresholds - increase to reduce noise from small similar code blocks
sonar.cpd.python.minimumtokens=500
sonar.cpd.python.minimumlines=500
