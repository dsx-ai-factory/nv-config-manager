name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_rc_tag:
        description: "Existing RC tag to promote, e.g. 1.2.3-rc.4."
        required: true
        type: string
      target_tag:
        description: "Optional stable tag, e.g. 1.2.3. Leave empty to derive it from source_rc_tag."
        required: false
        type: string

concurrency:
  group: release-tagging-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Promotion
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      go_source_tag: ${{ steps.resolve.outputs.go_source_tag }}
      go_target_tag: ${{ steps.resolve.outputs.go_target_tag }}
      source_rc_tag: ${{ steps.resolve.outputs.source_rc_tag }}
      tags_exist: ${{ steps.resolve.outputs.tags_exist }}
      target_tag: ${{ steps.resolve.outputs.target_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "Only repository admins may promote release tags. ${GITHUB_ACTOR} has ${permission} permission."
            exit 1
          fi

      - name: Resolve promotion
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RC_TAG: ${{ inputs.source_rc_tag }}
          INPUT_TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

          rc_re='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          stable_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          if ! printf '%s\n' "$SOURCE_RC_TAG" | grep -Eq "$rc_re"; then
            echo "source_rc_tag must match X.Y.Z-rc.N. Got: ${SOURCE_RC_TAG}"
            exit 1
          fi

          if [ -n "$INPUT_TARGET_TAG" ]; then
            target_tag="$INPUT_TARGET_TAG"
          else
            target_tag="${SOURCE_RC_TAG%%-rc.*}"
          fi

          if ! printf '%s\n' "$target_tag" | grep -Eq "$stable_re"; then
            echo "target_tag must match X.Y.Z. Got: ${target_tag}"
            exit 1
          fi

          if [ "${SOURCE_RC_TAG%%-rc.*}" != "$target_tag" ]; then
            echo "target_tag ${target_tag} does not match RC base ${SOURCE_RC_TAG%%-rc.*}."
            exit 1
          fi

          commit="$(git rev-parse "${SOURCE_RC_TAG}^{commit}")"
          go_source_tag="bindings/go/v${SOURCE_RC_TAG}"
          go_target_tag="bindings/go/v${target_tag}"
          if ! git rev-parse --verify "refs/tags/${go_source_tag}" >/dev/null 2>&1; then
            echo "Go module RC tag ${go_source_tag} does not exist."
            exit 1
          fi
          if [ "$(git rev-parse "${go_source_tag}^{commit}")" != "$commit" ]; then
            echo "Go module RC tag ${go_source_tag} does not match ${SOURCE_RC_TAG}."
            exit 1
          fi
          target_exists=false
          go_target_exists=false
          if git rev-parse --verify "refs/tags/${target_tag}" >/dev/null 2>&1; then
            target_exists=true
            if [ "$(git rev-parse "${target_tag}^{commit}")" != "$commit" ]; then
              echo "Tag ${target_tag} exists at a different commit."
              exit 1
            fi
          fi
          if git rev-parse --verify "refs/tags/${go_target_tag}" >/dev/null 2>&1; then
            go_target_exists=true
            if [ "$(git rev-parse "${go_target_tag}^{commit}")" != "$commit" ]; then
              echo "Tag ${go_target_tag} exists at a different commit."
              exit 1
            fi
          fi
          if [ "$target_exists" != "$go_target_exists" ]; then
            echo "Stable platform and Go module tags must either both exist or both be absent."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit" "origin/${DEFAULT_BRANCH}"; then
            .github/scripts/validate-maintenance-release-source \
              "$commit" "$target_tag" "$DEFAULT_BRANCH"
          fi

          if ! git show "${commit}:CHANGELOG.md" \
            | .github/scripts/extract-release-notes "$target_tag" >/dev/null; then
            echo "Finalize the ${target_tag} section in CHANGELOG.md before promotion."
            exit 1
          fi

          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "go_source_tag=${go_source_tag}" >> "$GITHUB_OUTPUT"
          echo "go_target_tag=${go_target_tag}" >> "$GITHUB_OUTPUT"
          echo "source_rc_tag=${SOURCE_RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags_exist=${target_exists}" >> "$GITHUB_OUTPUT"
          echo "target_tag=${target_tag}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
          GO_SOURCE_TAG: ${{ steps.resolve.outputs.go_source_tag }}
          GO_TARGET_TAG: ${{ steps.resolve.outputs.go_target_tag }}
          SOURCE_RC_TAG: ${{ steps.resolve.outputs.source_rc_tag }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
        run: |
          {
            echo "### Release promotion request"
            echo ""
            echo "- Source RC: \`${SOURCE_RC_TAG}\`"
            echo "- Stable tag: \`${TARGET_TAG}\`"
            echo "- Go source RC: \`${GO_SOURCE_TAG}\`"
            echo "- Go stable tag: \`${GO_TARGET_TAG}\`"
            echo "- Commit: \`${COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Create Stable Tag
    needs: validate
    runs-on: linux-amd64-cpu4
    environment: release-tagging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push stable tags
        if: needs.validate.outputs.tags_exist != 'true'
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          GO_TARGET_TAG: ${{ needs.validate.outputs.go_target_tag }}
          SOURCE_RC_TAG: ${{ needs.validate.outputs.source_rc_tag }}
          TARGET_TAG: ${{ needs.validate.outputs.target_tag }}
          TAG_PUSH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TARGET_TAG" "$COMMIT" -m "Promote ${SOURCE_RC_TAG} to ${TARGET_TAG}"
          git tag -a "$GO_TARGET_TAG" "$COMMIT" -m "Promote Go bindings to ${TARGET_TAG}"

          git remote set-url origin "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin "refs/tags/${TARGET_TAG}" "refs/tags/${GO_TARGET_TAG}"

          echo "Promoted ${SOURCE_RC_TAG} to ${TARGET_TAG} and created ${GO_TARGET_TAG} at ${COMMIT}."

      - name: Publish GitHub Release
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || github.token }}
          TARGET_TAG: ${{ needs.validate.outputs.target_tag }}
        run: |
          set -euo pipefail

          git show "${COMMIT}:CHANGELOG.md" \
            | .github/scripts/extract-release-notes "$TARGET_TAG" \
            > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TARGET_TAG} already exists."
          else
            gh release create "$TARGET_TAG" \
              --verify-tag \
              --title "NVIDIA Config Manager ${TARGET_TAG}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TARGET_TAG}"
          echo "Published ${release_url}"
          echo "- GitHub Release: ${release_url}" >> "$GITHUB_STEP_SUMMARY"
