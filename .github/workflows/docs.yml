name: Docs

on:
  push:
    branches:
      - main
      - "pull-request/*"
    paths:
      - "deploy/helm/dashboards/**"
      - "docs/**"
      - "scripts/generate_openapi.py"
      - "installer/scripts/screenshot_tui.py"
      - "Makefile"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint Docs
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: &actions_checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: &setup_proxy_cache nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c
      - uses: &actions_setup_node actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Check OpenAPI specs
        run: make openapi-check
      - name: Check docs assets
        run: make docs-assets-check
      - name: Lint the docs
        run: make docs-lint
      - name: Check Fern configuration and markdown
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: make docs-lint-fern

  preview:
    name: Preview Docs
    needs: lint
    if: startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu4
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Get PR info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Fern
        run: npm install -g fern-api
      - name: Generate preview
        id: preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_ID: ${{ github.event.repository.name }}-pr-${{ fromJSON(steps.get-pr-info.outputs.pr-info).number }}
        run: |
          set -euo pipefail
          if [ -z "${FERN_TOKEN:-}" ]; then
            echo "FERN_TOKEN is not configured; skipping docs preview."
            exit 0
          fi

          output="$(cd docs && fern generate --docs --preview --id "${PREVIEW_ID}" --force 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

          preview_url="$(printf '%s\n' "$output" | sed -nE 's#.*(https://[^[:space:])]+-preview-[^[:space:])]+).*#\1#p' | head -n 1)"
          if [ -z "$preview_url" ]; then
            echo "Fern preview completed, but no preview URL was found."
            exit 1
          fi
          # Remove accidental zero-width space bytes if present in CLI output.
          preview_url="$(printf '%s' "$preview_url" | tr -d '\342\200\213')"

          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${preview_url}"
      - name: Comment preview URL
        if: steps.preview.outputs.preview_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          marker="<!-- nv-config-manager-docs-preview -->"
          body="$(printf '%s\nDocs preview: %s' "$marker" "$PREVIEW_URL")"

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --method PATCH \
              --field body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --field body="$body" >/dev/null
          fi

  publish:
    name: Publish Docs
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Fern
        run: npm install -g fern-api
      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FERN_TOKEN:-}" ]; then
            echo "FERN_TOKEN is required to publish docs."
            exit 1
          fi
          make docs-publish-in-ci
