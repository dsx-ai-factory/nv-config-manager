name: Public CI

on:
  push:
    branches:
      - main
      - "pull-request/*"

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NAUTOBOT_PYTHON_VERSION: "3.11"
  HELM_VERSION: "v3.15.3"

jobs:
  python-lint:
    name: Python Lint And Types
    runs-on: linux-amd64-cpu8
    permissions:
      contents: read
    steps:
      - uses: &actions_checkout actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: &setup_proxy_cache nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c
      - uses: &actions_setup_python actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: &setup_uv astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
      - name: Sorted list check (keep-sorted)
        run: make sort-check
      - run: uv sync --frozen
      - run: uv run ruff format --check src/ packages plugins/dcim/nautobot-2x .github/scripts/check-cnpg-podmonitors.py .gitlab/ci/scripts/wait_for_argocd.py .gitlab/ci/scripts/test_wait_for_argocd.py
      - run: uv run ruff check src/ packages plugins/dcim/nautobot-2x .github/scripts/check-cnpg-podmonitors.py .gitlab/ci/scripts/wait_for_argocd.py .gitlab/ci/scripts/test_wait_for_argocd.py
      - run: uv run ty check src/nv_config_manager/ packages/dcim/src packages/workflows .github/scripts/check-cnpg-podmonitors.py .gitlab/ci/scripts/wait_for_argocd.py .gitlab/ci/scripts/test_wait_for_argocd.py
      - run: uv run mypy src/nv_config_manager packages/dcim/src packages/workflows .github/scripts/check-cnpg-podmonitors.py .gitlab/ci/scripts/wait_for_argocd.py .gitlab/ci/scripts/test_wait_for_argocd.py --no-incremental
      - name: Installer lint
        working-directory: installer
        run: |
          uv sync --frozen
          uv run ruff format --check src/
          uv run ruff check src/
      - name: Nautobot lint
        working-directory: components/nautobot
        run: |
          uv sync --frozen
          uv run ruff format --check nv_config_manager_auth nv_config_manager_jobs nautobot_config.py
          uv run ruff check nv_config_manager_auth nv_config_manager_jobs nautobot_config.py

  nautobot-app-overlays:
    name: Nautobot Overlays Lint And Build
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.NAUTOBOT_PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - name: Lint and build app package
        working-directory: components/nautobot/nautobot-app-overlays
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
        run: |
          uv sync --all-extras --dev
          uv run ruff format --check nautobot_app_overlays tasks.py
          uv run ruff check nautobot_app_overlays tasks.py
          uv build --out-dir dist --clear

  nautobot-nv-config-manager:
    name: Nautobot NV Config Manager Lint And Build
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.NAUTOBOT_PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - name: Lint and build app package
        working-directory: components/nautobot/nautobot-nv-config-manager
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
        run: |
          uv sync --all-extras --dev
          uv run ruff format --check nv_config_manager
          uv run ruff check nv_config_manager
          uv build --out-dir dist --clear

  spdx:
    name: SPDX Headers
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - name: Check source headers
        run: |
          SPDX_ID="SPDX-License-Identifier: Apache-2.0"
          LICENSE_TEXT="Licensed under the Apache License"
          CHECK_DIRS="src/ ui/src/ ui/tests/ packages/ plugins/ components/ db/migrations/ scripts/ development/ installer/src/"
          EXTENSIONS="py ts tsx go"
          FAILED=0
          for dir in $CHECK_DIRS; do
            if [ ! -d "$dir" ]; then continue; fi
            for ext in $EXTENSIONS; do
              while IFS= read -r file; do
                if [ ! -s "$file" ]; then continue; fi
                if ! head -n 20 "$file" | grep -q "$SPDX_ID" || ! head -n 20 "$file" | grep -q "$LICENSE_TEXT"; then
                  echo "Missing full SPDX header: $file"
                  FAILED=1
                fi
              done < <(find "$dir" -name "*.$ext" -not -path '*__pycache__*' -not -path '*node_modules*' -not -path '*.git*')
            done
          done
          exit "$FAILED"

  python-tests:
    name: Python Tests
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/dcim/tests -v
      - run: uv run pytest -n auto --cov=src/nv_config_manager --cov-report=xml:coverage.xml --cov-report=term
      - name: Nautobot tests
        working-directory: components/nautobot
        run: |
          uv sync --frozen
          uv run pytest tests/ -n auto --cov=nv_config_manager_auth --cov=nv_config_manager_jobs --cov-report=xml:coverage.xml --cov-report=term
      - uses: &upload_artifact actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-test-artifacts
          path: |
            coverage.xml
            components/nautobot/coverage.xml

  installer-tests:
    name: Installer Tests
    runs-on: linux-amd64-cpu8
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - name: Test installer
        working-directory: installer
        run: |
          uv sync --frozen
          uv run pytest tests/ -v --cov=src/nv_config_manager_installer --cov-report=xml:coverage.xml --cov-report=term
      - uses: *upload_artifact
        if: always()
        with:
          name: installer-test-artifacts
          path: installer/coverage.xml

  network-template-tests:
    name: Network Template Tests
    runs-on: linux-amd64-cpu8
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/templates/tests -v --cov=nv_config_manager_templates --cov-report=xml:packages/templates/coverage.xml --cov-report=term
      - uses: *upload_artifact
        if: always()
        with:
          name: network-template-test-artifacts
          path: packages/templates/coverage.xml

  go-lint:
    name: Go Module Check
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: &actions_setup_go actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: components/nats-ready/go.sum
      - name: Verify go.mod is tidy
        working-directory: components/nats-ready
        run: |
          go_version="$(go env GOVERSION)"
          test "${go_version}" = "go1.26.6"
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  helm:
    name: Helm Lint And Template
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Helm
        run: |
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          # Official v3.15.3 Linux AMD64 release checksum. Update this value
          # together with HELM_VERSION.
          HELM_SHA256=ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSLO \
            "https://get.helm.sh/${HELM_ARCHIVE}"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSLO \
            "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          grep -Fqx "${HELM_SHA256}  ${HELM_ARCHIVE}" "${HELM_ARCHIVE}.sha256sum"
          sha256sum -c "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Install YAML parser from internal package cache
        run: |
          # PyYAML 6.0.3 cp313 manylinux2014 x86_64 wheel. Update this hash
          # when PYTHON_VERSION or the Helm runner architecture changes.
          PYYAML_SHA256=0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6
          python -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes \
            -r <(printf 'PyYAML==6.0.3 --hash=sha256:%s\n' "$PYYAML_SHA256")
      - name: Build chart dependencies
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build deploy/helm/
      - run: helm lint deploy/helm/ --values deploy/helm/values-ci.yaml
      - run: helm template test deploy/helm/ --values deploy/helm/values-ci.yaml >/tmp/nvcm-helm.yaml
      - name: Temporal history shard render
        run: bash deploy/helm/tests/temporal-history-shards.sh
      - name: CNPG PodMonitor ownership render
        run: |
          # A CloudNativePG operator may own/delete a PodMonitor whose name is
          # identical to its Cluster. Chart-owned monitors must use distinct,
          # release-scoped names or ArgoCD will wait forever for deleted CRs.
          # Exercise the fullname truncation path. Each monitor must retain a
          # cluster-specific identity even when the release name is very long.
          long_release_name="$(printf 'r%.0s' {1..53})"
          helm template "$long_release_name" deploy/helm/ \
            --values deploy/helm/values-ci.yaml >/tmp/nvcm-helm-long-release.yaml
          python .github/scripts/check-cnpg-podmonitors.py \
            /tmp/nvcm-helm.yaml \
            /tmp/nvcm-helm-long-release.yaml
      - name: Bundled NATS without Nautobot render
        run: |
          helm template test deploy/helm/ \
            --values deploy/helm/values-ci.yaml \
            --set-string dcim.provider=netbox \
            --set-string dcim.server=https://netbox.example.com \
            --set-string dcim.publicUrl=https://netbox.example.com \
            --set nautobot.enabled=false \
            --set externalServices.nautobot.local=false \
            --set externalServices.nats.local=true \
            --set-string externalServices.nats.authMethod=password \
            --set-string secrets.vault.paths.dcim.path=nv-config-manager/ci/dcim \
            --set-string secrets.vault.paths.nats.path=nv-config-manager/ci/nats \
            >/tmp/nvcm-external-dcim.yaml
          grep -q '^  name: test-nv-config-manager-nats$' /tmp/nvcm-external-dcim.yaml
          if grep -q '^  name: test-nv-config-manager-nautobot$' /tmp/nvcm-external-dcim.yaml; then
            echo "ERROR: Nautobot rendered for an external DCIM deployment"
            exit 1
          fi
      - name: Temporal codec CORS render
        run: |
          expected="cors_origins = https://ci.config-manager.example.com,https://temporal.ci.config-manager.example.com"
          if ! grep -qF "$expected" /tmp/nvcm-helm.yaml; then
            echo "ERROR: rendered Temporal API CORS allowlist is missing the Temporal Web origin"
            grep -nE 'temporal\.api|cors_origins' /tmp/nvcm-helm.yaml || true
            exit 1
          fi
      - name: Project-owned image pull secrets render
        run: |
          set -euo pipefail
          image_args=()
          for image_name in nvConfigManager nvConfigManagerUi kea keaAdmin nautobot natsReady temporalServer temporalBootstrap temporalUi; do
            image_args+=(--set-string "global.images.${image_name}.repository=private.registry.test/${image_name}")
          done
          helm template test deploy/helm/ \
            --values deploy/helm/values-ci.yaml \
            --set-string 'global.imagePullSecrets[0]=image-pull-secret-test' \
            "${image_args[@]}" >/tmp/nvcm-private-images.yaml
          awk '
            BEGIN { RS = "---"; checked = 0; failed = 0 }
            {
              if ($0 !~ /kind: (Pod|Deployment|StatefulSet|DaemonSet|Job|CronJob)/) next
              if ($0 !~ /image:[[:space:]]*"?private\.registry\.test\//) next
              checked++
              kind = "unknown"
              name = "unknown"
              line_count = split($0, lines, "\n")
              in_metadata = 0
              for (i = 1; i <= line_count; i++) {
                if (lines[i] ~ /^kind:[[:space:]]+/) {
                  kind = lines[i]
                  sub(/^kind:[[:space:]]+/, "", kind)
                }
                if (lines[i] == "metadata:") {
                  in_metadata = 1
                  continue
                }
                if (in_metadata && lines[i] ~ /^  name:[[:space:]]+/) {
                  name = lines[i]
                  sub(/^  name:[[:space:]]+/, "", name)
                  break
                }
                if (in_metadata && lines[i] ~ /^[^[:space:]]/) in_metadata = 0
              }
              if ($0 !~ /imagePullSecrets:/ || $0 !~ /- name: image-pull-secret-test/) {
                printf "ERROR: %s/%s uses a project-owned image without imagePullSecrets\n", kind, name
                failed++
              }
            }
            END {
              printf "%d workload(s) using project-owned images checked; %d missing imagePullSecrets\n", checked, failed
              if (checked == 0 || failed != 0) exit 1
            }
          ' /tmp/nvcm-private-images.yaml
      - name: Probe SLO customLabels render
        run: |
          # Blackbox Probe samples don't inherit the CR's metadata.labels, so
          # global.customLabels must be surfaced under each Probe's
          # spec.targets.staticConfig.labels for SLO rules to select the series.
          # Render-time check only (no cluster) so it stays out of the slow
          # kind-integration path.
          helm template test deploy/helm/ \
            --values deploy/helm/values-ci.yaml \
            --set monitoring.probes.enabled=true \
            --set-string global.customLabels.include_in_slo=true \
            --show-only templates/monitoring.yaml >/tmp/nvcm-probes.yaml
          awk '
            /^[[:space:]]+staticConfig:[[:space:]]*$/ { sc++; inblk=1; haslabel=0; next }
            inblk && /^[[:space:]]+static:[[:space:]]*$/ { if (haslabel) ok++; inblk=0; next }
            inblk && /include_in_slo: "true"/ { haslabel=1 }
            END {
              printf "%d Probe staticConfig block(s); %d carry the SLO label\n", sc, ok
              if (sc == 0 || sc != ok) exit 1
            }
          ' /tmp/nvcm-probes.yaml
      - name: Image digest pin render
        run: |
          # global.images.<name>.digest must pin built-service images by digest
          # (repository@sha256:...) and win over the tag; an unset digest must
          # fall back to repository:tag. Render-time check only (no cluster) so
          # it stays out of the slow kind-integration path.
          set -euo pipefail
          names="nvConfigManager nvConfigManagerUi kea keaAdmin nautobot natsReady temporalServer temporalBootstrap temporalUi"
          r_nvConfigManager=registry.ci.example/nvcm/main
          r_nvConfigManagerUi=registry.ci.example/nvcm/ui
          r_kea=registry.ci.example/nvcm/kea
          r_keaAdmin=registry.ci.example/nvcm/kea-admin
          r_nautobot=registry.ci.example/nvcm/nautobot
          r_natsReady=registry.ci.example/nvcm/nats-ready
          r_temporalServer=registry.ci.example/nvcm/temporal-server
          r_temporalBootstrap=registry.ci.example/nvcm/temporal-bootstrap
          r_temporalUi=registry.ci.example/nvcm/temporal-ui
          t_nvConfigManager=9.0.1-nvcm
          t_nvConfigManagerUi=9.0.1-ui
          t_kea=9.0.1-kea
          t_keaAdmin=9.0.1-kea-admin
          t_nautobot=9.0.1-nautobot
          t_natsReady=9.0.1-nats-ready
          t_temporalServer=9.0.1-temporal-server
          t_temporalBootstrap=9.0.1-temporal-bootstrap
          t_temporalUi=9.0.1-temporal-ui
          d_nvConfigManager=sha256:1111111111111111111111111111111111111111111111111111111111111111
          d_nvConfigManagerUi=sha256:2222222222222222222222222222222222222222222222222222222222222222
          d_kea=sha256:3333333333333333333333333333333333333333333333333333333333333333
          d_keaAdmin=sha256:4444444444444444444444444444444444444444444444444444444444444444
          d_nautobot=sha256:5555555555555555555555555555555555555555555555555555555555555555
          d_natsReady=sha256:6666666666666666666666666666666666666666666666666666666666666666
          d_temporalServer=sha256:7777777777777777777777777777777777777777777777777777777777777777
          d_temporalBootstrap=sha256:8888888888888888888888888888888888888888888888888888888888888888
          d_temporalUi=sha256:9999999999999999999999999999999999999999999999999999999999999999

          base_set_args=""
          for n in $names; do
            eval "repo=\$r_$n"
            eval "tag=\$t_$n"
            base_set_args="$base_set_args --set-string global.images.$n.repository=$repo"
            base_set_args="$base_set_args --set-string global.images.$n.tag=$tag"
          done

          # Default render: each service must render its seeded repository:tag.
          # shellcheck disable=SC2086
          helm template test deploy/helm/ --values deploy/helm/values-ci.yaml $base_set_args >/tmp/nvcm-nodigest.yaml
          if grep -Eq 'image:[[:space:]]*"?[^"[:space:]]+@sha256:' /tmp/nvcm-nodigest.yaml; then
            echo "ERROR: an image rendered with a digest even though none was set"
            exit 1
          fi
          fail=0
          for n in $names; do
            eval "repo=\$r_$n"
            eval "tag=\$t_$n"
            expected="${repo}:${tag}"
            if ! grep -qF "$expected" /tmp/nvcm-nodigest.yaml; then
              echo "ERROR: $n missing expected tag reference $expected in default render"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          # Digest render: each service must render its seeded repository@digest.
          digest_set_args="$base_set_args"
          for n in $names; do
            eval "digest=\$d_$n"
            digest_set_args="$digest_set_args --set-string global.images.$n.digest=$digest"
          done
          # shellcheck disable=SC2086
          helm template test deploy/helm/ --values deploy/helm/values-ci.yaml $digest_set_args >/tmp/nvcm-digest.yaml
          for n in $names; do
            eval "repo=\$r_$n"
            eval "tag=\$t_$n"
            eval "digest=\$d_$n"
            expected="${repo}@${digest}"
            if ! grep -qF "$expected" /tmp/nvcm-digest.yaml; then
              echo "ERROR: $n missing expected digest reference $expected in digest render"
              fail=1
            fi
            if grep -qF "${repo}:${tag}" /tmp/nvcm-digest.yaml; then
              echo "ERROR: $n still renders tag reference ${repo}:${tag} when digest is set"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All 9 built-service images render exact repository:tag or repository@digest references"

  argocd-health-gate:
    name: ArgoCD Rollout Observer
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: *setup_uv
      - run: uv sync --frozen --only-group promotion-gate --no-install-project --no-install-workspace
      - name: Exercise exact-revision rollout observation
        run: uv run --frozen --only-group promotion-gate --no-sync python .gitlab/ci/scripts/test_wait_for_argocd.py

  openapi:
    name: OpenAPI And Go Bindings Check
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - uses: *actions_setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: *setup_uv
        with:
          enable-cache: true
      - uses: *actions_setup_go
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - run: uv sync --frozen
      - name: Regenerate OpenAPI specs and Go bindings
        id: generation
        run: |
          set +e
          make api-generate
          generation_status=$?
          set -e

          if [ "$generation_status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"
          changed_files="$(git status --short --untracked-files=all -- docs/api-specs bindings/go)"
          if [ -n "$changed_files" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              printf '%s\n' "$changed_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test generated Go bindings
        id: go_tests
        if: steps.generation.outputs.failed == 'false'
        continue-on-error: true
        working-directory: bindings/go
        run: go test ./...
      - name: Get PR info
        id: get-pr-info
        if: always() && startsWith(github.ref, 'refs/heads/pull-request/')
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf
      - name: Update generated API status comment
        if: always() && startsWith(github.ref, 'refs/heads/pull-request/') && steps.generation.outputs.failed == 'false'
        env:
          CHANGED_FILES: ${{ steps.generation.outputs.changed_files }}
          DRIFT: ${{ steps.generation.outputs.drift }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.get-pr-info.outputs.pr-info || '{}').number }}
        run: |
          set -euo pipefail
          marker="<!-- nv-config-manager-generated-api-status -->"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -n 1)"

          if [ "$DRIFT" = "true" ]; then
            body="$(printf '%s\n\n%s\n\n```text\n%s\n```\n\n%s\n\n```bash\nmake api-generate\ngit add docs/api-specs bindings/go\n```\n\n%s' \
              "$marker" \
              '⚠️ The committed OpenAPI specifications and Go bindings are out of sync.' \
              "$CHANGED_FILES" \
              'Regenerate them locally, review the changes, then commit and push the result:' \
              'This check will remain failing until the generated files are current.')"
          else
            if [ -z "$comment_id" ]; then
              exit 0
            fi
            body="$(printf '%s\n\n%s' \
              "$marker" \
              '✅ The committed OpenAPI specifications and Go bindings are back in sync.')"
          fi

          if [ -n "$comment_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --method PATCH \
              --field body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --field body="$body" >/dev/null
          fi
      - name: Require generated APIs to be current
        if: always()
        env:
          GENERATION_FAILED: ${{ steps.generation.outputs.failed }}
          GO_TEST_OUTCOME: ${{ steps.go_tests.outcome }}
          HAS_DRIFT: ${{ steps.generation.outputs.drift }}
        run: |
          set -euo pipefail
          if [ "$GENERATION_FAILED" = "true" ]; then
            echo "OpenAPI or Go binding generation failed. See the generation step above."
            exit 1
          fi
          if [ "$GO_TEST_OUTCOME" != "success" ]; then
            echo "Generated Go binding tests failed. See the test step above."
            exit 1
          fi
          if [ "$HAS_DRIFT" = "true" ]; then
            echo "Generated API files are out of date. Run 'make api-generate' and commit the result."
            exit 1
          fi

  github-automation:
    name: GitHub Automation Tests
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: node --test .github/scripts/*.test.js
      - name: GitLab promotion authorization tests
        run: .gitlab/ci/scripts/tests/validate_promote_request_test.sh

  ui-lint:
    name: UI Lint
    runs-on: linux-amd64-cpu8
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - name: Cache npm
        uses: &actions_cache actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ui-npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npm ci --prefer-offline
      - run: npm run lint

  ui-e2e:
    name: UI Build And E2E
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Setup proxy cache
        uses: *setup_proxy_cache
      - name: Cache npm
        uses: *actions_cache
        with:
          path: ~/.npm
          key: ui-npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Cache Next.js
        uses: *actions_cache
        with:
          path: ui/.next/cache
          key: ui-next-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**', 'ui/public/**', 'ui/*.config.*', 'ui/tsconfig.json') }}
          restore-keys: |
            ui-next-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}-
      - run: npm ci --prefer-offline
      - run: npm run build
      - run: npm run test:e2e:ci
      - uses: *upload_artifact
        if: always()
        with:
          name: ui-e2e-artifacts
          path: |
            ui/playwright-report/
            ui/test-results/
