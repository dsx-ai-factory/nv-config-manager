name: Kind Integration

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Pytest path to run
        required: true
        default: src/tests/integration/
        type: string
      observability:
        description: Deploy the observability stack (Prometheus + Alloy) and run observability tests
        required: false
        default: false
        type: boolean
      # Slow (~9m+ for SPIRE alone), so it's off by default and opt-in per run.
      security:
        description: Deploy the full security stack (Keycloak + SPIRE) and run the auth-aware suite (--sso/--rbac/--spiffe)
        required: false
        default: false
        type: boolean
      approved_sha:
        description: Exact PR commit set by /kind test; leave blank for manual runs
        required: false
        default: ""
        type: string

concurrency:
  group: kind-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  KIND_VERSION: "v0.25.0"
  HELM_VERSION: "v3.15.3"
  KUBECTL_VERSION: "v1.31.0"
  YQ_VERSION: "v4.44.1"
  KIND_SHA256: "b22ff7e5c02b8011e82cc3223d069d178b9e1543f1deb21e936d11764780a3d8"
  HELM_SHA256: "ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c"
  KUBECTL_SHA256: "7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437"
  YQ_SHA256: "6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3"

jobs:
  integration:
    name: Kind Integration
    if: startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu32m
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: nv-config-manager-${{ github.run_id }}
      NV_CONFIG_MANAGER_NAMESPACE: nv-config-manager
      NV_CONFIG_MANAGER_RELEASE: nv-config-manager
      NV_CONFIG_MANAGER_HOSTNAME: config-manager.local
      TEST_PATH: ${{ inputs.test_path }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Verify approved commit
        if: inputs.approved_sha != ''
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${APPROVED_SHA}" ]; then
            echo "Expected approved commit ${APPROVED_SHA}, checked out ${actual_sha}"
            exit 1
          fi
      - name: Setup proxy cache
        timeout-minutes: 5
        uses: nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c
        with:
          enable-apt: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        timeout-minutes: 5
        with:
          enable-cache: true
      - name: Set up Docker Buildx
        id: buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Install tools
        timeout-minutes: 15
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq rsync ca-certificates gnupg make

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o kind-linux-amd64
          echo "${KIND_SHA256}  kind-linux-amd64" | sha256sum -c -
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv linux-amd64/helm /usr/local/bin/helm

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

          docker info
      - name: Install Python dependencies
        timeout-minutes: 15
        run: |
          uv sync --frozen
          cd installer
          uv sync --frozen
      - name: Configure hostnames
        timeout-minutes: 2
        run: |
          HOSTS="config-manager.local nautobot.config-manager.local render.config-manager.local ztp.config-manager.local dhcp.config-manager.local workflow.config-manager.local temporal.config-manager.local config-store.config-manager.local svc-workflow.config-manager.local svc-render.config-manager.local svc-ztp.config-manager.local svc-dhcp.config-manager.local svc-nautobot.config-manager.local svc-config-store.config-manager.local"
          echo "127.0.0.1 ${HOSTS}" | sudo tee -a /etc/hosts
      - name: Deploy to Kind
        timeout-minutes: 65
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          OBSERVABILITY: ${{ inputs.observability }}
          SECURITY: ${{ inputs.security }}
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

          # Observability and security are mutually exclusive: observability
          # deploys the plain stack, but the test step keys the auth flags
          # (--sso/--rbac/--spiffe) off SECURITY. Enabling both would run the
          # authenticated suites against a deploy with no security deps, so fail
          # fast instead of producing a confusing mid-run failure.
          if [ "${OBSERVABILITY}" = "true" ] && [ "${SECURITY}" = "true" ]; then
            echo "observability and security inputs are mutually exclusive" >&2
            exit 2
          fi

          # Route Kind's in-cluster containerd at the runner's Docker Hub mirror.
          # The runner's *host* Docker already uses it (setup-proxy-cache), but
          # Kind's containerd does its own pulls and bypasses it, so anonymous
          # in-cluster docker.io pulls draw on the shared runner IP's budget
          # (~100/6h). Once that's spent the pull 429s into ImagePullBackOff and
          # helm's --wait stalls until the 20m deploy timeout. Any path that
          # pulls a docker.io image in-cluster can hit this, not just the
          # security stack, so discover the mirror once here and hand the patched
          # config to every deploy path below.
          kind_config=deploy/kind-config.yaml
          dockerhub_mirror="$(scripts/configure-kind-dockerhub-mirror \
            --input "${kind_config}" \
            --output "${RUNNER_TEMP}/kind-config-dockerhub-mirror.yaml")"
          if [ -n "${dockerhub_mirror}" ]; then
            echo "Kind containerd docker.io mirror: ${dockerhub_mirror}"
            kind_config="${RUNNER_TEMP}/kind-config-dockerhub-mirror.yaml"
          elif [ "${SECURITY}" = "true" ]; then
            # The security stack pulls ~2x more docker.io images than a plain
            # deploy and has no preload fallback, so without the mirror it
            # reliably exhausts the budget. Fail fast rather than 429 into a
            # 20-minute timeout.
            echo "No Docker Hub mirror discoverable on this runner; the security stack's in-cluster pulls would exhaust the anonymous Docker Hub rate limit. Aborting." >&2
            exit 1
          else
            # Plain and observability deploys pull few enough docker.io images to
            # usually fit in the budget, so degrade instead of blocking CI
            # outright on a runner that has no mirror configured.
            echo "No Docker Hub mirror discoverable on this runner; using the base Kind config (in-cluster docker.io pulls may be rate limited)."
          fi

          # Observability is the one lightweight exception: it flips the two
          # monitoring switches on the base config in place (the runner checkout
          # is throwaway, so we keep a single source of truth instead of a
          # near-duplicate config file), installs the prometheus-operator CRDs +
          # standalone Prometheus/Alloy, and enables monitoring.probes so the
          # Probe CRs render with the SLO customLabels from
          # values-observability.yaml. Those tests only assert wiring/labels and
          # need no auth, so they run on the plain `make kind-up` deploy to stay
          # fast.
          #
          # We also append the observability stack's runtime images to
          # kind_preload_images. The installer preloads these on the host (which
          # goes through the runner proxy cache) and `kind load`s them, so
          # helm's --wait doesn't stall on anonymous in-cluster pulls from
          # quay.io / docker.io — those uncached pulls are what blow the deploy
          # timeout. Keep the tags in sync with the prometheus (Chart.yaml) and
          # alloy subchart versions; derive current refs with:
          #   helm template t deploy/helm -f deploy/helm/values-ci.yaml \
          #     -f deploy/helm/values-observability.yaml | grep -E 'image:'
          if [ "${OBSERVABILITY}" = "true" ]; then
            echo "Observability run: plain kind-up + monitoring stack"
            yq -i '
              .infrastructure.monitoring.enabled = true |
              .infrastructure.monitoring.observability_enabled = true |
              .images.kind_preload_images += [
                "quay.io/prometheus/prometheus:v3.11.3",
                "quay.io/prometheus-operator/prometheus-config-reloader:v0.90.1",
                "docker.io/grafana/alloy:v1.16.0"
              ]
            ' deploy/configs/ci-integration-test.yaml

            make kind-up \
              KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
              KIND_CONFIG="${kind_config}" \
              INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml \
              HELM_TIMEOUT=20m

          # Security stack (opt-in via `security: true`): the full Keycloak +
          # SPIRE stack via `make kind-up-sec`, then move the chart into the
          # group-mapping CONFIGURED state so the mapping ConfigMap is mounted and
          # the seeded nvcm-* users get real grants on login. The whole integration
          # suite then runs auth-aware — SSO (headless token minted below),
          # group-mapping RBAC, and SPIFFE — which is far more representative of
          # production than the plain run. It is also much slower (SPIRE alone
          # takes ~9m and the security deps install serially with --wait), so it
          # is gated behind the flag rather than run on every PR; most changes
          # don't touch auth and shouldn't pay that cost.
          #
          # `make kind-up-sec` creates the cluster and installs the security
          # dependencies (cert-manager, Envoy Gateway, SPIRE, Keycloak) itself,
          # pulling their images in-cluster -- which is why the Docker Hub mirror
          # resolved above is mandatory for this path.
          elif [ "${SECURITY}" = "true" ]; then
            echo "Security run: kind-up-sec security stack + CONFIGURED group mapping"

            make kind-up-sec \
              KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
              KIND_CONFIG="${kind_config}" \
              HELM_TIMEOUT=20m

            helm upgrade "${NV_CONFIG_MANAGER_RELEASE}" deploy/helm \
              -n "${NV_CONFIG_MANAGER_NAMESPACE}" \
              --reuse-values \
              -f scripts/rbac-local-test/values-configured.yaml
            kubectl -n "${NV_CONFIG_MANAGER_NAMESPACE}" rollout status \
              "deploy/${NV_CONFIG_MANAGER_RELEASE}-nautobot" --timeout=15m

          else
            # Default: the fast, unauthenticated stack via plain `make kind-up`.
            # Most PRs don't touch auth, so this gives quick feedback; the full
            # security stack is opt-in via `security: true` (see above).
            echo "Default run: plain kind-up (no security stack)"
            make kind-up \
              KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
              KIND_CONFIG="${kind_config}" \
              INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml \
              HELM_TIMEOUT=20m
          fi

          # Trust the in-cluster gateway's TLS cert so pytest can verify HTTPS
          # against the app behind the Envoy gateway. Every deploy path above
          # fronts the app with that gateway, so this runs for all of them.
          kind_ca_bundle="${RUNNER_TEMP}/nvcm-kind-ca-bundle.crt"
          cp "${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}" "${kind_ca_bundle}"
          printf '\n' >>"${kind_ca_bundle}"
          kubectl get secret -n "${NV_CONFIG_MANAGER_NAMESPACE}" nv-config-manager-gateway-ca \
            -o jsonpath='{.data.tls\.crt}' | base64 --decode >>"${kind_ca_bundle}"
          echo "REQUESTS_CA_BUNDLE=${kind_ca_bundle}" >>"${GITHUB_ENV}"

          kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o wide
      - name: Run integration tests
        timeout-minutes: 50
        env:
          # Gates observability-only tests (e.g. test_probe_labels.py), which
          # skip themselves unless this is "true". Mirrors the JIRA_ISSUE_KEY
          # gate on the diagnostics tests.
          OBSERVABILITY: ${{ inputs.observability }}
          SECURITY: ${{ inputs.security }}
          # Keycloak coordinates for the headless --sso token mint (see
          # mint_oidc_token below). Only consumed on the opt-in security run.
          KEYCLOAK_NAMESPACE: keycloak
          KEYCLOAK_SERVICE: keycloak
          OIDC_REALM: nv-config-manager
          OIDC_CLIENT_ID: nv-config-manager
          OIDC_CLIENT_SECRET: nvcm-local-client-secret
          OIDC_USERNAME: nvcm-admin
        run: |
          # Security runs (security: true) exercise the whole suite against the
          # kind-up-sec deploy, authenticated end to end:
          #   --sso    routes service calls through the svc-* JWT-only hostnames
          #            and attaches a headless NVCM_OIDC_ACCESS_TOKEN minted fresh
          #            per attempt below (browser OIDC can't run on the runner).
          #   --rbac   runs the group-mapping suite (test_rbac_group_mapping.py),
          #            which mints its own per-user tokens against the local
          #            Keycloak; needs the CONFIGURED mapping deployed above.
          #   --spiffe runs the Workload-Identity suite; it skips itself cleanly
          #            when no spiffe-helper sidecar pod is present.
          # The mock topology is loaded by kind-up-sec (deploy/configs/local-sec.yaml
          # installs development/mock_topology and runs MockTopologyDesign), so the
          # data-dependent tests have fixtures.
          #
          # Default and observability runs use the plain unauthenticated deploy,
          # so they pass no auth flags.
          EXTRA_FLAGS=""
          if [ "${SECURITY}" = "true" ]; then
            EXTRA_FLAGS="--sso --rbac --spiffe"
          fi
          TEST_TARGET="${TEST_PATH}"

          # Mint a fresh headless OIDC token for the --sso suite. The browser OIDC
          # redirect can't run on a headless runner, so the suite authenticates
          # with a caller-supplied NVCM_OIDC_ACCESS_TOKEN. We mint it via the
          # confidential client's direct-access (ROPC) grant (the secret already
          # lives in-cluster). Minting *inside the retry loop* keeps every attempt
          # on a fresh 1h token, so the SSO tests can't fail with a stale-token
          # 401 on a late retry no matter how long earlier attempts ran. The
          # --rbac fixtures mint their own per-user tokens in-process, so this
          # only feeds --sso. The port-forward is local to the mint and torn down
          # before pytest, so it can't clash with the fixtures' own forward.
          mint_oidc_token() {
            local token="" pf_pid
            kubectl -n "${KEYCLOAK_NAMESPACE}" port-forward "svc/${KEYCLOAK_SERVICE}" 18080:80 >/tmp/keycloak-pf.log 2>&1 &
            pf_pid=$!
            for _ in $(seq 1 30); do
              if curl -sf --connect-timeout 5 --max-time 10 "http://127.0.0.1:18080/realms/${OIDC_REALM}/.well-known/openid-configuration" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            # -s (not -sf) so an HTTP error still yields a body for jq to parse to
            # empty, letting the guard below print the port-forward log instead of
            # aborting on the pipefail.
            token="$(curl -s --connect-timeout 5 --max-time 30 -X POST \
              "http://127.0.0.1:18080/realms/${OIDC_REALM}/protocol/openid-connect/token" \
              -d "client_id=${OIDC_CLIENT_ID}" \
              -d "client_secret=${OIDC_CLIENT_SECRET}" \
              -d "grant_type=password" \
              -d "scope=openid" \
              -d "username=${OIDC_USERNAME}" \
              -d "password=${OIDC_USERNAME}" | jq -r '.access_token // empty')"
            kill "${pf_pid}" 2>/dev/null || true
            wait "${pf_pid}" 2>/dev/null || true
            if [ -z "${token}" ]; then
              echo "Failed to mint OIDC token via ROPC grant" >&2
              cat /tmp/keycloak-pf.log >&2 || true
              return 1
            fi
            echo "::add-mask::${token}"
            export NVCM_OIDC_ACCESS_TOKEN="${token}"
            echo "Minted headless OIDC token for ${OIDC_USERNAME} (length ${#token})"
          }

          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3"
            # Refresh the SSO token each attempt (skipped on observability runs,
            # which pass no auth flags).
            if [ -n "${EXTRA_FLAGS}" ]; then
              mint_oidc_token
            fi
            results_file="integration-test-results-${attempt}.xml"
            set +e
            timeout --kill-after=1m 15m uv run pytest "${TEST_TARGET}" -v \
              --ci \
              ${EXTRA_FLAGS} \
              --nv-config-manager-namespace "${NV_CONFIG_MANAGER_NAMESPACE}" \
              --tb=short \
              --junitxml="${results_file}"
            test_status=$?
            set -e

            if [ "${test_status}" -eq 0 ]; then
              cp -f "${results_file}" integration-test-results.xml
              exit 0
            fi

            if [ -f "${results_file}" ]; then
              cp -f "${results_file}" integration-test-results.xml
            fi

            if [ "${test_status}" -eq 124 ] || \
              { [ "${test_status}" -ge 128 ] && [ "${test_status}" -le 192 ]; }; then
              echo "Attempt ${attempt} failed with retryable status ${test_status}"
              if [ "${attempt}" -lt 3 ]; then
                sleep 10
                continue
              fi
              exit "${test_status}"
            else
              echo "Attempt ${attempt} failed with non-retryable status ${test_status}"
              exit "${test_status}"
            fi
          done
          exit 1
      - name: Collect integration logs
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p integration-test-logs
          # Collect cluster-wide, not just the app namespace: a failed security
          # bring-up lives in the dependency namespaces (spire-system, keycloak,
          # envoy-gateway-system, cert-manager, cnpg-system, ...), so scoping to
          # the app namespace would miss exactly the pods that failed.
          kubectl get pods -A -o wide > integration-test-logs/pods.txt 2>&1 || true
          kubectl get events -A --sort-by='.lastTimestamp' > integration-test-logs/events.txt 2>&1 || true
          # Per-pod logs, organised into a subdirectory per namespace.
          kubectl get pods -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | \
            while read -r ns pod; do
              [ -z "$ns" ] && continue
              mkdir -p "integration-test-logs/${ns}"
              kubectl logs -n "$ns" "$pod" --all-containers > "integration-test-logs/${ns}/${pod}.log" 2>&1 || true
            done
      - name: Delete Kind cluster
        if: always()
        timeout-minutes: 5
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: integration-test-artifacts
          path: |
            integration-test-logs/
            integration-test-results.xml

  report-result:
    name: Report Kind Integration Result
    needs: integration
    if: always() && startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The slash-command dispatcher uses GITHUB_TOKEN, so a follow-on
      # workflow_run event is not reliable. Report from the dispatched workflow
      # instead, using the same approved pull-request/* SHA that Kind tested.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update PR with result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 5
        env:
          KIND_RESULT_CONCLUSION: ${{ needs.integration.result }}
          KIND_RESULT_EVENT: ${{ github.event_name }}
          KIND_RESULT_HEAD_BRANCH: ${{ github.ref_name }}
          KIND_RESULT_HEAD_SHA: ${{ github.sha }}
          KIND_RESULT_HTML_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const report = require("./.github/scripts/kind-integration-result.js");
            await report({
              github,
              context,
              core,
              run: {
                conclusion: process.env.KIND_RESULT_CONCLUSION,
                event: process.env.KIND_RESULT_EVENT,
                head_branch: process.env.KIND_RESULT_HEAD_BRANCH,
                head_sha: process.env.KIND_RESULT_HEAD_SHA,
                html_url: process.env.KIND_RESULT_HTML_URL,
                status: "completed",
              },
            });
