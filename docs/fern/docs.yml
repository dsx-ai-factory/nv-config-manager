# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

global-theme: nvidia

instances:
  - url: config-manager.docs.buildwithfern.com/switch-infrastructure/config-manager
    custom-domain: docs.nvidia.com/switch-infrastructure/config-manager
    multi-source: true

title: NVIDIA Switch Infrastructure

announcement:
  message: "🔔 NVIDIA Config Manager is a <strong>developer preview</strong>. APIs and behavior may change without notice."

check:
  rules:
    broken-links: error

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/nv-config-manager

settings:
  folder-title-source: frontmatter

redirects:
  - source: /switch-infrastructure
    destination: /switch-infrastructure/config-manager

