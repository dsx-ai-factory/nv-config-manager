[project]
name = "nv-config-manager-installer"
version = "1.0.0"
description = "NVIDIA Config Manager Install Wizard - TUI-based deployment configuration tool"
authors = [{ name = "NVIDIA Corporation" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    # Remove compromised emSign CA trust (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.19",
    "nv-air-sdk==1.4.0",
    "click>=8.1.7",
    # Security floor for standalone tool installs (GHSA-65pc-fj4g-8rjx).
    "idna>=3.15",
    "kubernetes>=32.0.0",
    "pydantic>=2.10.2",
    # Security floor for standalone tool installs (GHSA-5239-wwwm-4pmq).
    "pygments>=2.20.0",
    "pyyaml>=6.0.2",
    "requests>=2.33.0",
    "textual>=3.1.0",
    "textual-fspicker>=1.0.0",
]

[project.scripts]
nv-config-manager-installer = "nv_config_manager_installer.cli:main"
nvcm-installer = "nv_config_manager_installer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_installer"]

[tool.uv]
required-version = ">=0.13.5"
package = true

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.0",
    "ruff==0.17.3",
]
