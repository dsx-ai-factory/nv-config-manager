# =============================================================================
# NVIDIA Config Manager - CI Integration Test Config
# =============================================================================
# Used by the GitHub Kind integration workflow via:
#   make kind-up INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml HELM_TIMEOUT=20m
# =============================================================================

version: "1"

cluster:
  hostname: config-manager.local
  environment: local
  namespace: nv-config-manager
  release_name: nv-config-manager
  airgapped: false
  mock_devices: true
  size: small

secrets:
  method: kubernetes
  config_manager_service_username: nv-config-manager

network_secrets:
  - name: Hash Salt
    description: Password hashing salt for user accounts
    source: generate
    secret_key: hash_salt
    rotation: r1
    required: true
  - name: BGP Password
    description: BGP peering authentication
    source: generate
    secret_key: bgp_password
    rotation: r1
    required: true
  - name: Device Admin Password
    description: Admin/root password for managed devices
    source: generate
    secret_key: root_password
    rotation: r1
    required: true
  - name: NVIDIA Config Manager API Key
    description: NVIDIA Config Manager service account device credential
    source: generate
    secret_key: api_user_key
    rotation: r1
    required: true

git_tokens:
  - name: testgit
    token: dummy-token-value
    username: dummy-user

sites:
  - name: test-site

sso:
  enabled: false

spiffe:
  enabled: false

content:
  jobs:
    - path: development/mock_topology
  template_plugins: []
  run_after_deploy:
    - job: custom.mock_topology.jobs.mock_topology_design.MockTopologyDesign
      input: '{"blueprint": "superpod", "deployment_name": "test"}'

services:
  render: true
  ztp: true
  dhcp: true
  temporal: true
  config_store: true
  nautobot: true

images:
  # CI preloads third-party runtime images into Kind through the host Docker daemon.
  # This avoids anonymous in-cluster pulls from Docker Hub during Helm's --wait window.
  # Note: docker.io/library/busybox:1.36 is also preloaded as a code default via
  # _KIND_PRELOAD_IMAGES in deployer.py (used by the installer's PVC loader pods);
  # it's listed here for documentation. The effective list is deduplicated.
  kind_preload_images:
    - docker.io/library/busybox:1.36
    - docker.io/hashicorp/http-echo:1.0
    - docker.io/alpine/kubectl:1.35.4
    - docker.io/library/redis:7-alpine
    - docker.io/library/nats:2.14-alpine
    - docker.io/natsio/nats-box:0.14.3
    - docker.io/nginxinc/nginx-unprivileged:1.27
    - docker.io/envoyproxy/gateway:v1.6.5
    - docker.io/envoyproxy/ratelimit:c8765e89
    - docker.io/envoyproxy/envoy:distroless-v1.36.5
    - quay.io/jetstack/cert-manager-controller:v1.20.2
    - quay.io/jetstack/cert-manager-webhook:v1.20.2
    - quay.io/jetstack/cert-manager-cainjector:v1.20.2
    - quay.io/jetstack/cert-manager-startupapicheck:v1.20.2
    - quay.io/jetstack/cert-manager-acmesolver:v1.20.2
    - ghcr.io/cloudnative-pg/cloudnative-pg:1.29.0
    # NOTE: keep the next line in sync with `images.overrides.postgresql` below;
    # bumping the postgresql version requires updating BOTH the preload tag and
    # the override `tag:` so CI preloads the exact image CNPG ends up running.
    - ghcr.io/cloudnative-pg/postgresql:18.0-system-trixie
  overrides:
    # MUST match the postgresql entry in `kind_preload_images` above.
    postgresql:
      repository: ghcr.io/cloudnative-pg/postgresql
      tag: 18.0-system-trixie

infrastructure:
  gateway: envoyGateway
  tls: true
  cnpg_s3_backup:
    enabled: false
  monitoring:
    enabled: false
  load_balancer:
    provider: ""
