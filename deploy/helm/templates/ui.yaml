{{- if .Values.ui.enabled }}
# =============================================================================
{{- $uiName := include "nv-config-manager.componentName" (dict "root" . "component" "ui") }}
# NVIDIA Config Manager UI - Unified React/Next.js Application
# =============================================================================
# Combined UI for workflows and config-store, accessible at the base hostname
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $uiName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app: {{ $uiName }}
    component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: {{ $uiName }}
      component: ui
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $uiName }}
        component: ui
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      {{- if include "nv-config-manager.spiffe.enabled" . }}
      annotations:
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $uiName) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.ui | nindent 6 }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      containers:
      - name: ui
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManagerUi) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManagerUi.pullPolicy }}
        command: ["node", "server.js"]
        env:
        # Application version (matches image tag - git tag/semver)
        - name: APP_VERSION
          value: "{{ include "nv-config-manager.imageTag" (dict "root" . "image" .Values.global.images.nvConfigManagerUi) }}"
        {{- if .Values.oidc.enabled }}
        - name: OIDC_GATEWAY_URL
          value: "https://{{ .Values.gateway.baseHostname }}"
        - name: OIDC_END_SESSION_ENDPOINT
          value: {{ .Values.oidc.endSessionEndpoint | default "" | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ .Values.oidc.clientId | default "" | quote }}
        - name: OIDC_PROXY_COOKIE_NAME
          value: {{ .Values.oidc.proxy.cookieName | default "_nvcm_oidc_proxy" | quote }}
        {{- end }}
        {{- if .Values.oidc.authUtility.enabled }}
        # Public auth discovery metadata for native clients
        - name: OIDC_ENABLED
          value: {{ .Values.oidc.enabled | quote }}
        - name: OIDC_ISSUER_URL
          value: {{ .Values.oidc.issuerUrl | default "" | quote }}
        - name: OIDC_CLI_CLIENT_ID
          value: {{ (.Values.oidc.cliClientId | default .Values.oidc.clientId | default "") | quote }}
        - name: OIDC_SCOPES
          value: {{ toJson (.Values.oidc.scopes | default (list)) | quote }}
        # Workflow API URL
        - name: WORKFLOW_API_URL
          value: "https://{{ tpl .Values.temporal.gateway.api.hostname . }}"
        - name: SVC_WORKFLOW_API_URL
          value: "https://{{ tpl .Values.temporal.gateway.api.svcHostname . }}/v1/workflow"
        {{- if .Values.mcp.enabled }}
        # MCP API URL
        - name: MCP_URL
          value: "https://{{ tpl .Values.mcp.gateway.hostname . }}/mcp"
        - name: SVC_MCP_URL
          value: "https://{{ tpl .Values.mcp.gateway.svcHostname . }}/mcp"
        {{- end }}
        {{- else }}
        # Workflow API URL
        - name: WORKFLOW_API_URL
          value: "https://{{ tpl .Values.temporal.gateway.api.hostname . }}"
        {{- end }}
        # Config Store API URL
        - name: CONFIG_STORE_API_URL
          value: "https://{{ tpl .Values.configStore.gateway.api.hostname . }}"
        # Selected DCIM provider's public URL. Provider-specific device links
        # are enabled only for the built-in Nautobot provider in the UI.
        - name: DCIM_URL
          value: {{ include "nv-config-manager.dcimPublicUrl" . | quote }}
        - name: DCIM_PROVIDER
          value: {{ .Values.dcim.provider | default "nautobot-2x" | quote }}
        - name: DCIM_DISPLAY_NAME
          value: {{ include "nv-config-manager.dcimDisplayName" . | quote }}
        # Render Service URL
        - name: RENDER_SERVICE_URL
          value: "https://{{ tpl .Values.renderService.gateway.hostname . }}"
        # ZTP URL
        - name: ZTP_URL
          value: "https://{{ tpl .Values.networkZtp.gateway.hostname . }}"
        # DHCP URL
        - name: DHCP_URL
          value: "https://{{ tpl .Values.networkDhcp.gateway.hostname . }}"
        # Temporal UI URL (native Temporal web interface)
        {{- if and .Values.temporal.enabled .Values.temporal.server.enabled }}
        - name: TEMPORAL_UI_URL
          value: "https://{{ tpl .Values.temporal.gateway.devUi.hostname . }}"
        {{- end }}
        {{- if and .Values.monitoring .Values.monitoring.grafanaUrl }}
        - name: GRAFANA_URL
          value: {{ tpl .Values.monitoring.grafanaUrl . | quote }}
        {{- end }}
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: nextjs-cache
          mountPath: /app/.next/cache
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: nextjs-cache
        emptyDir: {}
      {{- /* UI is OIDC-only: no auth sidecar - the shared oauth2-proxy handles browser auth */}}
      {{- /* API endpoints (render, temporal-api, etc.) retain sidecars for JWT; UIs do not */}}
---
# NVIDIA Config Manager UI Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $uiName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app: {{ $uiName }}
    component: ui
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: {{ $uiName }}
    component: ui
{{- end }}
