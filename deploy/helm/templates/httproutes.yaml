---
# Unified UI HTTPRoute (at base hostname) - OIDC-only, direct to app port
{{- if .Values.ui.enabled }}
{{- if and .Values.oidc.enabled .Values.oidc.authUtility.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $uiName }}-auth-utility
  namespace: {{ .Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" .) | nindent 2 }}
  annotations:
    # Allows unauthenticated access to public auth utility endpoints.
    nv-config-manager.nvidia.com/no-auth: "true"
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" . | nindent 2 }}
  hostnames:
  - {{ .Values.gateway.baseHostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth/logout
    - path:
        type: PathPrefix
        value: /auth/discovery
    {{- include "nv-config-manager.stripIdentityHeaders" . | nindent 4 }}
    backendRefs:
    - name: {{ $uiName }}
      port: 3000
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $uiName }}
  namespace: {{ .Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" .) | nindent 2 }}
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" . | nindent 2 }}
  hostnames:
  - {{ .Values.gateway.baseHostname | quote }}
