    "backendName" $nautobotName
    "backendPort" 80
) }}
{{- end }}

# Nautobot HTTPRoute (when deployed locally)
{{- if and .Values.nautobot.enabled .Values.externalServices.nautobot.local }}
# -----------------------------------------------------------------------------
# Nautobot Auth Bypass HTTPRoute (for /api/)
# -----------------------------------------------------------------------------
# Nautobot supports multiple auth methods:
#   - OIDC/JWT (browser users via SSO)
#   - Native API tokens (Authorization: Token <token>)
#   - Remote user auth (trusts X-Auth-Request-User header from gateway)
#
# This route bypasses the browser proxy only when an Authorization header
# matches ^(Bearer|Token) .+$, allowing native API tokens without exposing
# browser API calls. SSO browser requests have no client Authorization header
# and stay on the main route so the proxy can supply trusted remote-user headers.
# -----------------------------------------------------------------------------
{{- include "nv-config-manager.authBypassHTTPRoute" (dict
    "root" .
    "routeName" $nautobotName
    "enabled" .Values.nautobot.gateway.authBypass.enabled
    "paths" .Values.nautobot.gateway.authBypass.paths
    "hostname" (tpl .Values.nautobot.gateway.hostname .)
    "backendName" $nautobotName
    "backendPort" 80
    "requireAuthorization" true
) }}
# Main Nautobot HTTPRoute (for UI/browser access with OIDC)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $nautobotName }}
  namespace: {{ .Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" .) | nindent 2 }}
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" . | nindent 2 }}
  hostnames:
  - {{ tpl .Values.nautobot.gateway.hostname . | quote }}
  rules:
  {{- include "nv-config-manager.browserSafeMethodRule" (dict "root" . "redirectHostname" (tpl .Values.nautobot.gateway.hostname .) "backendName" $nautobotName "backendPort" 80 "proxyPort" 9106) | nindent 2 }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- include "nv-config-manager.protectedIdentityHeaders" (dict "redirectHostname" (tpl .Values.nautobot.gateway.hostname .)) | nindent 4 }}
    {{- include "nv-config-manager.browserBackendRefs" (dict "root" . "backendName" $nautobotName "backendPort" 80 "proxyPort" 9106) | nindent 4 }}
{{- end }}

