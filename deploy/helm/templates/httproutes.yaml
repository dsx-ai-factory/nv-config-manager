# =============================================================================
# HTTPRoutes for NVIDIA Config Manager Services
# =============================================================================
# This template creates HTTPRoutes for all enabled services in the platform
# Uses subdomain-based routing (each service gets its own hostname)
#
# Auth Bypass Routes:
# For services that need to support both OIDC/JWT and native token auth,
# separate HTTPRoutes bypass the browser proxy so the service can validate a
# Bearer JWT or its native token directly.
# =============================================================================

# =============================================================================
# Service (svc-*) HTTPRoute Helper Template
# =============================================================================
{{- define "nv-config-manager.identityHeaderRemovals" }}
remove:
    - ssl-client-cert
    - X-Auth-Request-Email
    - X-Auth-Request-User
    - X-Auth-Request-Groups
    - X-Auth-Request-Preferred-Username
    - X-Auth-Request-Name
    - X-Auth-Request-Roles
    - X-Auth-Request-Subject
    - X-Auth-Request-Access-Token
    - X-Forwarded-Email
    - X-Forwarded-User
    - X-Forwarded-Groups
    - X-Forwarded-Preferred-Username
    - X-Forwarded-Access-Token
{{- end }}

{{- define "nv-config-manager.stripIdentityHeaders" }}
filters:
- type: RequestHeaderModifier
  requestHeaderModifier:
{{ include "nv-config-manager.identityHeaderRemovals" . | nindent 4 }}
{{- end }}

{{/*
Protected browser routes must provide oauth2-proxy with an absolute, trusted
return target. Gateway API cannot express the requested path dynamically, so
the route supplies its canonical hostname. oauth2-proxy preserves this target
through its base-hostname callback rather than falling back to the splash page.
*/}}
{{- define "nv-config-manager.protectedIdentityHeaders" }}
filters:
- type: RequestHeaderModifier
  requestHeaderModifier:
{{ include "nv-config-manager.identityHeaderRemovals" . | nindent 4 }}
    set:
    - name: X-Auth-Request-Redirect
      value: {{ printf "https://%s/" .redirectHostname | quote }}
{{- end }}

{{/* Labels HTTPRoutes for controller-specific timeout policies. */}}
{{- define "nv-config-manager.httpRoutePolicyLabels" -}}
labels:
  {{- include "nv-config-manager.labels" .root | nindent 2 }}
  nv-config-manager.nvidia.com/timeout-profile: {{ .timeoutProfile | default "default" | quote }}
{{- end }}

# Creates an HTTPRoute for the svc-* hostname (JWT-only, no OIDC).
# These routes allow CLI/machine clients to authenticate with just a JWT
# bearer token without being redirected to the OIDC login flow.
# These routes bypass the browser proxy and let application middleware validate
# Bearer JWTs without triggering a browser redirect.
# =============================================================================
{{- define "nv-config-manager.svcHTTPRoute" }}
{{- if and $.root.Values.oidc.enabled $.svcHostname }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.routeName }}-svc
  namespace: {{ $.root.Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" $.root "timeoutProfile" ($.timeoutProfile | default "default")) | nindent 2 }}
  annotations:
    # JWT-only service route - OIDC disabled, CLI/machine access
    nv-config-manager.nvidia.com/svc-route: "true"
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" $.root | nindent 2 }}
  hostnames:
  - {{ $.svcHostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- include "nv-config-manager.stripIdentityHeaders" $.root | nindent 4 }}
    backendRefs:
    - name: {{ $.backendName }}
      port: {{ $.backendPort }}
{{- end }}
{{- end }}

{{- define "nv-config-manager.browserBackendRefs" }}
backendRefs:
{{- if $.root.Values.oidc.enabled }}
- name: {{ include "nv-config-manager.componentName" (dict "root" $.root "component" "oidc-proxy") }}
  port: {{ $.proxyPort }}
{{- else }}
- name: {{ $.backendName }}
  port: {{ $.backendPort }}
{{- end }}
{{- end }}

{{/*
An extra rule on a browser route, identical to the catch-all below it except
that it matches only methods that are safe to replay. It exists so a
BackendTrafficPolicy can attach a status-code retry to those methods alone: with
oidc.enabled, oauth2-proxy proxies to the component Service, so a pod that stops
accepting mid-rollout makes the proxy answer 502 rather than the connection
failing at the gateway, and a 502 cannot be told apart from a write that already
committed.

Emitted before the catch-all for readability only. Gateway API resolves ties by
match specificity, not list order, and ranks a method match above a bare path
prefix, so this rule wins for the methods it lists and everything else falls
through.
*/}}
{{- define "nv-config-manager.browserSafeMethodRule" }}
{{- $root := $.root }}
{{- if include "nv-config-manager.browserSafeMethodRetryEnabled" $root }}
{{- $sm := $root.Values.gateway.retry.safeMethods }}
- name: {{ include "nv-config-manager.browserSafeMethodRuleName" $root }}
  matches:
  {{- range ($sm.methods | default (list "GET" "HEAD")) }}
  - path:
      type: PathPrefix
      value: /
    method: {{ . | quote }}
  {{- end }}
  {{- include "nv-config-manager.protectedIdentityHeaders" (dict "redirectHostname" $.redirectHostname) | nindent 2 }}
  {{- include "nv-config-manager.browserBackendRefs" (dict "root" $root "backendName" $.backendName "backendPort" $.backendPort "proxyPort" $.proxyPort) | nindent 2 }}
{{- end }}
{{- end }}

# =============================================================================
# Auth Bypass HTTPRoute Helper Template
# =============================================================================
# Creates a separate HTTPRoute for paths that bypass the browser proxy while
# retaining application-native Bearer JWT or service token authentication.
# =============================================================================
{{- define "nv-config-manager.authBypassHTTPRoute" }}
{{- if and $.root.Values.oidc.enabled $.root.Values.gateway.authBypass.enabled $.enabled (gt (len $.paths) 0) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.routeName }}-auth-bypass
  namespace: {{ $.root.Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" $.root "timeoutProfile" ($.timeoutProfile | default "default")) | nindent 2 }}
  annotations:
    # Auth bypass route - application-native authentication, no browser redirect
    nv-config-manager.nvidia.com/auth-bypass: "true"
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" $.root | nindent 2 }}
  hostnames:
  - {{ $.hostname | quote }}
  rules:
  {{- range $.paths }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ . }}
      {{- if $.requireAuthorization }}
      headers:
      - name: Authorization
        type: RegularExpression
        value: "^(Bearer|Token) .+$"
      {{- end }}
    {{- include "nv-config-manager.stripIdentityHeaders" $.root | nindent 4 }}
    backendRefs:
    - name: {{ $.backendName }}
      port: {{ $.backendPort }}
  {{- end }}
{{- end }}
{{- end }}

{{- $renderName := include "nv-config-manager.componentName" (dict "root" . "component" "render") }}
{{- $ztpName := include "nv-config-manager.componentName" (dict "root" . "component" "ztp") }}
