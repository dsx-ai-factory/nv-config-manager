apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $configStoreName }}-api
  namespace: {{ .Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" .) | nindent 2 }}
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" . | nindent 2 }}
  hostnames:
  - {{ tpl .Values.configStore.gateway.api.hostname . | quote }}
  rules:
  {{- include "nv-config-manager.browserSafeMethodRule" (dict "root" . "redirectHostname" (tpl .Values.configStore.gateway.api.hostname .) "backendName" (printf "%s-api" $configStoreName) "backendPort" 9000 "proxyPort" 9107) | nindent 2 }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- include "nv-config-manager.protectedIdentityHeaders" (dict "redirectHostname" (tpl .Values.configStore.gateway.api.hostname .)) | nindent 4 }}
    {{- include "nv-config-manager.browserBackendRefs" (dict "root" . "backendName" (printf "%s-api" $configStoreName) "backendPort" 9000 "proxyPort" 9107) | nindent 4 }}
{{- end }}

# MCP svc-* HTTPRoute (JWT-only)
{{- if .Values.mcp.enabled }}
{{- include "nv-config-manager.svcHTTPRoute" (dict
    "root" .
    "routeName" $mcpName
    "svcHostname" (tpl (.Values.mcp.gateway.svcHostname | default "") .)
    "backendName" $mcpName
    "backendPort" 9000
) }}
{{- end }}

# MCP HTTPRoute
{{- if .Values.mcp.enabled }}
{{- if .Values.mcp.gateway.authBypass }}
{{- include "nv-config-manager.authBypassHTTPRoute" (dict
    "root" .
    "routeName" $mcpName
    "enabled" (.Values.mcp.gateway.authBypass.enabled | default false)
    "paths" (.Values.mcp.gateway.authBypass.paths | default list)
    "hostname" (tpl .Values.mcp.gateway.hostname .)
    "backendName" $mcpName
    "backendPort" 9000
) }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $mcpName }}
  namespace: {{ .Values.global.namespace }}
  {{- include "nv-config-manager.httpRoutePolicyLabels" (dict "root" .) | nindent 2 }}
spec:
  parentRefs:
  {{- include "nv-config-manager.gatewayParentRef" . | nindent 2 }}
  hostnames:
  - {{ tpl .Values.mcp.gateway.hostname . | quote }}
  rules:
  {{- include "nv-config-manager.browserSafeMethodRule" (dict "root" . "redirectHostname" (tpl .Values.mcp.gateway.hostname .) "backendName" $mcpName "backendPort" 9000 "proxyPort" 9108) | nindent 2 }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- include "nv-config-manager.protectedIdentityHeaders" (dict "redirectHostname" (tpl .Values.mcp.gateway.hostname .)) | nindent 4 }}
    {{- include "nv-config-manager.browserBackendRefs" (dict "root" . "backendName" $mcpName "backendPort" 9000 "proxyPort" 9108) | nindent 4 }}
{{- end }}

{{- end }}
