  {{- include "nv-config-manager.browserSafeMethodRule" (dict "root" . "redirectHostname" .Values.gateway.baseHostname "backendName" $uiName "backendPort" 3000 "proxyPort" 9100) | nindent 2 }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- include "nv-config-manager.protectedIdentityHeaders" (dict "redirectHostname" .Values.gateway.baseHostname) | nindent 4 }}
    {{- include "nv-config-manager.browserBackendRefs" (dict "root" . "backendName" $uiName "backendPort" 3000 "proxyPort" 9100) | nindent 4 }}
