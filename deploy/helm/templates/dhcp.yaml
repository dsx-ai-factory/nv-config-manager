{{- if .Values.networkDhcp.enabled }}
{{- $dhcpName := include "nv-config-manager.componentName" (dict "root" . "component" "dhcp") }}
---
# Network DHCP Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $dhcpName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $dhcpName }}
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: network-dhcp
spec:
  replicas: {{ .Values.networkDhcp.replicas }}
  selector:
    matchLabels:
      app: {{ $dhcpName }}
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $dhcpName }}
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $dhcpName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.networkDhcp | nindent 6 }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      # Initialize Kea DHCP schema
      # The kea-admin image entrypoint:
      #   1. Waits for PostgreSQL to be ready
      #   2. Checks if schema already exists (queries schema_version table)
      #   3. If exists: checks for upgrades and exits
      #   4. If not exists: runs kea-admin db-init to create schema
      - name: init-schema
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.keaAdmin) }}"
        imagePullPolicy: {{ .Values.global.images.keaAdmin.pullPolicy }}
        env:
        - name: INI_FILE
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniFileMountEtcVault" . | nindent 8 }}
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      containers:
      # Kea DHCP server container
      - name: kea
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.kea) }}"
        imagePullPolicy: {{ .Values.global.images.kea.pullPolicy }}
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        ports:
        - containerPort: 67
          protocol: UDP
          name: dhcp
        - containerPort: 8000
          name: kea-api
        - containerPort: {{ .Values.networkDhcp.kea.storkAgentPort }}
          name: stork-agent
        # supervisord (PID 1) doesn't exit when kea-dhcp4 enters FATAL state after
        # exhausting startretries, so kubelet has no way to detect a dead DHCP server
        # without an explicit probe. Use the /livez endpoint served by the
        # healthcheck sidecar (same pod = shared network namespace, so
        # 127.0.0.1:9090 reaches it). /livez ONLY checks that the Kea DHCP
        # process/control channel is alive: when kea-dhcp4 is dead, kea-ctrl-agent
        # reports it offline, /livez returns 500, and kubelet recycles the kea
        # container so supervisord starts kea-dhcp4 fresh.
        #
        # Liveness deliberately does NOT use the strict /healthcheck readiness
        # endpoint -- a config mismatch (desired config not yet applied) must
        # leave a live Kea running and only mark the pod unready for
        # reconciliation, never trigger a restart of the Kea container.
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /livez
            port: 9090
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.networkDhcp.resources.dhcp | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniFileMountEtcVault" . | nindent 8 }}
      # Healthcheck container for external NLB
      - name: healthcheck
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-dhcp-api"]
        args: ["--port", "9090"]
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.fastApiMetricsEnv" . | nindent 8 }}
        ports:
        - containerPort: 9090
          name: healthcheck
        # Liveness only recycles this sidecar if Kea itself is dead (/livez); a
        # config mismatch must not restart it.
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /livez
            port: 9090
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 3
        # Strict readiness: Kea online AND desired config applied. This is the
        # endpoint the external DHCP NLB targets, so an unconfigured pod (no
        # applied config) stays unready and never receives external DHCP traffic.
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /healthcheck
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.networkDhcp.resources.healthcheck | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerSecretsDirEtcVault" . | nindent 8 }}
      # API container
      - name: api
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-dhcp-api"]
        args: []
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        - name: NV_CONFIG_MANAGER_SERVICE
          value: "dhcp"
        - name: ACCEPT_REQUEST_HEADERS
          value: "true"
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.fastApiMetricsEnv" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-dhcp") | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 9000
          name: api
        # Liveness only reflects Kea process health (/livez); config mismatches
        # must not restart the api container.
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /livez
            port: 9000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 3
        # Strict readiness: Kea online AND desired config applied.
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.networkDhcp.resources.api | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerSecretsDirEtcVault" . | nindent 8 }}
        {{- include "nv-config-manager.authVolumeMounts" . | nindent 8 }}
      # Config sync container
      - name: config-sync-v4
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-dhcp-confgen", "sync-kea-configuration", "--ip-version", "4", "--refresh-interval", "10"]
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        # Backstop livenessProbe for the case where the in-loop divergence
        # check in _sync_kea_configuration_async can't recover (e.g. the
        # asyncio loop wedges or the kea control socket is unresponsive long
        # enough that get_config() keeps raising). On failure, kubelet
        # recycles this container, which restarts the Python process and
        # runs the unconditional "Run once" set_config() at startup --
        # heals the deadlock even if the in-loop check is broken.
        #
        # Probes the healthcheck sidecar's /livez endpoint (same pod, same
        # network namespace, so kubelet reaches port 9090 regardless of which
        # container serves it -- same pattern as the kea container's probe).
        #
        # Uses /livez (Kea process alive), NOT the strict /healthcheck: the sync
        # loop's job is to apply config, so a "config not yet applied" state must
        # not restart this container in a loop while it is waiting on Redis. Only
        # a genuinely dead Kea / wedged loop should recycle it.
        #
        # Thresholds are deliberately looser than the kea/healthcheck/api
        # probes (failureThreshold * periodSeconds = 300s of failure) so the
        # in-loop check (~10s recovery) wins under normal conditions and we
        # only recycle the sidecar if the loop itself is the problem.
        livenessProbe:
          httpGet:
            path: /livez
            port: 9090
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 10
        resources:
          {{- toYaml .Values.networkDhcp.resources.confgen | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniFileMountEtcVault" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
      {{- /* SPIFFE helper sidecar for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar" (dict "root" . "serviceName" "network-dhcp") | nindent 6 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- /* SPIFFE volumes */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
---
# DHCP Refresh Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $dhcpName }}-refresh
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $dhcpName }}-refresh
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: network-dhcp-refresh
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: {{ $dhcpName }}-refresh
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $dhcpName }}-refresh
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" (printf "%s-refresh" $dhcpName)) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      # Wait for Nautobot to be available before starting refresh
      {{- if eq (.Values.dcim.provider | default "nautobot-2x") "nautobot-2x" }}
      {{- include "nv-config-manager.waitForNautobot" . | nindent 6 }}
      {{- end }}
      containers:
      - name: config-refresh-v4
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-dhcp-confgen", "refresh-kea-configuration", "--ip-version", "4", "--refresh-interval", "300"]
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathDhcp" . | quote }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        # This container runs in a SEPARATE pod from Kea and must reach Kea to
        # run config-test / seed Redis BEFORE the DHCP pods become Ready. Point
        # it at the internal Kea bootstrap/validation Service
        # (publishNotReadyAddresses) instead of the Ready-only internal Service,
        # so bootstrap works without relaxing the strict readiness gate. The
        # bootstrap endpoint is internal-only and never exposed via the external
        # DHCP Service.
        - name: NV_CONFIG_MANAGER_KEA_SERVER
          value: {{ $dhcpName }}-kea-bootstrap
        - name: NV_CONFIG_MANAGER_KEA_PORT
          value: "8000"
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        resources:
          {{- toYaml .Values.networkDhcp.resources.confgen | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniFileMountEtcVault" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- if .Values.spiffe.enabled }}
        - name: spiffe-jwt-svid
          mountPath: /var/run/secrets/spiffe
          readOnly: true
        {{- end }}
      {{- include "nv-config-manager.spiffeClientSidecar" (dict "root" .) | nindent 6 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- /* SPIFFE volumes for outbound mTLS */ -}}
      {{- include "nv-config-manager.spiffeClientVolumes" (dict "root" .) | nindent 6 }}
---
# Network DHCP Service (LoadBalancer for device access)
# Exposes DHCP (UDP 67) and healthcheck (9090) to network devices on OOB network.
# NOTE: API is NOT exposed here - use Ingress/Gateway for user access.
# NOTE: This external Service intentionally does NOT set
# publishNotReadyAddresses, so it selects ONLY Ready pods. Combined with the
# strict /healthcheck readiness gate, an unconfigured pod can never become an
# external DHCP target. The Kea control port 8000 is also intentionally NOT
# exposed here -- bootstrap/config-test reaches Kea via the internal
# *-kea-bootstrap Service only.
# Only created when an LB provider is configured (nlb, cilium, or metallb).
{{- if or .Values.networkDhcp.ingress.nlb .Values.networkDhcp.ingress.cilium .Values.networkDhcp.ingress.metallb }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $dhcpName }}-service
  namespace: {{ .Values.global.namespace }}
  {{- if .Values.networkDhcp.ingress.cilium }}
  labels:
    app: {{ $dhcpName }}
    component: dhcp
    bgp.scp.nvidia.com/scope: site-local
  {{- else }}
  labels:
    app: {{ $dhcpName }}
    component: dhcp
  {{- end }}
  annotations:
    {{- /* AWS NLB annotations */ -}}
    {{- if .Values.networkDhcp.ingress.nlb }}
    service.beta.kubernetes.io/aws-load-balancer-type: {{ .Values.networkDhcp.ingress.nlb.type | default "external" }}
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: {{ .Values.networkDhcp.ingress.nlb.target_type | default "ip" }}
    service.beta.kubernetes.io/aws-load-balancer-name: {{ .Values.networkDhcp.ingress.nlb.name }}
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-security-groups: {{ .Values.networkDhcp.ingress.nlb.sg }}
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ .Values.networkDhcp.ingress.nlb.subnets }}
    {{- if .Values.networkDhcp.ingress.nlb.ips }}
    service.beta.kubernetes.io/aws-load-balancer-private-ipv4-addresses: {{ .Values.networkDhcp.ingress.nlb.ips }}
    {{- end }}
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "9090"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthcheck
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: {{ dig "cross_zone_load_balancing_enabled" true .Values.networkDhcp.ingress.nlb | quote }}
    {{- end }}
    {{- /* Cilium annotations */ -}}
    {{- if and .Values.networkDhcp.ingress.cilium .Values.networkDhcp.ingress.cilium.staticIP }}
    lbipam.cilium.io/ips: {{ .Values.networkDhcp.ingress.cilium.staticIP }}
    {{- end }}
    {{- /* MetalLB annotations */ -}}
    {{- if and .Values.networkDhcp.ingress.metallb .Values.networkDhcp.ingress.metallb.staticIP }}
    metallb.io/loadBalancerIPs: {{ .Values.networkDhcp.ingress.metallb.staticIP }}
    {{- end }}
    {{- include "nv-config-manager.externalDnsHostname" .Values.networkDhcp.ingress }}
spec:
  type: LoadBalancer
  {{- /* Cilium-specific settings */ -}}
  {{- if .Values.networkDhcp.ingress.cilium }}
  externalTrafficPolicy: Local
  loadBalancerClass: io.cilium/bgp-control-plane
  {{- if .Values.networkDhcp.ingress.cilium.allowedPrefixes }}
  loadBalancerSourceRanges:
  {{- range $prefix := .Values.networkDhcp.ingress.cilium.allowedPrefixes }}
  - {{ $prefix }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- /* MetalLB-specific settings */ -}}
  {{- if .Values.networkDhcp.ingress.metallb }}
  externalTrafficPolicy: Local
  {{- if .Values.networkDhcp.ingress.metallb.allowedPrefixes }}
  loadBalancerSourceRanges:
  {{- range $prefix := .Values.networkDhcp.ingress.metallb.allowedPrefixes }}
  - {{ $prefix }}
  {{- end }}
  {{- end }}
  {{- end }}
  ports:
  - port: 67
    protocol: UDP
    name: dhcp
  - port: 80
    name: healthcheck
    targetPort: 9090
  selector:
    app: {{ $dhcpName }}
{{- end }}
---
# Network DHCP Internal Service
# ClusterIP for in-cluster service-to-service traffic (api reads, stork-agent,
# and the co-located Kea control port). Selects ONLY Ready pods -- it does NOT
# set publishNotReadyAddresses -- so it must never be relied on for bootstrap.
apiVersion: v1
kind: Service
metadata:
  name: {{ $dhcpName }}-internal
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $dhcpName }}
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: kea
  - port: 9000
    name: api
    targetPort: 9000
  - port: {{ .Values.networkDhcp.kea.storkAgentPort }}
    name: stork-agent
  selector:
    app: {{ $dhcpName }}
---
# Network DHCP Kea Bootstrap / Validation Service (INTERNAL ONLY)
#
# Narrowly-scoped ClusterIP that exposes ONLY the Kea control port (8000) and
# sets publishNotReadyAddresses: true so it also resolves to pods that are NOT
# yet Ready. This is what breaks the bootstrap deadlock: the config-refresh
# deployment (a separate pod) uses this endpoint to run `config-test` against a
# freshly started Kea and seed Redis, so a pod can become Ready via the strict
# /healthcheck gate WITHOUT ever weakening readiness.
#
# It deliberately exposes neither the DHCP data port (67) nor the API/stork
# ports, and it is never referenced by the external LoadBalancer Service, so it
# cannot turn an unconfigured pod into an external DHCP target.
apiVersion: v1
kind: Service
metadata:
  name: {{ $dhcpName }}-kea-bootstrap
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $dhcpName }}
    component: kea-bootstrap
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
  - port: 8000
    targetPort: 8000
    name: kea
  selector:
    app: {{ $dhcpName }}
{{- end }}
