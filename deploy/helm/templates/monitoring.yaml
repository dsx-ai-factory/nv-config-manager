{{- /* Nautobot PodMonitor */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.nautobot.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $nautobotName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: nautobot
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  {{- with .Values.monitoring.podMonitors.nautobot.scrapeProtocols }}
  scrapeProtocols:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $nautobotName }}
  podMetricsEndpoints:
    - port: http
      # Nautobot serves metrics at /metrics/ (trailing slash); /metrics 404s.
      path: /metrics/
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Bundled Redis exporter PodMonitor. Gated on the same local Redis and
       exporter conditions as the redis-exporter sidecar. */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.monitoring.podMonitors.redis.enabled .Values.externalServices.redis.local .Values.externalServices.redis.metricsExport.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $redisName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $redisName }}
  podMetricsEndpoints:
    - port: redis-metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Bundled NATS exporter PodMonitor (JetStream metrics for KEDA autoscaling).
       Gated on the same condition as the NATS Deployment. */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.nautobotNats.metrics.enabled (or .Values.nautobotNats.enabled .Values.externalServices.nats.local) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $natsName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $natsName }}
    matchExpressions:
      # The nats-box utility pod shares the app.kubernetes.io/name label but,
      # unlike the nats server pod, carries an app.kubernetes.io/component label.
      # Excluding pods that have that label isolates the server (the only pod
      # exposing the prom-metrics port) so the PodMonitor targets only it.
      - key: app.kubernetes.io/component
        operator: DoesNotExist
  podMetricsEndpoints:
    - port: prom-metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* CNPG PodMonitors: monitoring.podMonitors.enabled + cnpg.enabled +
       monitoring.podMonitors.cnpg.enabled; one CR per enabled cluster
       (clusterList + nautobot). Chart-managed; not Cluster.enablePodMonitor. */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.cnpg.enabled .Values.monitoring.podMonitors.cnpg.enabled }}
{{- range $clusterKey := .Values.cnpg.clusterList }}
{{- $config := index $.Values.cnpg $clusterKey }}
{{- if $config.enabled }}
{{- $podMonitorName := include "nv-config-manager.cnpgPodMonitorName" (dict "root" $ "clusterName" $config.clusterName) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  # This chart deliberately leaves Cluster.spec.monitoring.enablePodMonitor
  # disabled. CloudNativePG may still delete a same-name PodMonitor it does not
  # own, so keep chart-owned monitors release-scoped. Upstream diagnosis:
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/6109
  name: {{ $podMonitorName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" $ | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $config.clusterName }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if $.Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" $ | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- /* Nautobot CNPG cluster — same enable conditions as cnpg-clusters.yaml */}}
{{- $nautobotConfig := .Values.cnpg.nautobot }}
{{- if or $nautobotConfig.enabled (and .Values.nautobot.enabled .Values.externalServices.nautobot.local) }}
{{- $nautobotPodMonitorName := include "nv-config-manager.cnpgPodMonitorName" (dict "root" . "clusterName" $nautobotConfig.clusterName) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $nautobotPodMonitorName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $nautobotConfig.clusterName }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
