#
# PodMonitor resources for Prometheus Operator
# Requires: --enable-monitoring flag and Prometheus Operator CRDs installed
#
# Service-specific configuration (selectors, ports, paths) is defined here.
# Each probe is enabled when monitoring.probes.enabled AND the target service is enabled.
# Each PodMonitor is enabled when monitoring.podMonitors.enabled AND the target service is enabled.
#
# =============================================================================
# Probe Resources (Blackbox Exporter)
# =============================================================================
# These probes work with any supported Gateway API controller and use the
# hostnames configured in each service's gateway.hostname setting.
#
# The scheme (http/https) is determined by:
#   1. monitoring.probes.scheme if explicitly set
#   2. Otherwise, auto-detected from an HTTPS Gateway listener
# =============================================================================
{{- if and .Values.monitoring .Values.monitoring.enabled }}

{{- $namespace := .Values.global.namespace }}
{{- $scrapeInterval := .Values.monitoring.podMonitors.interval | default "30s" }}
{{- $scrapeTimeout := .Values.monitoring.podMonitors.scrapeTimeout | default "10s" }}
{{- $monitoringCRLabels := .Values.global.customLabels | default dict }}

{{- /* Component name helpers - must match the naming in deployment templates */}}
{{- $renderName := include "nv-config-manager.componentName" (dict "root" . "component" "render") }}
{{- $ztpName := include "nv-config-manager.componentName" (dict "root" . "component" "ztp") }}
{{- $dhcpName := include "nv-config-manager.componentName" (dict "root" . "component" "dhcp") }}
{{- $configStoreName := include "nv-config-manager.componentName" (dict "root" . "component" "config-store") }}
{{- $mcpName := include "nv-config-manager.componentName" (dict "root" . "component" "mcp") }}
{{- $temporalName := include "nv-config-manager.componentName" (dict "root" . "component" "temporal") }}
{{- $nautobotName := include "nv-config-manager.componentName" (dict "root" . "component" "nautobot") }}
{{- $natsName := include "nv-config-manager.componentName" (dict "root" . "component" "nats") }}
{{- $redisName := include "nv-config-manager.componentName" (dict "root" . "component" "redis") }}
{{- $uiName := include "nv-config-manager.componentName" (dict "root" . "component" "ui") }}

{{- /* Determine gateway availability and scheme for probes */}}
{{- $hasIngress := .Values.gateway.enabled }}
{{- $probeScheme := .Values.monitoring.probes.scheme | default "" }}
{{- if not $probeScheme }}
{{- $probeScheme = "http" }}
{{- range .Values.gateway.listeners | default list }}
{{- if eq .protocol "HTTPS" }}
{{- $probeScheme = "https" }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
  Optional static `jobName` prefix prepended to every Probe resource's
  `jobName`. The final `job` label is `<jobNamePrefix><componentName>-probe`
  (e.g. with `jobNamePrefix: ""` and release `nv-config-manager-example01` the
  render probe is `nv-config-manager-example01-render-probe`). Override
  per-environment to match site-level alerting / dashboard regexes.
*/}}
{{- $probeJobPrefix := .Values.monitoring.probes.jobNamePrefix | default "" }}

{{- if and .Values.monitoring.probes .Values.monitoring.probes.enabled .Values.monitoring.probes.blackboxExporterUrl $hasIngress }}
{{- /* Render Service Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.renderService.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $renderName
    "component" "render-service"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.renderService.gateway.hostname .))) }}
{{- end }}

{{- /* Network ZTP Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.networkZtp.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $ztpName
    "component" "network-ztp"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.networkZtp.gateway.hostname .))) }}
{{- end }}

{{- /* Network DHCP Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.networkDhcp.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $dhcpName
    "component" "network-dhcp"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.networkDhcp.gateway.hostname .))) }}
{{- end }}

{{- /* Config Store Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.configStore.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $configStoreName
    "component" "config-store"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.configStore.gateway.api.hostname .))) }}
{{- end }}

{{- /* MCP Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.mcp.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $mcpName
    "component" "mcp"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.mcp.gateway.hostname .))) }}
{{- end }}

{{- /* Temporal API Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.temporal.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" (printf "%s-api" $temporalName)
    "component" "temporal-api"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthcheck" $probeScheme (tpl .Values.temporal.gateway.api.hostname .))) }}
{{- end }}

{{- /* Temporal UI Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.temporal.enabled .Values.temporal.server.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" (printf "%s-ui" $temporalName)
    "component" "temporal-ui"
    "scheme" $probeScheme
    "target" (printf "%s://%s/healthz" $probeScheme (tpl .Values.temporal.gateway.devUi.hostname .))) }}
{{- end }}

{{- /* NVIDIA Config Manager UI Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.ui.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $uiName
    "component" "ui"
    "scheme" $probeScheme
    "target" (printf "%s://%s/api/health" $probeScheme (tpl .Values.ui.gateway.hostname .))) }}
{{- end }}

{{- /* Nautobot Probe */}}
{{- if and .Values.monitoring.probes.enabled .Values.nautobot.enabled .Values.externalServices.nautobot.local }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $nautobotName
    "component" "nautobot"
    "scheme" $probeScheme
    "target" (printf "%s://%s/health" $probeScheme (tpl .Values.nautobot.gateway.hostname .))) }}
{{- end }}

{{- /*
  Routes the probes above do not exercise. Each service's healthcheck path is
  matched by its auth-bypass route, so the JWT-only svc-* routes and the
  OIDC-proxied main routes need their own targets. Every proxy listener runs
  in one Deployment, so a single /ping probe covers the gateway-to-proxy path;
  per-listener probes would page once per service for one outage. The proxy
  answers /ping itself without authenticating.
*/}}
{{- if and .Values.oidc.enabled .Values.renderService.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" (printf "%s-proxy" $renderName)
    "component" "oidc-proxy"
    "scheme" $probeScheme
    "target" (printf "%s://%s/ping" $probeScheme (tpl .Values.renderService.gateway.hostname .))) }}
{{- end }}

{{- $nautobotLocal := and .Values.nautobot.enabled .Values.externalServices.nautobot.local }}
{{- $routedServices := list
    (dict "enabled" .Values.renderService.enabled "name" $renderName "component" "render-service" "gateway" .Values.renderService.gateway "health" "/healthcheck")
    (dict "enabled" .Values.networkZtp.enabled "name" $ztpName "component" "network-ztp" "gateway" .Values.networkZtp.gateway "health" "/healthcheck")
    (dict "enabled" .Values.networkDhcp.enabled "name" $dhcpName "component" "network-dhcp" "gateway" .Values.networkDhcp.gateway "health" "/healthcheck")
    (dict "enabled" .Values.temporal.enabled "name" (printf "%s-api" $temporalName) "component" "temporal-api" "gateway" .Values.temporal.gateway.api "health" "/healthcheck")
    (dict "enabled" .Values.configStore.enabled "name" $configStoreName "component" "config-store" "gateway" .Values.configStore.gateway.api "health" "/healthcheck")
    (dict "enabled" .Values.mcp.enabled "name" $mcpName "component" "mcp" "gateway" .Values.mcp.gateway "health" "/healthcheck")
    (dict "enabled" $nautobotLocal "name" $nautobotName "component" "nautobot" "gateway" .Values.nautobot.gateway "health" "/health")
}}
{{- if .Values.oidc.enabled }}
{{- range $svc := $routedServices }}
{{- if $svc.enabled }}
{{- with $svc.gateway.svcHostname }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" $
    "name" (printf "%s-svc" $svc.name)
    "component" $svc.component
    "scheme" $probeScheme
    "target" (printf "%s://%s%s" $probeScheme (tpl . $) $svc.health)) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.ui.enabled .Values.oidc.authUtility.enabled }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" (printf "%s-auth-utility" $uiName)
    "component" "ui"
    "scheme" $probeScheme
    "target" (printf "%s://%s/auth/discovery" $probeScheme .Values.gateway.baseHostname)) }}
{{- end }}
{{- end }}

{{- end }}{{- /* end hasIngress check */}}

{{- /*
  Bundled NATS is probed at /healthz on its gateway route when the gateway is
  enabled, so exporters outside the cluster can reach it; otherwise through
  the in-cluster monitoring endpoint.
*/}}
{{- $natsProbe := .Values.monitoring.probes.nats | default dict }}
{{- if include "nv-config-manager.natsProbeEnabled" . }}
{{- $natsTarget := printf "http://%s.%s.svc:8222/healthz" $natsName $namespace }}
{{- with include "nv-config-manager.natsGatewayHostname" . }}
{{- $natsTarget = printf "%s://%s/healthz" $probeScheme . }}
{{- end }}
{{ include "nv-config-manager.blackboxProbe" (dict
    "root" .
    "name" $natsName
    "component" "nats"
    "scheme" $probeScheme
    "target" ($natsProbe.target | default $natsTarget)) }}
{{- end }}

{{- if and .Values.monitoring.podMonitors .Values.monitoring.podMonitors.enabled }}
{{- /* Render Service PodMonitor */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.renderService.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $renderName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: render-service
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app: {{ $renderName }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
    - port: metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Network ZTP PodMonitor */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.networkZtp.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $ztpName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-ztp
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app: {{ $ztpName }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
    - port: sftp-metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Network DHCP PodMonitor */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.networkDhcp.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $dhcpName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-dhcp
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app: {{ $dhcpName }}
  podMetricsEndpoints:
    - port: stork-agent
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
    - port: healthcheck
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
    # config-sync-v4 process-local registry (CONFGEN_METRICS_PORT in dhcp/cli.py).
    # The /metrics on healthcheck/api is a different process and does not
    # include the reconcile counters or last-successful-sync gauge.
    - port: sync-metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /* Network DHCP Refresh PodMonitor

config-refresh-v4 is its own Deployment, so the selector above does not match
it and its config_generation / config_test failure counters would never be
collected. Same named-port contract as the sync sidecar. */}}
{{- if and .Values.monitoring.podMonitors.enabled .Values.networkDhcp.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $dhcpName }}-refresh
  namespace: {{ $namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-dhcp-refresh
    {{- with $monitoringCRLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nv-config-manager.podTargetLabels" . | nindent 2 }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  selector:
    matchLabels:
      app: {{ $dhcpName }}-refresh
  podMetricsEndpoints:
    - port: refresh-metrics
      path: /metrics
      interval: {{ $scrapeInterval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- if .Values.global.customLabels }}
      metricRelabelings:
        {{- include "nv-config-manager.podMonitorMetricRelabelings" . | nindent 8 }}
      {{- end }}
{{- end }}

