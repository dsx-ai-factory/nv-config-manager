{{- if .Values.temporal.enabled }}
{{- $temporalName := include "nv-config-manager.componentName" (dict "root" . "component" "temporal") }}
---
# RBAC ConfigMap for Temporal API
{{- if .Values.rbac }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $temporalName }}-rbac-config
  namespace: {{ .Values.global.namespace }}
data:
  {{- include "nv-config-manager.configmap.temporal-rbac" . | nindent 2 }}
{{- end }}
---
{{- if .Values.temporal.server.enabled }}
# Temporal Server ConfigMap (PostgreSQL configuration)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $temporalName }}-config
  namespace: {{ .Values.global.namespace }}
data:
  {{- include "nv-config-manager.configmap.temporal-config" . | nindent 2 }}
---
# Temporal Dynamic Config ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $temporalName }}-dynamic-config
  namespace: {{ .Values.global.namespace }}
data:
  {{- include "nv-config-manager.configmap.temporal-dynamic-config" . | nindent 2 }}
---
{{- range $service := (list "frontend" "history" "matching" "worker") }}
{{- $serviceValues := index $.Values.temporal.services $service }}
# Temporal {{ $service | title }} Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}-{{ $service }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: {{ $service }}
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: temporal
spec:
  replicas: {{ $serviceValues.replicas }}
  selector:
    matchLabels:
      app: {{ $temporalName }}
      component: {{ $service }}
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" $) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}
        component: {{ $service }}
        app.kubernetes.io/name: nv-config-manager
        {{- if eq $service "worker" }}
        app.kubernetes.io/component: temporal-worker
        {{- else }}
        app.kubernetes.io/component: temporal
        {{- end }}
        {{- include "nv-config-manager.spiffe.podLabels" $ | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" $ | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" $ | nindent 8 }}
        {{- include "nv-config-manager.otelOptOutAnnotations" $ | nindent 8 }}
        checksum/temporal-config: {{ include "nv-config-manager.configmap.temporal-config" $ | sha256sum }}
        checksum/temporal-dynamic-config: {{ include "nv-config-manager.configmap.temporal-dynamic-config" $ | sha256sum }}
        {{- if include "nv-config-manager.spiffe.enabled" $ }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" $ "app" $temporalName) | nindent 8 }}
        {{- end }}
    spec:
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "nv-config-manager.scheduling" $serviceValues | nindent 6 }}
      initContainers:
      # Render the upstream-compatible config template without introducing a
      # shell into the Temporal server runtime.
      - name: render-config
        image: "{{ include "nv-config-manager.image" (dict "root" $ "image" $.Values.global.images.temporalServer) }}"
        imagePullPolicy: {{ $.Values.global.images.temporalServer.pullPolicy }}
        command: ["/usr/local/bin/dockerize", "-template", "/etc/temporal/config-template/config_template.yaml:/etc/temporal/config/docker.yaml"]
        # dockerize expands these values into the config consumed by the server.
        # Keep them aligned with the server container below; otherwise its
        # template defaults (including PostgreSQL at 127.0.0.1) are used.
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SERVICES
          value: {{ $service }}
        - name: POSTGRES_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.host $ | quote }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: username
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: password
        - name: POSTGRES_VISIBILITY_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.visibilityHost $ | quote }}
        - name: POSTGRES_VISIBILITY_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: username
        - name: POSTGRES_VISIBILITY_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: password
        volumeMounts:
        - name: config-template
          mountPath: /etc/temporal/config-template
          readOnly: true
        - name: rendered-config
          mountPath: /etc/temporal/config
        {{- include "nv-config-manager.containerSecurityContext" $ | nindent 8 }}
      # Wait for both PostgreSQL clusters to be ready (temporal and visibility)
      - name: wait-for-postgres
        image: "{{ $.Values.global.images.busybox.repository }}:{{ $.Values.global.images.busybox.tag }}"
        command:
        - sh
        - -c
        - |
          echo "Waiting for temporal postgres..."
          until nc -z {{ tpl $.Values.externalServices.postgres.temporal.host $ }} {{ $.Values.externalServices.postgres.port }}; do
            echo "waiting for postgres at {{ tpl $.Values.externalServices.postgres.temporal.host $ }}:{{ $.Values.externalServices.postgres.port }}"
            sleep 2
          done
          echo "Temporal postgres is ready"
          
          echo "Waiting for visibility postgres..."
          until nc -z {{ tpl $.Values.externalServices.postgres.temporal.visibilityHost $ }} {{ $.Values.externalServices.postgres.port }}; do
            echo "waiting for postgres at {{ tpl $.Values.externalServices.postgres.temporal.visibilityHost $ }}:{{ $.Values.externalServices.postgres.port }}"
            sleep 2
          done
          echo "Visibility postgres is ready"
      {{- if eq $service "frontend" }}
      # Frontend runs schema setup before starting (other services wait for frontend)
      - name: schema-setup
        image: "{{ include "nv-config-manager.image" (dict "root" $ "image" $.Values.global.images.temporalBootstrap) }}"
        imagePullPolicy: {{ $.Values.global.images.temporalBootstrap.pullPolicy }}
        command: ["/usr/local/bin/temporal-bootstrap", "setup-schema"]
        env:
        # Temporal database credentials
        - name: TEMPORAL_DB_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.host $ | quote }}
        - name: TEMPORAL_DB_NAME
          value: {{ $.Values.externalServices.postgres.temporal.database | quote }}
        - name: TEMPORAL_DB_PORT
          value: {{ $.Values.externalServices.postgres.port | quote }}
        - name: TEMPORAL_DB_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: username
        - name: TEMPORAL_DB_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: password
        # Visibility database credentials
        - name: VISIBILITY_DB_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.visibilityHost $ | quote }}
        - name: VISIBILITY_DB_NAME
          value: {{ $.Values.externalServices.postgres.temporal.visibilityDatabase | quote }}
        - name: VISIBILITY_DB_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: username
        - name: VISIBILITY_DB_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: password
        {{- include "nv-config-manager.containerSecurityContext" $ | nindent 8 }}
      {{- else }}
      # Non-frontend services wait for frontend to be ready (which implies schema is set up)
      - name: wait-for-frontend
        image: "{{ $.Values.global.images.busybox.repository }}:{{ $.Values.global.images.busybox.tag }}"
        command: ['sh', '-c', 'until nc -z {{ $temporalName }}-frontend-service.{{ $.Values.global.namespace }}.svc.cluster.local {{ (index $.Values.temporal.services "frontend").port }}; do echo "waiting for {{ $temporalName }}-frontend-service.{{ $.Values.global.namespace }}.svc.cluster.local"; sleep 2; done; echo "frontend is ready"']
      {{- end }}
      containers:
      - name: temporal-{{ $service }}
        image: "{{ include "nv-config-manager.image" (dict "root" $ "image" $.Values.global.images.temporalServer) }}"
        imagePullPolicy: {{ $.Values.global.images.temporalServer.pullPolicy }}
        # Temporal 1.29 parses --root and --env as global options, before the
        # start subcommand.  The upstream entrypoint also translates SERVICES
        # into --service flags; do that explicitly in the distroless image.
        command: ["/usr/local/bin/temporal-server", "--root", "/etc/temporal", "--env", "docker", "start", "--service={{ $service }}"]
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SERVICES
          value: {{ $service }}
        # Temporal server only supports OTLP/gRPC; disable injected http/protobuf tracing.
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        # Temporal database credentials
        - name: POSTGRES_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.host $ | quote }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: username
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-app
              key: password
        # Visibility database credentials
        - name: POSTGRES_VISIBILITY_HOST
          value: {{ tpl $.Values.externalServices.postgres.temporal.visibilityHost $ | quote }}
        - name: POSTGRES_VISIBILITY_USER
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: username
        - name: POSTGRES_VISIBILITY_PASS
          valueFrom:
            secretKeyRef:
              name: cluster-temporal-visibility-app
              key: password
        ports:
        - name: rpc
          containerPort: {{ $serviceValues.port }}
          protocol: TCP
        - name: metrics
          containerPort: 8000
          protocol: TCP
        {{- if ne $service "worker" }}
        livenessProbe:
          initialDelaySeconds: 150
          tcpSocket:
            port: rpc
        {{- end }}
        volumeMounts:
        - name: rendered-config
          mountPath: /etc/temporal/config
        - name: dynamic-config
          mountPath: /etc/temporal/dynamic_config
        resources:
          {{- toYaml $serviceValues.resources | nindent 10 }}
        {{- include "nv-config-manager.containerSecurityContext" $ | nindent 8 }}
      volumes:
      - name: config-template
        configMap:
          name: {{ $temporalName }}-config
      - name: rendered-config
        emptyDir: {}
      - name: dynamic-config
        configMap:
          name: {{ $temporalName }}-dynamic-config
          items:
          - key: dynamic_config.yaml
            path: dynamic_config.yaml
      {{- /* SPIFFE volumes for identity (no sidecar for gRPC internal services) */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" $) | nindent 6 }}
{{- if eq $service "frontend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalName }}-{{ $service }}-service
  namespace: {{ $.Values.global.namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: {{ $serviceValues.port }}
    targetPort: rpc
    protocol: TCP
    name: grpc-rpc
  selector:
    app: {{ $temporalName }}
    component: {{ $service }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalName }}-{{ $service }}-service-headless
  namespace: {{ $.Values.global.namespace }}
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: {{ $serviceValues.port }}
    targetPort: rpc
    protocol: TCP
    name: grpc-rpc
  selector:
    app: {{ $temporalName }}
    component: {{ $service }}
---
{{- end }}
{{- end }}
# NVIDIA Config Manager Temporal Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nv-config-manager.temporalWorkerName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: worker
spec:
  replicas: {{ .Values.temporal.configManagerWorker.replicas }}
  selector:
    matchLabels:
      app: {{ $temporalName }}
      component: worker
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}
        component: worker
        app.kubernetes.io/component: nv-config-manager-worker
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $temporalName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.temporal.configManagerWorker | nindent 6 }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      {{- if .Values.temporal.server.enabled }}
      # Initialize Temporal namespace and search attributes
      - name: temporal-setup
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.temporalBootstrap) }}"
        imagePullPolicy: {{ .Values.global.images.temporalBootstrap.pullPolicy }}
        command: ["/usr/local/bin/temporal-bootstrap", "setup-namespace"]
        env:
        - name: TEMPORAL_ADDR
          value: "{{ $temporalName }}-frontend-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.temporal.services.frontend.port }}"
        - name: TEMPORAL_NAMESPACE
          value: {{ .Values.temporal.client.namespace | default "default" | quote }}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
      {{- end }}
      containers:
      - name: worker
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        command: ["nv-config-manager-temporal-worker"]
        args: []
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        {{- if .Values.localDev.enableLocalTestWorkflows }}
        - name: NVCM_ENABLE_LOCAL_TEST_WORKFLOWS
          value: "true"
        {{- end }}
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        - name: NV_CONFIG_MANAGER_CONFIG_SECRET_PATH
          value: {{ include "nv-config-manager.vaultAgent.configSecretsFilePath" (dict "root" . "path" .Values.temporal.configManagerWorker.configSecrets.path) | quote }}
        {{- end }}
        {{- if and (eq .Values.secrets.method "vault-agent") .Values.temporal.redfish.enabled }}
        - name: BMC_CREDS_PATH
          value: "/vault/secrets/bmc-creds.json"
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-temporal-worker") | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.temporal.configManagerWorker.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.vaultAgent.bmcVolumeMount" . | nindent 8 }}
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        {{- include "nv-config-manager.vaultAgent.configSecretsVolumeMount" (dict "root" . "mountPath" .Values.temporal.configManagerWorker.configSecrets.mountPath) | nindent 8 }}
        {{- end }}
        {{- if .Values.spiffe.enabled }}
        - name: spiffe-jwt-svid
          mountPath: /var/run/secrets/spiffe
          readOnly: true
        {{- end }}
        {{- include "nv-config-manager.temporalClientTLSVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
      {{- include "nv-config-manager.spiffeClientSidecar" (dict "root" .) | nindent 6 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.bmcVolume" . | nindent 6 }}
      {{- include "nv-config-manager.temporalClientTLSVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- if .Values.secrets.vault.configSecrets.enabled }}
      {{- include "nv-config-manager.vaultAgent.configSecretsVolume" . | nindent 6 }}
      {{- end }}
      {{- /* SPIFFE volumes for outbound mTLS */ -}}
      {{- include "nv-config-manager.spiffeClientVolumes" (dict "root" .) | nindent 6 }}
---
# NVIDIA Config Manager Temporal API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: api
spec:
  replicas: {{ .Values.temporal.api.replicas }}
  selector:
    matchLabels:
      app: {{ $temporalName }}
      component: api
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}
        component: api
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if .Values.rbac }}
        checksum/rbac-config: {{ include "nv-config-manager.configmap.temporal-rbac" . | sha256sum }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $temporalName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.dcim.providerPackages.enabled }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      {{- end }}
      containers:
      - name: api
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        command: ["nv-config-manager-temporal-api"]
        args: []
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: NV_CONFIG_MANAGER_SERVICE
          value: "temporal.api"
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.fastApiMetricsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-temporal-api") | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 9000
          name: http
        resources:
          {{- toYaml .Values.temporal.configManagerWorker.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.temporalClientTLSVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- if .Values.rbac }}
        - name: rbac-config
          mountPath: /etc/rbac
          readOnly: true
        {{- end }}
        {{- include "nv-config-manager.authVolumeMounts" . | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      {{- /* SPIFFE helper sidecar for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar" (dict "root" . "serviceName" "nv-config-manager-temporal-api") | nindent 6 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.temporalClientTLSVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- if .Values.rbac }}
      - name: rbac-config
        configMap:
          name: {{ $temporalName }}-rbac-config
      {{- end }}
      {{- /* SPIFFE volumes */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
---
# NVIDIA Config Manager Temporal API Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalName }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: {{ $temporalName }}
    component: api
{{- if and .Values.temporal.scheduler.enabled (eq (.Values.dcim.provider | default "nautobot-2x") "nautobot-2x") }}
---
# NVIDIA Config Manager Temporal Scheduler Deployment (for Nautobot backup scheduling)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}-scheduler
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: scheduler
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: {{ $temporalName }}
      component: scheduler
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}
        component: scheduler
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if .Values.rbac }}
        checksum/rbac-config: {{ include "nv-config-manager.configmap.temporal-rbac" . | sha256sum }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $temporalName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.temporal.scheduler | nindent 6 }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      # The scheduler runs only with the built-in Nautobot provider.
      {{- include "nv-config-manager.waitForNautobot" . | nindent 6 }}
      # A locally managed Temporal server creates the configured namespace.
      {{- if .Values.temporal.server.enabled }}
      {{- include "nv-config-manager.waitForTemporalNamespace" . | nindent 6 }}
      {{- end }}
      containers:
      - name: scheduler
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        command: ["nv-config-manager-temporal-scheduler"]
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-temporal-scheduler") | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.temporal.scheduler.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.temporalClientTLSVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- if .Values.rbac }}
        - name: rbac-config
          mountPath: /etc/rbac
          readOnly: true
        {{- end }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.temporalClientTLSVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- if .Values.rbac }}
      - name: rbac-config
        configMap:
          name: {{ $temporalName }}-rbac-config
      {{- end }}
      {{- /* SPIFFE volumes for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
{{- end }}
---
# Archive Service (if enabled)
{{- if .Values.temporal.archive.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}-archive
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    component: archive
spec:
  replicas: {{ .Values.temporal.archive.replicas }}
  selector:
    matchLabels:
      app: {{ $temporalName }}
      component: archive
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}
        component: archive
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $temporalName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.dcim.providerPackages.enabled }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      {{- end }}
      containers:
      - name: archive
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        command: ["nv-config-manager-temporal-archive"]
        args: ["-v"]
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        - name: TEMPORAL_API_HOST
          value: {{ tpl .Values.temporal.gateway.api.hostname . | quote }}
        {{- include "nv-config-manager.dcimProviderPythonPath" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-temporal-archive") | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.temporal.archive.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.temporalClientTLSVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- /* SPIFFE volume mount for outbound mTLS */ -}}
        {{- include "nv-config-manager.spiffe.volumeMounts" . | nindent 8 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- include "nv-config-manager.temporalClientTLSVolume" . | nindent 6 }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- /* SPIFFE volumes for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
{{- end }}
---
# Temporal Web UI Deployment
{{- if .Values.temporal.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}-web
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: temporal-web
spec:
  replicas: {{ .Values.temporal.devUi.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $temporalName }}-web
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $temporalName }}-web
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" (printf "%s-web" $temporalName)) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      {{- include "nv-config-manager.scheduling" .Values.temporal.devUi | nindent 6 }}
      containers:
      - name: {{ $temporalName }}-web
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.temporalUi) }}"
        imagePullPolicy: {{ .Values.global.images.temporalUi.pullPolicy }}
        env:
        - name: TEMPORAL_ADDRESS
          value: {{ include "nv-config-manager.temporalGrpcAddress" . | quote }}
        {{- $codecEndpoint := .Values.temporal.devUi.codecEndpoint }}
        {{- if $codecEndpoint }}
        - name: TEMPORAL_CODEC_ENDPOINT
          value: {{ tpl $codecEndpoint . | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml (.Values.temporal.devUi.resources | default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "200m" "memory" "128Mi"))) | nindent 10 }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
      {{- /* Temporal Web is OIDC-only: no auth sidecar - Envoy Gateway handles auth at the edge */}}
---
# Temporal Web UI Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalName }}-web-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}-web
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: {{ $temporalName }}-web
---
# PodDisruptionBudget for Temporal server worker service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-worker-pdb" $temporalName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: temporal-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $temporalName }}
      app.kubernetes.io/component: temporal-worker
{{- end }}
---
# PodDisruptionBudget for nv-config-manager Temporal worker (workflow executor)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-pdb" (include "nv-config-manager.temporalWorkerName" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $temporalName }}
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: nv-config-manager-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $temporalName }}
      app.kubernetes.io/component: nv-config-manager-worker
{{- end }}
