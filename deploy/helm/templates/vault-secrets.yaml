    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "{{ include "nv-config-manager.vault.secretPath" (dict "root" . "secret" "postgres") }}"
        property: {{ include "nv-config-manager.vault.keyName" (dict "root" . "secret" "postgres" "key" "temporalUser") }}
    - secretKey: password
      remoteRef:
        key: "{{ include "nv-config-manager.vault.secretPath" (dict "root" . "secret" "postgres") }}"
