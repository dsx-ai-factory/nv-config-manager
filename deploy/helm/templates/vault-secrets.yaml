# OIDC/SSO client credentials for the gateway-independent proxy.
{{- if .Values.oidc.enabled }}
{{- if .Values.secrets.vault.paths.oidc }}
{{- if .Values.secrets.vault.paths.oidc.path }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-client-secret-eso
  namespace: {{ .Values.global.namespace }}
spec:
  secretStoreRef:
    name: {{ $vaultSecretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.oidc.clientSecretName | default "oidc-client-secret" }}
    creationPolicy: Owner
  data:
    {{- $clientSecretProp := include "nv-config-manager.vault.keyName" (dict "root" . "secret" "oidc" "key" "clientSecret") }}
    - secretKey: client-secret
      remoteRef:
        key: "{{ include "nv-config-manager.vault.secretPath" (dict "root" . "secret" "oidc") }}"
        {{- if $clientSecretProp }}
        property: {{ $clientSecretProp }}
        {{- end }}
    - secretKey: cookie-secret
      remoteRef:
        key: "{{ include "nv-config-manager.vault.secretPath" (dict "root" . "secret" "oidc") }}"
        property: {{ include "nv-config-manager.vault.keyName" (dict "root" . "secret" "oidc" "key" "cookieSecret") }}
  refreshInterval: 300s
{{- end }}
{{- end }}
{{- end }}

# =============================================================================
# PostgreSQL Database Credentials
# =============================================================================
# Creates secrets with 'username' and 'password' keys for PostgreSQL access.
# These are used by:
#   - CNPG clusters (when cnpg.enabled) for bootstrap/superuser auth
#   - Application services (temporal, config-store, etc.) for DB connections
#
# Secrets are created whenever a consuming service needs them, regardless of
# whether the PostgreSQL cluster is managed by CNPG or external.
# =============================================================================

# Temporal database credentials
{{- if and .Values.temporal.enabled .Values.temporal.server.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
