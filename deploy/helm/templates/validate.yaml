{{- $gatewayType := include "nv-config-manager.gatewayControllerType" . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- range $key, $_ := $ingress -}}
  {{- if ne $key "type" -}}
    {{- fail (printf "ingress.%s is no longer supported; retain only ingress.type (envoyGateway or kgateway) and configure Gateway API settings under gateway.*" $key) -}}
  {{- end -}}
{{- end -}}
{{- if not (has $gatewayType (list "envoyGateway" "kgateway")) -}}
  {{- fail (printf "ingress.type must be one of envoyGateway or kgateway, got %q" $gatewayType) -}}
{{- end -}}
{{- if and (eq $gatewayType "kgateway") .Values.gateway.nlb -}}
  {{- fail "gateway.nlb is supported only with Envoy Gateway; kgateway NLB service configuration is not implemented" -}}
{{- end -}}
{{- if and .Values.gateway.create (ne (.Values.gateway.namespace | default .Values.global.namespace) .Values.global.namespace) -}}
  {{- fail "gateway.namespace may differ from global.namespace only when gateway.create=false (shared gateway mode)" -}}
{{- end -}}
{{- if and (eq $gatewayType "kgateway") .Values.gateway.create (.Values.gateway.createGatewayClass | default false) -}}
  {{- fail "kgateway owns its GatewayClass; set gateway.createGatewayClass=false" -}}
{{- end -}}
{{- if and (eq $gatewayType "kgateway") (ne (.Values.gateway.timeout.maxConnectionDuration | default "0s") "0s") -}}
  {{- fail "gateway.timeout.maxConnectionDuration is not supported by kgateway; set it to 0s" -}}
{{- end -}}
{{- if and (eq $gatewayType "kgateway") .Values.gateway.create .Values.gateway.rateLimit.enabled (not (dig "rateLimit" "kgateway" "extensionRef" "name" "" .Values.gateway)) -}}
  {{- fail "gateway.rateLimit.kgateway.extensionRef.name is required when global rate limiting is enabled for kgateway" -}}
{{- end -}}
{{- if and .Values.gateway.enabled (eq $gatewayType "kgateway") .Values.gateway.create (dig "nodePort" "enabled" false .Values.gateway) -}}
  {{- $httpListeners := 0 -}}
  {{- $httpsListeners := 0 -}}
  {{- range .Values.gateway.listeners -}}
    {{- if eq .protocol "HTTP" -}}
      {{- $httpListeners = add $httpListeners 1 -}}
    {{- else if eq .protocol "HTTPS" -}}
      {{- $httpsListeners = add $httpsListeners 1 -}}
    {{- end -}}
  {{- end -}}
  {{- if gt $httpListeners 1 -}}
    {{- fail "gateway.nodePort supports at most one HTTP listener for kgateway" -}}
  {{- end -}}
  {{- if gt $httpsListeners 1 -}}
    {{- fail "gateway.nodePort supports at most one HTTPS listener for kgateway" -}}
  {{- end -}}
{{- end -}}
{{- $ztpTLS := .Values.networkZtp.ingress.tls | default dict -}}
{{- $ztpTLSCertificate := $ztpTLS.certificate | default dict -}}
{{- if and (or .Values.networkZtp.certificates.enabled ($ztpTLS.enabled | default false)) (not .Values.networkZtp.enabled) -}}
  {{- fail "networkZtp.enabled must be true when ZTP certificate delivery or TLS is enabled" -}}
{{- end -}}
{{- if and .Values.networkZtp.certificates.enabled (eq .Values.networkZtp.certificates.provider "vault") -}}
  {{- $vaultPki := .Values.networkZtp.certificates.vault | default dict -}}
  {{- range $field := list "address" "authMount" "authRole" "pkiMount" -}}
    {{- if not (index $vaultPki $field) -}}
      {{- fail (printf "networkZtp.certificates.vault.%s is required when Vault certificate delivery is enabled" $field) -}}
    {{- end -}}
  {{- end -}}
  {{- if and (not ($vaultPki.allowInsecure | default false)) (not (hasPrefix "https://" $vaultPki.address)) -}}
    {{- fail "networkZtp.certificates.vault.address must use HTTPS unless allowInsecure is explicitly enabled" -}}
  {{- end -}}
  {{- if and (hasKey $vaultPki "verify") (kindIs "bool" $vaultPki.verify) (not $vaultPki.verify) (not ($vaultPki.allowInsecure | default false)) -}}
    {{- fail "networkZtp.certificates.vault.verify may be false only when allowInsecure is explicitly enabled" -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.networkZtp.certificates.enabled (eq (len (.Values.networkZtp.certificates.sources | default list)) 0) -}}
  {{- fail "networkZtp.certificates.sources requires at least one entry when certificate delivery is enabled" -}}
{{- end -}}
{{- if and .Values.networkZtp.certificates.enabled (not (or .Values.networkZtp.ingress.nlb .Values.networkZtp.ingress.cilium .Values.networkZtp.ingress.metallb)) -}}
  {{- fail "networkZtp certificate delivery requires an NLB, Cilium, or MetalLB ZTP ingress provider for SFTP" -}}
{{- end -}}
{{- range $source := .Values.networkZtp.certificates.sources | default list -}}
  {{- if not (or ($source.issueRole | default "") ($source.caPath | default "")) -}}
    {{- fail "every networkZtp.certificates.sources entry requires issueRole, caPath, or both" -}}
  {{- end -}}
{{- end -}}
{{- if and ($ztpTLS.enabled | default false) (not (or .Values.networkZtp.ingress.nlb .Values.networkZtp.ingress.cilium .Values.networkZtp.ingress.metallb)) -}}
  {{- fail "networkZtp.ingress.tls.enabled requires an NLB, Cilium, or MetalLB ZTP ingress provider" -}}
{{- end -}}
{{- if and ($ztpTLS.enabled | default false) ($ztpTLSCertificate.create | default false) (eq (len ($ztpTLSCertificate.dnsNames | default list)) 0) (eq (len ($ztpTLSCertificate.ipAddresses | default list)) 0) -}}
  {{- fail "networkZtp.ingress.tls.certificate requires at least one dnsNames or ipAddresses entry" -}}
{{- end -}}
{{- if and ($ztpTLS.enabled | default false) (not ($ztpTLSCertificate.create | default false)) (not ($ztpTLS.secretName | default "")) -}}
  {{- fail "networkZtp.ingress.tls.secretName is required when TLS is enabled and certificate.create is false" -}}
{{- end -}}
