{{- if .Values.renderService.enabled }}
{{- $renderName := include "nv-config-manager.componentName" (dict "root" . "component" "render") }}
{{- /* /opt/plugins is needed whenever either plugin mechanism is on -- the
   static image-based one (templatePlugins) or the dynamic
   fetch-on-activation one (unsafeDynamicTemplatePlugins), not just the
   first. */}}
{{- $pluginsMountNeeded := or .Values.renderService.templatePlugins.enabled (eq (include "nv-config-manager.dynamicPlugins.enabled" .) "true") }}
---
# Render Service API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $renderName }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $renderName }}
    component: api
    app.kubernetes.io/name: nv-config-manager
    app.kubernetes.io/component: render-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.renderService.api.replicas }}
  selector:
    matchLabels:
      app: {{ $renderName }}
      component: api
  {{- include "nv-config-manager.deploymentStrategy" (dict "root" .) | nindent 2 }}
  template:
    metadata:
      labels:
        app: {{ $renderName }}
        component: api
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotations" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $renderName) | nindent 8 }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelOptOutAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.renderService.api | nindent 6 }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      {{- if or $pluginsMountNeeded .Values.dcim.providerPackages.enabled }}
      initContainers:
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      {{- if .Values.renderService.templatePlugins.enabled }}
      {{- include "nv-config-manager.copyTemplatePluginImages" . | nindent 6 }}
      {{- include "nv-config-manager.installTemplatePlugins" . | nindent 6 }}
      {{- end }}
      {{- include "nv-config-manager.fetchPluginArtifactInitContainer" . | nindent 6 }}
      {{- end }}
      containers:
      - name: api
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-render-api"]
        args: []
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: NV_CONFIG_MANAGER_SERVICE
          value: "render"
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        {{- with .Values.global.defaultUserDomain }}
        - name: NV_CONFIG_MANAGER_DOMAIN
          value: {{ . | quote }}
        {{- end }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        {{- include "nv-config-manager.fastApiMetricsEnv" . | nindent 8 }}
        - name: NV_CONFIG_MANAGER_DEV_SALT
          value: "W585uq6K"
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        - name: NV_CONFIG_MANAGER_CONFIG_SECRET_PATH
          value: {{ include "nv-config-manager.vaultAgent.configSecretsFilePath" (dict "root" . "path" .Values.renderService.configSecrets.path) | quote }}
        {{- end }}
        {{- include "nv-config-manager.pythonPluginPath" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        {{- include "nv-config-manager.otelAppEnv" (dict "root" . "serviceName" "nv-config-manager-render") | nindent 8 }}
        {{- end }}
        {{- if eq (include "nv-config-manager.dynamicPlugins.enabled" .) "true" }}
        # SRD §5.2 / SADD §9.3: activation triggers a rolling
        # restart of these three Deployments rather than an in-process warm
        # pool. Only the api container serves /v1/activation/activate, so
        # only it needs these -- consumer containers don't.
        - name: RENDER_ACTIVATION_DEPLOYMENTS
          value: "{{ $renderName }}-api,{{ $renderName }}-consumer-nautobot,{{ $renderName }}-consumer-device"
        # This container's own Deployment -- restarted last, fire-and-forget,
        # since the pod handling the activation request can't wait on its own
        # rollout without racing its own termination. See rollout.py's
        # trigger_and_wait_for_rollout() docstring.
        - name: RENDER_ACTIVATION_SELF_DEPLOYMENT
          value: "{{ $renderName }}-api"
        - name: RENDER_ACTIVATION_NAMESPACE
          value: {{ .Values.global.namespace | quote }}
        - name: RENDER_ACTIVATION_CONFIGMAP
          value: "{{ $renderName }}-activation-state"
        {{- if .Values.renderService.unsafeDynamicTemplatePlugins.rolloutTimeoutSeconds }}
        - name: RENDER_ACTIVATION_ROLLOUT_TIMEOUT_SECONDS
          value: {{ .Values.renderService.unsafeDynamicTemplatePlugins.rolloutTimeoutSeconds | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 9000
          name: http
        resources:
          {{- toYaml .Values.renderService.api.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        {{- include "nv-config-manager.vaultAgent.configSecretsVolumeMount" (dict "root" . "mountPath" .Values.renderService.configSecrets.mountPath) | nindent 8 }}
        {{- end }}
        {{- if $pluginsMountNeeded }}
        - name: template-plugins-installed
          mountPath: /opt/plugins
          readOnly: true
        {{- end }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- include "nv-config-manager.authVolumeMounts" . | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
      {{- /* SPIFFE helper sidecar for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar" (dict "root" . "serviceName" "render-service-api") | nindent 6 }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- if .Values.secrets.vault.configSecrets.enabled }}
      {{- include "nv-config-manager.vaultAgent.configSecretsVolume" . | nindent 6 }}
      {{- end }}
      {{- if $pluginsMountNeeded }}
      {{- include "nv-config-manager.templatePluginVolumes" . | nindent 6 }}
      {{- end }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- /* SPIFFE volumes */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
---
# Render Service API Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $renderName }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $renderName }}
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: {{ $renderName }}
    component: api
---
