---
# Render Service - Template Updater Job (runs once to completion)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $renderName }}-template-updater
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $renderName }}
    component: template-updater
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Config-store migrations run at weight 5; rendering requires the new schema.
    "helm.sh/hook-weight": "10"
spec:
  ttlSecondsAfterFinished: {{ .Values.renderService.templateUpdater.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.renderService.templateUpdater.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.renderService.templateUpdater.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ $renderName }}
        component: template-updater
        {{- include "nv-config-manager.spiffe.podLabels" . | nindent 8 }}
        {{- include "nv-config-manager.customPodLabels" . | nindent 8 }}
      annotations:
        {{- include "nv-config-manager.authIniChecksum" . | nindent 8 }}
        {{- if eq .Values.secrets.method "vault-agent" }}
        {{- include "nv-config-manager.vaultAgent.injectorAnnotationsJob" . | nindent 8 }}
        {{- end }}
        {{- if include "nv-config-manager.spiffe.enabled" . }}
        {{- include "nv-config-manager.spiffe.annotations" (dict "root" . "app" $renderName) | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: OnFailure  # Required for Jobs - only restart on failure, not on success
      serviceAccountName: {{ include "nv-config-manager.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- include "nv-config-manager.scheduling" .Values.renderService.templateUpdater | nindent 6 }}
      {{- include "nv-config-manager.podSecurityContext" . | nindent 6 }}
      initContainers:
      # Wait for dependencies before running direct template update renders.
      {{- if eq (.Values.dcim.provider | default "nautobot-2x") "nautobot-2x" }}
      {{- include "nv-config-manager.waitForNautobot" . | nindent 6 }}
      {{- end }}
      {{- include "nv-config-manager.waitForRedis" . | nindent 6 }}
      {{- include "nv-config-manager.copyDCIMProviderImages" . | nindent 6 }}
      {{- include "nv-config-manager.installDCIMProviderPackages" . | nindent 6 }}
      {{- if .Values.renderService.templatePlugins.enabled }}
      {{- include "nv-config-manager.copyTemplatePluginImages" . | nindent 6 }}
      {{- include "nv-config-manager.installTemplatePlugins" . | nindent 6 }}
      {{- end }}
      {{- include "nv-config-manager.spiffeClientSidecar" (dict "root" . "native" true) | nindent 6 }}
      {{- include "nv-config-manager.waitForSpiffeJwt" . | nindent 6 }}
      {{- include "nv-config-manager.fetchPluginArtifactInitContainer" . | nindent 6 }}
      containers:
      - name: template-updater
        image: "{{ include "nv-config-manager.image" (dict "root" . "image" .Values.global.images.nvConfigManager) }}"
        imagePullPolicy: {{ .Values.global.images.nvConfigManager.pullPolicy }}
        {{- include "nv-config-manager.containerSecurityContext" . | nindent 8 }}
        command: ["nv-config-manager-render-template-updater"]
        args: []
        env:
        - name: NV_CONFIG_MANAGER_INI
          value: {{ include "nv-config-manager.vaultAgent.configManagerIniPathApp" . | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment }}
        {{- with .Values.global.defaultUserDomain }}
        - name: NV_CONFIG_MANAGER_DOMAIN
          value: {{ . | quote }}
        {{- end }}
        {{- include "nv-config-manager.customLabelsEnv" . | nindent 8 }}
        - name: NV_CONFIG_MANAGER_DEV_SALT
          value: "W585uq6K"
        - name: NV_CONFIG_MANAGER_TEMPLATE_UPDATE_CONCURRENCY
          value: {{ .Values.renderService.templateUpdater.concurrency | quote }}
        - name: NV_CONFIG_MANAGER_TEMPLATE_UPDATE_LOCK_TIMEOUT
          value: {{ .Values.renderService.templateUpdater.lockTimeoutSeconds | quote }}
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        - name: NV_CONFIG_MANAGER_CONFIG_SECRET_PATH
          value: {{ include "nv-config-manager.vaultAgent.configSecretsFilePath" (dict "root" . "path" .Values.renderService.configSecrets.path) | quote }}
        {{- end }}
        {{- include "nv-config-manager.pythonPluginPath" . | nindent 8 }}
        resources:
          {{- toYaml .Values.renderService.templateUpdater.resources | nindent 10 }}
        volumeMounts:
        {{- include "nv-config-manager.vaultAgent.configManagerIniVolumeMount" . | nindent 8 }}
        {{- if .Values.secrets.vault.configSecrets.enabled }}
        {{- include "nv-config-manager.vaultAgent.configSecretsVolumeMount" (dict "root" . "mountPath" .Values.renderService.configSecrets.mountPath) | nindent 8 }}
        {{- end }}
        {{- if $pluginsMountNeeded }}
        - name: template-plugins-installed
          mountPath: /opt/plugins
          readOnly: true
        {{- end }}
        {{- include "nv-config-manager.dcimProviderPackageVolumeMount" . | nindent 8 }}
        {{- if and .Values.spiffe.enabled (eq (.Values.spiffe.authMode | default "jwt") "jwt") }}
        - name: spiffe-jwt-svid
          mountPath: /var/run/secrets/spiffe
          readOnly: true
        {{- end }}
      volumes:
      {{- include "nv-config-manager.vaultAgent.projectedSATokenVolume" . | nindent 6 }}
      {{- include "nv-config-manager.vaultAgent.configManagerIniVolume" . | nindent 6 }}
      {{- if .Values.secrets.vault.configSecrets.enabled }}
      {{- include "nv-config-manager.vaultAgent.configSecretsVolume" . | nindent 6 }}
      {{- end }}
      {{- if $pluginsMountNeeded }}
      {{- include "nv-config-manager.templatePluginVolumes" . | nindent 6 }}
      {{- end }}
      {{- include "nv-config-manager.dcimProviderPackageVolumes" . | nindent 6 }}
      {{- /* SPIFFE volumes for outbound JWT-SVID */ -}}
      {{- include "nv-config-manager.authSidecar.volumes" (dict "root" .) | nindent 6 }}
{{- if eq (include "nv-config-manager.dynamicPlugins.enabled" .) "true" }}
---
# Pre-created by Helm so the render-service ServiceAccount never needs a
# "create" RBAC verb on configmaps (which can't be scoped by resourceNames,
# since the object doesn't exist yet at grant time -- see the Role below).
# ActivationStateStore.get()/update() still tolerate this ConfigMap being
# absent (e.g. if an operator manually deletes it with their own,
# separately-scoped kubectl credentials), but the application's own
# ServiceAccount is never granted the permission to recreate it itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $renderName }}-activation-state
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
# Deliberately no `data`: the render service owns and rewrites the state at activation time. If Helm (or
# ArgoCD) also declared it, every upgrade/sync would either conflict with the application's writes or
# reset the recorded active plugin set. The state store treats a missing `state.json` as empty.
---
# SRD §5.2: minimal RBAC for the render-service ServiceAccount
# to trigger/monitor a rolling restart of its own three Deployments and
# read/write the activation-state ConfigMap. Only rendered when the flag is
# on -- matches the same convention as templatePlugins' resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $renderName }}-activation-role
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
    resourceNames:
      - {{ $renderName }}-api
      - {{ $renderName }}-consumer-nautobot
      - {{ $renderName }}-consumer-device
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
    resourceNames:
      - {{ $renderName }}-activation-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $renderName }}-activation-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $renderName }}-activation-role
subjects:
  - kind: ServiceAccount
    name: {{ include "nv-config-manager.serviceAccountName" . }}
    namespace: {{ .Values.global.namespace }}
{{- end }}
{{- end }}
