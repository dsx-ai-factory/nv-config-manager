{{- $dhcpName := include "nv-config-manager.componentName" (dict "root" . "component" "dhcp") }}
{{- $ztpName := include "nv-config-manager.componentName" (dict "root" . "component" "ztp") }}
{{- $ztpDownloads := (.Values.networkZtp.downloads | default dict) }}
{{- $ztpSftpDownloads := ($ztpDownloads.sftp | default dict) }}
# =============================================================================
# Network Policy - Namespace Isolation
# =============================================================================
# Restricts ingress traffic to same-namespace communication only.
# Allows:
#   - All pod-to-pod traffic within the namespace
#   - Ingress from Envoy Gateway system namespace (if configured)
#   - Ingress from LoadBalancer provider namespace (if configured)
# Denies:
#   - Ingress from other namespaces (except allowed ones)
# Egress:
#   - Fully open (no restrictions)
# =============================================================================

{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
spec:
  # Apply to all pods in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow all traffic from within the same namespace
    - from:
        - podSelector: {}
    {{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.namespace }}
    # Allow Prometheus scraping from the monitoring namespace, restricted to the
    # TCP ports used by PodMonitor endpoints across all NVCM services.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.prometheus.namespace | quote }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091  # DHCP confgen reconcile metrics (CONFGEN_METRICS_PORT)
        - protocol: TCP
          port: {{ ($ztpSftpDownloads.metricsPort | default 9100) }}
        - protocol: TCP
          port: {{ .Values.networkDhcp.kea.storkAgentPort }}
        - protocol: TCP
          port: 9187  # CNPG metrics exporter
        {{- if .Values.nautobotNats.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.nautobotNats.metrics.port | default 7777 }}  # nautobot NATS exporter
        {{- end }}
    {{- end }}
    {{- if and .Values.renderService.enabled .Values.renderService.autoscaling.enabled (include "nv-config-manager.inClusterPrometheusAddress" .) }}
    # Allow KEDA to read the render-consumer trigger metric from the Prometheus
    # this release deploys. KEDA runs in its own namespace, so its queries are
    # cross-namespace ingress that the same-namespace rule above does not cover;
    # without this the ScaledObjects never resolve a value.
    #
    # Keyed on the same helper the ScaledObject uses for its serverAddress, so
    # this opens only when that in-cluster Prometheus is genuinely the endpoint
    # KEDA queries. An explicit serverAddress (external Prometheus) yields no
    # rule, rather than granting access to a port KEDA never dials here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kedaNamespace | default "keda" | quote }}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
    {{- if .Values.networkPolicy.allowFromGatewayNamespace }}
    # Allow traffic from Envoy Gateway system namespace (data plane proxies)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
    {{- end }}
    {{- if .Values.networkPolicy.allowFromLBNamespace }}
    # Allow traffic from LoadBalancer provider namespace (MetalLB/Cilium/AWS NLB)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.lbNamespace }}
    {{- end }}
    {{- range .Values.networkPolicy.additionalAllowedNamespaces }}
    # Allow traffic from additional namespace: {{ . }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
{{- end }}

{{/*
# =============================================================================
# Network Policy - kgateway External Listener Access
# =============================================================================
# kgateway creates its data-plane proxy in the application namespace. The
# namespace-isolation policy above therefore applies to it. Permit external
# traffic only to that proxy's Gateway listener ports so a NodePort or
# LoadBalancer can reach the Gateway without exposing application pods.
# =============================================================================
*/}}
{{- if and .Values.networkPolicy.enabled .Values.gateway.enabled .Values.gateway.create (eq (include "nv-config-manager.gatewayControllerType" .) "kgateway") (gt (len (.Values.gateway.listeners | default list)) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kgateway-external-listener-access
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.gateway.listeners }}
        - protocol: TCP
          port: {{ .port }}
        {{- end }}
{{- end }}

{{/*
# =============================================================================
# Network Policy - DHCP LoadBalancer Access (ipBlock-based)
# =============================================================================
# When using MetalLB or Cilium with externalTrafficPolicy: Local, the source IP
# is preserved (not NAT'd through the LB namespace). This policy allows traffic
# from the configured allowedPrefixes directly to DHCP pods on LB-exposed ports.
# =============================================================================
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $dhcpAllowedPrefixes := list }}
{{- if and .Values.networkDhcp.ingress.cilium .Values.networkDhcp.ingress.cilium.allowedPrefixes }}
  {{- $dhcpAllowedPrefixes = .Values.networkDhcp.ingress.cilium.allowedPrefixes }}
{{- else if and .Values.networkDhcp.ingress.metallb .Values.networkDhcp.ingress.metallb.allowedPrefixes }}
  {{- $dhcpAllowedPrefixes = .Values.networkDhcp.ingress.metallb.allowedPrefixes }}
{{- end }}
{{- if $dhcpAllowedPrefixes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dhcp-loadbalancer-access
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
spec:
  # Apply only to DHCP pods
  podSelector:
    matchLabels:
      app: {{ $dhcpName }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from configured OOB network prefixes to DHCP ports
    - from:
        {{- range $dhcpAllowedPrefixes }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        # DHCP (UDP 67)
        - protocol: UDP
          port: 67
        # Healthcheck (HTTP 9090)
        - protocol: TCP
          port: 9090
{{- end }}
{{- end }}

{{/*
# =============================================================================
# Network Policy - ZTP LoadBalancer Access (ipBlock-based)
# =============================================================================
# When using MetalLB or Cilium with externalTrafficPolicy: Local, the source IP
# is preserved (not NAT'd through the LB namespace). This policy allows traffic
# from the configured allowedPrefixes directly to ZTP pods on LB-exposed ports.
# =============================================================================
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $ztpAllowedPrefixes := list }}
{{- if and .Values.networkZtp.ingress.cilium .Values.networkZtp.ingress.cilium.allowedPrefixes }}
  {{- $ztpAllowedPrefixes = .Values.networkZtp.ingress.cilium.allowedPrefixes }}
{{- else if and .Values.networkZtp.ingress.metallb .Values.networkZtp.ingress.metallb.allowedPrefixes }}
  {{- $ztpAllowedPrefixes = .Values.networkZtp.ingress.metallb.allowedPrefixes }}
{{- end }}
{{- if $ztpAllowedPrefixes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztp-loadbalancer-access
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
spec:
  # Apply only to ZTP pods
  podSelector:
    matchLabels:
      app: {{ $ztpName }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from configured OOB network prefixes to ZTP ports
    - from:
        {{- range $ztpAllowedPrefixes }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        # HTTP API (port 8000)
        - protocol: TCP
          port: 8000
        # HTTP API (port 9000, for internal/gateway access)
        - protocol: TCP
          port: 9000
        # SFTP (port 2222)
        - protocol: TCP
          port: 2222
{{- end }}
{{- end }}
