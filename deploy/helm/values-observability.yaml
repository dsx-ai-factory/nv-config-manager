# =============================================================================
# LOCAL-DEV-ONLY observability overlay
# =============================================================================
# Enables prometheus-operator-crds (CRDs only) + standalone Prometheus +
# Grafana Alloy as in-namespace subcharts of nv-config-manager, all installed
# in the nv-config-manager release namespace.
#
# Architecture:
#
#   prometheus-operator-crds subchart
#    \-- installs PodMonitor / ServiceMonitor / Probe / PrometheusRule /
#        Alertmanager / Prometheus / ThanosRuler CRDs only. No Operator pod.
#
#   Alloy DaemonSet
#    |-- prometheus.operator.podmonitors    \
#    |-- prometheus.operator.servicemonitors  >-- watches CRs, scrapes targets
#    |-- prometheus.operator.probes         /
#    |     |
#    |     \-> prometheus.remote_write -> standalone Prometheus (storage)
#
# This intentionally swaps the kube-prometheus-stack pattern (Operator pod
# generates prometheus.yaml, Prometheus reads it) for the Alloy-native
# pattern (Alloy itself watches the CRs and produces scrape jobs in-process,
# remote_writes to a vanilla Prometheus). One fewer component, same
# user-facing PodMonitor API. Alloy clustering (not enabled here, single
# replica is fine for local dev) is the equivalent of OTel's Target Allocator
# if you ever scale this out.
#
# Layer this on top of values-local.yaml (or values-ci.yaml for template
# tests):
#
#   helm template test . --values values-ci.yaml --values values-observability.yaml
#
# Or via the TUI installer: toggle "Enable local observability stack" on the
# Infrastructure screen. The TUI auto-flips monitoring.enabled so the
# PodMonitor resources in templates/monitoring.yaml are rendered.
#
# DO NOT use in shared clusters (nv-config-manager-qa, prod, or any cluster
# with a separately managed production monitoring stack):
#
#   * prometheus-operator-crds installs cluster-scoped CRDs. If a cluster
#     already has another kube-prometheus-stack or prometheus-operator-crds
#     release, helm can fail with CRD-ownership errors. Pick one CRD owner
#     per cluster.
#   * The bundle uses emptyDir storage; restarts lose all metrics.
# =============================================================================

# -----------------------------------------------------------------------------
# Deployment-level custom labels (SLO / fleet metadata)
# -----------------------------------------------------------------------------
# Stamped onto pod metrics (PodMonitor podTargetLabels) and onto blackbox probe
# samples via each Probe's spec.targets.staticConfig.labels (see the
# "nv-config-manager.probeStaticConfigLabels" helper in templates/_helpers.tpl).
# Probe CR metadata.labels are NOT propagated onto samples, so staticConfig is
# the only way to get e.g. include_in_slo="true" onto probe series for SLO
# rules. Set here so the observability path (local-dev + the opt-in kind
# integration run) actually exercises probe labelling; real deployments
# override via their own values.
global:
  customLabels:
    include_in_slo: "true"

# -----------------------------------------------------------------------------
# Redis metrics exporter
# -----------------------------------------------------------------------------
# Exercise the bundled Redis exporter and its PodMonitor in local-dev and
# observability-enabled CI deployments.
externalServices:
  redis:
    metricsExport:
      enabled: true

# -----------------------------------------------------------------------------
# Blackbox probes
# -----------------------------------------------------------------------------
# The installer flips monitoring.{enabled,podMonitors.enabled,
# podMonitors.cnpg.enabled,probes.enabled} on when observability_enabled is set
# (see helm_values.py), but the Probe CRs in
# templates/monitoring.yaml are ALSO gated on a non-empty blackboxExporterUrl.
# Set a URL here so the Probe CRs render — and therefore carry the SLO
# customLabels under spec.targets.staticConfig.labels — on the local-dev / CI
# observability stack.
#
# NOTE: this stack does NOT deploy a blackbox-exporter, so the probes won't
# actually scrape; this exists to exercise Probe CR rendering + labelling (what
# test_probe_labels.py asserts), not real blackbox probing. A real deployment
# points this at its own blackbox-exporter Service.
monitoring:
  grafanaUrl: 'http://localhost:3000/d/nv-config-manager-overview?var-namespace={{ .Values.global.namespace }}'
  podMonitors:
    enabled: true
    redis:
      enabled: true
  probes:
    enabled: true
    blackboxExporterUrl: "blackbox-exporter:9115"

# -----------------------------------------------------------------------------
# Nautobot NATS metrics exporter
# -----------------------------------------------------------------------------
# Turn on the prometheus-nats-exporter sidecar + NATS PodMonitor so the
# observability path (local-dev + the opt-in kind integration run) actually
# exercises NATS JetStream metric collection — the prerequisite for KEDA render
# autoscaling on nats_consumer_num_pending. The installer flips
# monitoring.{enabled,podMonitors.enabled,podMonitors.cnpg.enabled} on when
# observability_enabled; this
# makes the sidecar + PodMonitor render alongside them (see
# templates/nautobot.yaml and templates/monitoring.yaml). Both default to off in
# values.yaml, so only this overlay (and real deployments that opt in) run them.
# test_nats_exporter.py asserts the PodMonitor CR + exporter sidecar exist when
# OBSERVABILITY=true.
nautobotNats:
  metrics:
    enabled: true

# -----------------------------------------------------------------------------
# KEDA render autoscaling
# -----------------------------------------------------------------------------
# Consume the metric the exporter above produces, so the chain is exercised end
# to end: exporter -> NATS PodMonitor -> Alloy -> Prometheus -> KEDA trigger.
# KEDA marks a ScaledObject Ready only once it resolves the trigger query
# against Prometheus, which is what turns a wrong metric name or label filter in
# templates/render-service-scaledobject.yaml into a CI failure rather than a
# production surprise. test_keda_autoscaling.py asserts that when
# OBSERVABILITY=true. The deployer installs the KEDA operator as a sibling
# release when observability_enabled is set (Deployer._install_crds).
#
# prometheus.serverAddress is deliberately left unset: the ScaledObject template
# defaults it to the Prometheus this release deploys, so the namespace stays out
# of this file.
#
# The replica counts are kind-sized. Production defaults (device 6-30, nautobot
# 3-15) would ask a single-node cluster for more render consumers than it can
# schedule. minReplicas 1 still keeps a consumer running, so a broken trigger
# can't be mistaken for an idle one, and maxReplicas 2 bounds the blast radius
# if a test leaves messages pending.
renderService:
  autoscaling:
    enabled: true
    consumers:
      device:
        minReplicas: 1
        maxReplicas: 2
      nautobot:
        minReplicas: 1
        maxReplicas: 2

# NOTE: prometheus-operator-crds is NOT configured here. It's installed
# as a sibling Helm release by the deployer (Deployer._install_crds) before
# this chart, to avoid the helm validation deadlock where the parent chart
# references PodMonitor before its CRD is registered. See the long note in
# deploy/helm/Chart.yaml for details.

# -----------------------------------------------------------------------------
# Prometheus (storage only, accepts remote_write from Alloy)
# -----------------------------------------------------------------------------
# Standalone Prometheus server. All its default scrape jobs are disabled
# (Helm-merge gotcha: must turn each off individually, a bare {} doesn't
# wipe the chart's default map). Metrics arrive via remote_write from
# Alloy at /api/v1/write.
prometheus:
  enabled: true

  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: false

  server:
    fullnameOverride: prometheus-server
    persistentVolume:
      enabled: false
    retention: "24h"
    extraArgs:
      # The chart treats falsy values as "boolean flag, no value" and emits
      # `--web.enable-remote-write-receiver` (no `=`). The chart's own README
      # suggests `null` here, but Helm's release-value merger strips null
      # entries on subsequent upgrades, silently dropping the flag and
      # leaving Alloy's remote_write returning 404s. `false` is falsy in
      # the same `if` check but survives serialization through the release
      # secret, so the flag stays put across `helm upgrade` calls.
      web.enable-remote-write-receiver: false
    service:
      type: ClusterIP
      servicePort: 9090
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  # Disable every default scrape job so the rendered prometheus.yml has zero
  # scrape_configs entries. Alloy pushes everything via remote_write.
  # Caveat: do NOT also set serverFiles.prometheus.yml.scrape_configs here —
  # the chart renders both blocks into the same YAML document, producing a
  # duplicate `scrape_configs:` key and "field scrape_configs already set"
  # at Prometheus startup. scrapeConfigs.<job>.enabled: false alone is enough.
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
  extraScrapeConfigs: ""

# -----------------------------------------------------------------------------
# Grafana Alloy (DaemonSet metrics scraper)
# -----------------------------------------------------------------------------
# The Alloy chart's default RBAC already grants
# get/list/watch on monitoring.coreos.com podmonitors/servicemonitors/probes
# (see chart values.yaml comments "Rules required for the prometheus.operator.*
# components"), so no RBAC overrides are needed.
alloy:
  enabled: true
  fullnameOverride: alloy

  controller:
    type: daemonset

  alloy:
    mounts:
      varlog: false
      dockercontainers: false

    # Expose the OTLP gRPC receiver (below) on the Alloy Service so Temporal
    # pods can reach it at alloy.<namespace>.svc.cluster.local:4317.
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    configMap:
      create: true
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        // prometheus.operator.podmonitors / servicemonitors / probes watch
        // the corresponding CRDs cluster-wide and emit scrape targets, then
        // prometheus.remote_write pushes them to the standalone Prometheus.

        prometheus.operator.podmonitors "nv_config_manager" {
          forward_to = [prometheus.remote_write.local.receiver]
        }

        prometheus.operator.servicemonitors "nv_config_manager" {
          forward_to = [prometheus.remote_write.local.receiver]
        }

        prometheus.operator.probes "nv_config_manager" {
          forward_to = [prometheus.remote_write.local.receiver]
        }

        // OTLP receiver for app traces + Temporal runtime metrics. Services point
        // OTEL_EXPORTER_OTLP_ENDPOINT at alloy:4317 (see observability.enabled).
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            metrics = [otelcol.processor.batch.default.input]
            traces  = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          output {
            metrics = [otelcol.exporter.prometheus.default.input]
            traces  = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // OTLP metrics -> the same local Prometheus the scrapers write to.
        otelcol.exporter.prometheus "default" {
          forward_to = [prometheus.remote_write.local.receiver]
        }

        // Traces -> the bundled Tempo (tempo.enabled below). Grafana's Tempo
        // datasource then renders them. In production, point this at your
        // managed or external OTLP collector instead.
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        prometheus.remote_write "local" {
          endpoint {
            url = "http://prometheus-server:9090/api/v1/write"
          }
        }

  configReloader:
    image:
      tag: v0.90.1

# -----------------------------------------------------------------------------
# Tempo (trace storage backend)
# -----------------------------------------------------------------------------
tempo:
  enabled: true
  fullnameOverride: tempo

  # Local dev: no usage reporting, ephemeral storage.
  tempo:
    memBallastSizeMbs: 0
    reportingEnabled: false
    # 1h retention is plenty for a local demo; keeps the WAL/blocks tiny.
    retention: 1h
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  persistence:
    enabled: false

# -----------------------------------------------------------------------------
# Grafana (trace/metric UI)
# -----------------------------------------------------------------------------
# AGPLv3, off by default in values.yaml. Enabled here so the local stack has a
# UI to actually view the traces Tempo stores (and the metrics Prometheus
# holds). Port-forward with `make obs-grafana` -> http://localhost:3000
# (admin/admin), then Explore -> Tempo.
grafana:
  enabled: true
  fullnameOverride: grafana

  # Local-dev only: fixed password so `make obs-grafana` (admin/admin) works.
  # A real deployment would use admin.existingSecret instead.
  adminUser: admin
  adminPassword: admin
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus-server:9090
          isDefault: true
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3200

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# -----------------------------------------------------------------------------
# OTel trace emission (local) — all instrumented services
# -----------------------------------------------------------------------------
# Turn tracing on for the local stack. otlpEndpoint is left empty so the
# otelAppEnv helper defaults to the in-cluster Alloy (alloy.<ns>.svc:4317),
# which is enabled above. This is what makes traces actually flow:
#   HTTP APIs + Temporal pods -> Alloy (OTLP receiver) -> Tempo -> Grafana.
observability:
  enabled: true
