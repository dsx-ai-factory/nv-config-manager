# =============================================================================
# Local KeyCloak SSO Configuration
# =============================================================================
# Use this values file overlay for local/airgapped demos with KeyCloak as the
# OIDC/SSO provider instead of Azure AD.
#
# Prerequisites:
#   1. Envoy Gateway + KeyCloak installed via:
#      ./deploy/scripts/setup-vm-prereqs.sh --install-security-stack
#   2. NVIDIA Config Manager realm and client configured (done automatically by setup script)
#   3. /etc/hosts entry for keycloak.config-manager.demo pointing to gateway IP
#
# Usage:
#   helm install nv-config-manager . -f values.yaml -f values-local-keycloak.yaml
#
# Or with installer config:
#   cluster.hostname: config-manager.demo
#     --sso \
#     --sso-issuer-url https://keycloak.config-manager.demo/realms/nv-config-manager \
#     --sso-client-id nv-config-manager \
#     --sso-client-secret nv-config-manager-client-secret \
#     --values helm/values-local-keycloak.yaml
#
# Demo users (created by setup script):
#   - admin / admin (administrator)
#   - demo / demo (regular user)
# =============================================================================

# =============================================================================
# OIDC - KeyCloak SSO Configuration
# =============================================================================
# Gateway-level OIDC: Single OIDC filter for all routes.
# All subdomains share the same OAuth session (no per-route login required).
#
# Keycloak Client Configuration:
#   Valid Redirect URIs: Just ONE callback URL:
#     - https://<baseDomain>/oauth2/callback  (e.g., https://config-manager.demo/oauth2/callback)
#
#   OR use wildcard: *
#
# =============================================================================
oidc:
  enabled: true
  
  # KeyCloak OIDC configuration
  # Use the external gateway URL for browser redirects
  # Note: Requires /etc/hosts entry for keycloak.config-manager.demo
  issuerUrl: "https://keycloak.config-manager.demo/realms/nv-config-manager"
  endSessionEndpoint: "https://keycloak.config-manager.demo/realms/nv-config-manager/protocol/openid-connect/logout"
  
  # NVIDIA Config Manager client (created by setup-vm-prereqs.sh)
  clientId: "nv-config-manager"

  # Public/native client used by CLI PKCE auth discovery
  cliClientId: "nv-config-manager-cli"
  authUtility:
    # Keep disabled unless the UI image tag includes /auth/discovery and /auth/logout.
    enabled: false
  
  # Name of the K8s secret containing client-secret and a cookie-secret used
  # by the gateway-independent proxy. oauth2-proxy expects an AES key of 16,
  # 24, or 32 bytes; it base64url-decodes the value first and only falls back
  # to the raw string. The upstream-recommended incantation is
  # `openssl rand -base64 32 | tr '+/' '-_' | tr -d '='` — 32 bytes of
  # entropy encoded as unpadded base64url (43 chars) that decode to 32 raw
  # bytes (AES-256). Do NOT substitute a plain `openssl rand -base64 32`;
  # its standard-alphabet `+`/`/` chars fail oauth2-proxy's base64url decode,
  # so the resulting 44-char raw string is treated as-is — not a valid AES
  # key size — and oauth2-proxy CrashLoopBackOffs with
  # `cookie_secret must be 16, 24, or 32 bytes ... but is 44 bytes`.
  # Create with: kubectl create secret generic oidc-client-secret --from-literal=client-secret=nv-config-manager-client-secret --from-literal=cookie-secret="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" -n nv-config-manager
  clientSecretName: "oidc-client-secret"
  
  # OIDC scopes - KeyCloak standard scopes
  scopes:
    - "openid"
    - "email"
    - "profile"
    - "roles"
  
  # JWT claim containing user groups/roles
  groupsClaim: "realm_roles"
  

# =============================================================================
# Gateway Configuration - JWT Auth with KeyCloak
# =============================================================================
gateway:
  enabled: true
  
  auth:
    jwt:
      enabled: true
      # KeyCloak as JWT issuer (must match issuer claim in tokens)
      # This is the external URL that browsers use
      issuer: "https://keycloak.config-manager.demo/realms/nv-config-manager"
      audiences:
        - "nv-config-manager"
      # JWKS endpoint for token validation (use internal URL for reliability)
      jwksUri: "http://keycloak.keycloak.svc.cluster.local:80/realms/nv-config-manager/protocol/openid-connect/certs"
      # Forward the original JWT to backend services
      forwardToken: true
      
      # Claim-to-Header Mappings (KeyCloak claims)
      claimToHeaders:
        # Email address
        - claim: email
          header: X-Auth-Request-Email
        # Preferred username
        - claim: preferred_username
          header: X-Auth-Request-Preferred-Username
        # User's display name
        - claim: name
          header: X-Auth-Request-Name
        # Realm roles (KeyCloak specific)
        - claim: realm_access.roles
          header: X-Auth-Request-Roles
        # Subject (user unique ID)
        - claim: sub
          header: X-Auth-Request-User
        # Compatibility aliases for applications that consume forwarded headers
        - claim: email
          header: X-Forwarded-Email
        - claim: preferred_username
          header: X-Forwarded-Preferred-Username
        - claim: sub
          header: X-Forwarded-User

mcp:
  # Keep disabled unless the nv-config-manager image tag includes the MCP entrypoint.
  enabled: false

# =============================================================================
# RBAC - group-mapping (nv_config_manager_auth.rbac)
# =============================================================================
# Maps the JWT ``roles`` claim (KeyCloak realm roles, surfaced above via
# ``oidc.groupsClaim: realm_roles``) onto Nautobot Django Groups +
# ObjectPermissions. Reconciled on every login by the JWT authenticator.
#
# The role names below are the realm roles seeded for local testing by
# ``setup-vm-prereqs.sh --install-security-stack`` /
# ``scripts/create-local-security-nautobot-users`` (nvcm-readonly, nvcm-network,
# nvcm-admin), so this overlay is runnable end-to-end against the local KeyCloak
# stack -- no external IdP required.
nautobot:
  rbac:
    # ``superuserGroups`` is the simple-case shortcut: any user whose ``roles``
    # claim contains a name in this list becomes is_superuser=is_staff=True, and
    # users without one are demoted on their next login. Left empty here so we
    # exercise *only* the fine-grained group-mapping path below.
    superuserGroups: []

    # Auto-create the referenced Django Groups on first login. Default ``false``
    # keeps the operator-managed lifecycle (the Group must already exist before
    # the module attaches permissions/memberships). Enabled here for a
    # from-scratch local kind cluster.
    autoCreateGroups: true

    groupMapping:
      # Fine-grained, non-superuser example: read-only across the board, plus
      # job execution and status-scoped IPAM writes.
      - name: nvcm-network
        nautobot_permissions:
          view:
            content_types: ["all"]
          run:
            content_types: ["extras.job"]
          change:
            # A ``status__name`` constraint is applied as a queryset filter at
            # permission-check time, so it must only target models that actually
            # have a ``status`` field. ``ipam.*`` would include status-less
            # models (Namespace, RIR, VLANGroup, RouteTarget) and Nautobot would
            # raise FieldError when checking them -- list the status-bearing
            # IPAM models explicitly instead.
            content_types: ["ipam.ipaddress", "ipam.prefix", "ipam.vlan"]
            constraints:
              status__name: "Active"

      # Superuser example via the richer mapping (equivalent to listing
      # ``nvcm-admin`` in ``superuserGroups`` above).
      - name: nvcm-admin
        is_superuser: true

# =============================================================================
# Note: Browser Access Setup
# =============================================================================
# The setup-vm-prereqs.sh --install-security-stack automatically:
#   1. Installs Envoy Gateway with a shared Gateway
#   2. Creates an HTTPRoute for KeyCloak at keycloak.config-manager.demo
#   3. Generates a self-signed TLS certificate for *.config-manager.demo
#
# To complete browser SSO setup, add /etc/hosts entries on your client:
#
#   # Get gateway IP
#   GATEWAY_IP=$(kubectl get gateway shared-gateway -n envoy-gateway-system \
#     -o jsonpath='{.status.addresses[0].value}')
#   
#   # Add to /etc/hosts (on your laptop/client machine)
#   echo "$GATEWAY_IP keycloak.config-manager.demo config-manager.demo nautobot.config-manager.demo" | sudo tee -a /etc/hosts
#
# Then access:
#   - KeyCloak Admin: https://keycloak.config-manager.demo (admin / <password>)
#   - NVIDIA Config Manager: https://nautobot.config-manager.demo (demo / demo)
# =============================================================================

networkPolicy:
  additionalAllowedNamespaces:
    - cnpg-system
