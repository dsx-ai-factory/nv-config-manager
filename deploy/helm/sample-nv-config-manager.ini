# =============================================================================
# NVIDIA Config Manager Configuration
# =============================================================================
# This is a sample unified nv-config-manager.ini showing the proposed consolidated structure.
# Sections are grouped by: shared infrastructure first, then service-specific.
#
# Naming convention for endpoints:
#   *_service = Internal k8s endpoint (http://service:port) - for service-to-service
#   *_url     = External gateway URL (https://hostname) - for user links, nautobot, etc.
# =============================================================================

# =============================================================================
# SHARED INFRASTRUCTURE
# =============================================================================
# These sections are used by multiple services and should be consistent.

[dcim]
# Built-in default provider. External providers register their own entry-point name.
provider = nautobot-2x
server = https://nautobot.example.com
# Optional: URL for user-facing device links. Defaults to server when unset.
# public_url = https://nautobot.example.com
token = <secret>
# SSL verification: true (default), false (disable), or path to CA cert file
verify = true
cache_refresh_interval = 300
cache_ttl = 3600

[dcim.options]
# Provider-specific non-secret settings belong here.

# Provider-neutral DCIM change events are configured in [nats]. Existing
# Nautobot values remain accepted while its event publisher is migrated.
# dcim_change_stream = dcim
# dcim_change_subject = dcim.change

# Compatibility section for services that have not yet migrated to the provider API.
[nautobot]
server = https://nautobot.example.com
# Optional: URL for user-facing device links (e.g. config-store API metadata). Defaults to server when unset.
# Set when Nautobot is reached internally (e.g. in-cluster) but users open it via a different public URL.
# public_url = https://nautobot.example.com
token = <secret>
# SSL verification: true (default), false (disable), or path to CA cert file
verify = true
cache_refresh_interval = 300
cache_ttl = 3600

[redis]
host = redis.nv-config-manager.svc.cluster.local
port = 6379
db = 0
lock_db = 1
ssl = false
socket_timeout = 5
socket_connect_timeout = 5
password = <secret>

[nats]
server = nats://nv-config-manager@nats:4222
queue = nv-config-manager
auth_method = password
password = <secret>
# Alternative: JWT auth
# auth_method = JWT
# creds_path = /etc/nats/nats.creds
local = false
config_manager_stream = nv-config-manager
config_manager_api_prefix = $JS.API
config_manager_consumer_name = nv-config-manager-device
config_manager_subjects = nv-config-manager.nautobotchange,nv-config-manager.devicechange,nv-config-manager.workflow.result
render_change_stream = nv-config-manager
render_change_subject = nv-config-manager.nautobotchange
device_change_stream = nv-config-manager
device_change_subject = nv-config-manager.devicechange
archive_stream = nv-config-manager
archive_subject = nv-config-manager.workflow.result
archive_consumer_name = nv-config-manager-archive
archive_deliver_subject = nv-config-manager.archive.delivery
nautobot_stream = nautobot
nautobot_api_prefix = $JS.API
nautobot_consumer_name = nv-config-manager-nautobot
nautobot_subjects = nautobot
nautobot_subject = nautobot

[aggregate]
is_aggregate_environment = false

[slack]
bot_token = <secret>
channel_name = nv-config-manager-alerts

# =============================================================================
# CONFIG-STORE SERVICE
# =============================================================================
# Database configuration for config-store's own postgres

[config_store]
database_host = cluster-config-store-rw.nv-config-manager.svc.cluster.local
database_port = 5432
database = nv_config_manager_config_store
database_user = <secret>
database_password = <secret>

# API configuration
[config_store.api]
# CORS origins allowed to make cross-origin requests with credentials
# Comma-separated list of allowed origins (e.g., "https://config-manager.example.com")
cors_origins = https://config-manager.example.com

# Client configuration for other services to call config-store
[config_store.client]
# Internal endpoint for service-to-service calls (within cluster)
api_service = http://nv-config-manager-config-store-service-api:9000
# External API endpoint for clients outside the cluster
api_url = https://config-store.config-manager.example.com
# Unified UI base URL for links (DCIM references, etc.)
ui_url = https://config-manager.example.com
use_internal_endpoint = false
verify = true


# =============================================================================
# RENDER SERVICE
# =============================================================================

[render]
# Internal endpoint for service-to-service calls
api_service = http://nv-config-manager-render-service-api:9000
# External URL for user-facing links
api_url = https://render.config-manager.example.com
use_internal_endpoint = false

# =============================================================================
# TEMPORAL / WORKFLOW SERVICE
# =============================================================================

[temporal]
# Internal: Temporal gRPC frontend (for workers, SDK clients)
grpc_service = temporal-frontend-service.nv-config-manager.svc.cluster.local:7233
# Internal: NVIDIA Config Manager Temporal API (for internal service calls)
api_service = http://nv-config-manager-temporal-api:9000
# External: Gateway URLs for user-facing links
api_url = https://workflow.config-manager.example.com
ui_url = https://config-manager.example.com
use_internal_endpoint = false

[temporal.elasticsearch]
local = false
server = https://elasticsearch.example.com
domain = nv-config-manager

# -----------------------------------------------------------------
# Temporal API Configuration (REST API for workflow operations)
# -----------------------------------------------------------------
[temporal.api]
# CORS origins allowed to make cross-origin requests with credentials
# Comma-separated list of allowed origins (e.g., "https://config-manager.example.com")
cors_origins = https://config-manager.example.com

# =============================================================================
# DEVICE / NETWORK CREDENTIALS
# =============================================================================

[device]
username = <secret>
password = <secret>

[redfish]
lenovo_default_user = <secret>
lenovo_default_password = <secret>
lenovo_config_manager_password = <secret>
bluefield_default_user = <secret>
bluefield_default_password = <secret>
bluefield_config_manager_password = <secret>

[jira]
base_url  = https://yourcompany.atlassian.net
api_token = <secret>

# =============================================================================
# DHCP SERVICE
# =============================================================================

[dhcp]
# Internal endpoint for service-to-service calls
api_service = http://dhcp-internal:9000
# External URL for user-facing links
api_url = https://dhcp.config-manager.example.com

[dhcp.kea]
server = dhcp-internal
port = 8000

[dhcp.lease_db]
local = false
host = cluster-dhcp-rw.nv-config-manager.svc.cluster.local
port = 5432
database = kea_dhcp
user = dhcp
password = <secret>

# =============================================================================
# ZTP SERVICE
# =============================================================================

[ztp]
# Internal endpoint for service-to-service calls
api_service = http://nv-config-manager-network-ztp-api:9000
# External URL for user-facing links
api_url = https://ztp.config-manager.example.com
# User domain for workflow context
user_domain = prod.config-manager.example.com
use_internal_endpoint = false
storage_type = s3
s3_bucket = ngc-network-firmware-images
# Download memory and concurrency bounds.
http_stream_chunk_bytes = 67108864
http_max_concurrent_downloads = 16
sftp_read_ahead_bytes = 16777216
sftp_max_concurrent_downloads = 32
sftp_metrics_port = 9100
# Optional S3-compatible endpoint and AWS region.
# Leave endpoint unset for default AWS S3 resolution. For EKS IRSA, set the
# region and rely on the ServiceAccount's IAM role instead of static credentials.
# s3_endpoint = https://s3.example.com
# s3_region = us-west-2
# Static credentials are only needed for non-IRSA S3-compatible storage.
# s3_access_key = access-key
# s3_secret_key = secret-key

# =============================================================================
# MCP SERVICE
# =============================================================================

[mcp]
# MCP uses internal service endpoints. When auth is enabled, it forwards the
# caller's Bearer token and does not fall back to service-to-service auth.
use_internal_endpoints = true
max_response_bytes = 100000
# Optional separate read-only Nautobot token used only by the Nautobot MCP tools.
# Those tools are registered only when [dcim] provider = nautobot-2x.
nautobot_read_only_token = <secret>
# auto: bundled/local Nautobot uses user JWT; external Nautobot uses the MCP read-only token.
# token: use the MCP read-only Nautobot token.
# jwt: forward the caller's Bearer token to Nautobot when auth is enabled.
nautobot_auth_mode = auto
nautobot_token_fallback_enabled = false
