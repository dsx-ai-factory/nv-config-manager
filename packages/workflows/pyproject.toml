[project]
name = "nv-config-manager-workflows"
version = "1.0.0"
description = "Reusable Temporal workflow and activity library for NVIDIA Config Manager network automation"
authors = [{ name = "NVIDIA Corporation" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "netaddr>=1.3.0",
    "nv-config-manager-dcim",
    "py-markdown-table>=1.1.0",
    "pydantic>=2.10.2",
    "redis[hiredis]>=5.2.1",
    "temporalio>=1.29.0,<1.32.0",
]

[project.entry-points."nv_config_manager.workflows"]
builtin = "nv_config_manager_workflows.registration:builtin_plugin"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.7",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_workflows"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest_cache"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "ANN"]
