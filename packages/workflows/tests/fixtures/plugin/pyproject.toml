[project]
name = "nv-config-manager-fixture-plugin"
version = "0.1.0"
description = "Fixture workflow plugin for testing NVIDIA Config Manager plugin discovery and isolation"
authors = [{ name = "NVIDIA Corporation" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "nv-config-manager-workflows",
    "pydantic",
    "temporalio",
]

[project.entry-points."nv_config_manager.workflows"]
nvcm-fixture = "nvcm_fixture_plugin.registration:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvcm_fixture_plugin"]
