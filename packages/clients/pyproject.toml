[project]
name = "nv-config-manager-clients"
version = "1.0.0"
description = "Generated Python clients and convenience wrappers for NVIDIA Config Manager APIs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "aiohttp-retry>=2.9.1",
    "pydantic>=2.11",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_clients"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["src/nv_config_manager_clients/generated"]
force-exclude = true
