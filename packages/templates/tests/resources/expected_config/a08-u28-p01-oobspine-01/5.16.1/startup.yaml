              EVPN:
                address-family:
                  ipv4-unicast:
                    enable: off
                  l2vpn-evpn:
                    enable: on
                bfd:
                  detect-multiplier: 3
                  enable: on
                  min-rx-interval: 1000
                  min-tx-interval: 1000
                description: evpn_vxlan_control_plane
                multihop-ttl: 2
                remote-as: external
                update-source: lo
              UNDERLAY:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: RM_ADD_WECMP
                bfd:
                  detect-multiplier: 3
                  enable: on
                  min-rx-interval: 300
                  min-tx-interval: 300
                description: underlay_interconnect
                remote-as: external
      mgmt:
        router:
          static:
            0.0.0.0/0:
              address-family: ipv4-unicast
              via:
                192.0.2.1:
                  type: ipv4-address
