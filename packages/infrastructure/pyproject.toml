[project]
name = "nv-config-manager-infrastructure"
version = "1.0.0"
description = "Shared Redis, NATS, and locking adapters for NVIDIA Config Manager"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = ["redis[hiredis]>=5.2.1", "nats-py>=2.9.0", "certifi>=2024.8.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_infrastructure"]

[tool.ruff]
extend = "../../pyproject.toml"
