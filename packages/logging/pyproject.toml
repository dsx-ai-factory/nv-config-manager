[project]
name = "nv-config-manager-logging"
version = "1.0.0"
description = "Structured logging shared by NVIDIA Config Manager packages"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.11.1,<2",
    "python-json-logger>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_logging"]

[tool.ruff]
extend = "../../pyproject.toml"
