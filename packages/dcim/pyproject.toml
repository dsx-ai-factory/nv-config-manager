[project]
name = "nv-config-manager-dcim"
version = "1.0.0"
description = "Provider-neutral DCIM SDK for NVIDIA Config Manager"
authors = [{ name = "NVIDIA Corporation" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "netaddr>=1.3.0",
    "pydantic>=2.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_dcim"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
