[project]
name = "nautobot-nv-config-manager"
dynamic = ["version"]
description = "NVIDIA Config Manager Nautobot app."
authors = [{ name = "NVIDIA Corporation", email = "support@nvidia.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
classifiers = [
    "Intended Audience :: Information Technology",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "beautifulsoup4>=4.13.3",
    "nautobot>=2.4.20,<3.0",
]
keywords = ["nautobot", "nautobot-app", "nautobot-plugin", "automation"]

[project.urls]
"Homepage" = "https://github.com/dsx-ai-factory/nv-config-manager/tree/main/components/nautobot/nautobot-nv-config-manager"
"Repository" = "https://github.com/dsx-ai-factory/nv-config-manager"

[project.optional-dependencies]
dev = [
    "django-slowtests>=1.1.1",
    "factory-boy>=3.3.1",
    "selenium>=4.0.0",
    "splinter>=0.21.0",
    "unittest-xml-reporting>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "2.0.0"

[tool.hatch.version.raw-options]
root = "../../.."

[tool.hatch.build.targets.wheel]
packages = ["nv_config_manager"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".uv-cache",
    ".venv",
    ".git",
    ".gitlab-ci.yml",
    "*.pyc",
    "__pycache__",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"nv_config_manager/migrations/*" = ["E501"]
