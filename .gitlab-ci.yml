---
include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/test.yml
  # Secret-free pull-request builds and protected test-env promote pipelines
  # have deliberately narrow job sets. Do not include unrelated Pulse or
  # airgapped jobs (including their tracking/manual placeholders) in them.
  # Trigger variables are untrusted until a validator job runs, so triggered
  # pipelines are excluded using GitLab's pipeline source + protected ref.
  - local: .gitlab/ci/pulse.yml
    rules: &exclude-special-pipeline-fragments
      - if: $CI_COMMIT_BRANCH =~ /^pull-request\// || (($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NVCM_PROMOTE_ENV =~ /^(test|test01)$/)
        when: never
      - when: always
  - local: .gitlab/ci/sonar.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/airgapped.yml
    rules: *exclude-special-pipeline-fragments
  - local: .gitlab/ci/pr-build.yml
  - local: .gitlab/ci/promote-test-envs.yml
