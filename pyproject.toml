[project]
name = "nv-config-manager"
version = "1.0.0"
description = "NVIDIA Config Manager - Network automation and configuration management platform"
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Config Manager Team", email = "ngc-cfa@nvidia.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    # Core / Shared
    "click>=8.1.7",
    # Security: Fix idna vulnerability (GHSA-65pc-fj4g-8rjx)
    "idna>=3.15",
    # Security: Fix header injection via malformed URLs (GHSA-gc5v-m9x4-r6x2)
    "requests>=2.33.0",
    "pydantic>=2.10.2",
    "pydantic-settings>=2.14.2",
    # Web Framework
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.32.0",
    "starlette>=1.3.1",
    # Security: Fix arbitrary file write via non-default config (GHSA-wp53-j4wj-2cfg)
    # Security: Fix multipart parser vulnerability (GHSA-pp6c-gr5w-3c5g)
    "python-multipart>=0.0.30",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "prometheus-client>=0.19.0",
    # Async HTTP
    # Security: Fix multiple request smuggling and header injection vulns
    # (GHSA-w2fm-2cpv-w7v5, GHSA-p998-jp59-783m, GHSA-c427-h43c-vf67, GHSA-m5qp-6w8w-w647)
    "aiohttp[speedups]>=3.14.1",
    "aiohttp-retry>=2.9.1",
    "httpx>=0.27.2",
    # Security: Fix urllib3 decompression chain vulnerabilities (GHSA-gm62-xv2j-4w53, GHSA-2xpw-w6gg-jr37)
    # Security: Fix urllib3 vulnerabilities (GHSA-mf9v-mfxr-j63j, GHSA-qccp-gfcp-xxvc)
    "urllib3>=2.7.0",
    # AWS / S3
    "boto3>=1.35.42",
    "aioboto3>=13.1.1",
    # Database
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Security: Fix Mako vulnerability pulled in by Alembic (GHSA-2h4p-vjrc-8xpq)
    "mako>=1.3.12",
    # Redis
    "redis[hiredis]>=5.2.1",
    # NATS
    "nats-py[nkeys]>=2.8.0",
    "nkeys>=0.2.0",
    # Temporal
    # Security: Fix rustls-webpki vulnerability in Temporal bridge (GHSA-82j2-j2ch-gfr8)
    "temporalio[opentelemetry]>=1.29.0,<1.32.0",
    # OpenTelemetry — trace export and FastAPI HTTP instrumentation
    # (opentelemetry-api and opentelemetry-sdk come via temporalio[opentelemetry])
    "opentelemetry-exporter-otlp-proto-grpc>=1.11.1,<2",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-asgi>=0.64b0",
    # Outbound HTTP client instrumentation so trace context propagates across
    # service hops: aiohttp (inter-service clients), httpx + requests (Nautobot,
    # devices, OIDC).
    "opentelemetry-instrumentation-aiohttp-client>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-requests>=0.46b0",
    # Security: Fix protobuf JSON recursion depth bypass (GHSA-7gcm-g887-7qv7)
    "protobuf>=6.33.5",
    # Network Automation
    "pyeapi>=1.0.2",
    "junos-eznc>=2.8.2",
    "netmiko>=4.3.0",
    "macaddress>=2.0.2",
    "netaddr>=0.10.1",
    "types-netaddr>=1.3.0.20250822",
    # SSH/SFTP
    "paramiko>=3.4.0",
    # Security: Fix libsodium incomplete disallowed inputs (GHSA-mrfv-m5wm-5w6w)
    "pynacl>=1.6.2",
    # Security: Fix SECT curves subgroup attack (GHSA-r6ph-v2qm-q3c2)
    # Security: Fix NULL pointer dereference in PKCS#12 parsing (GHSA-p423-j2cm-9vmq)
    "cryptography>=48.0.1",
    # JWT Authentication
    "PyJWT[crypto]>=2.13.0",
    # Templating
    "jinja2>=3.1.2",
    "ruamel-yaml>=0.18.6",
    # Git
    # Security: Fix GitPython vulnerability (GHSA-mv93-w799-cj2w)
    "gitpython>=3.1.50",
    # Data Processing
    "numpy>=2.1.0,<3.0.0",
    "pandas>=2.3.0",
    "pandas-stubs>=2.0.0",
    "openpyxl>=3.1.0",
    "types-openpyxl>=3.1.5.20250602",
    # Elasticsearch 8.x+ required (uses elastic-transport which supports urllib3 2.x)
    # Elasticsearch 7.x is no longer supported due to urllib3<2 requirement
    "elasticsearch>=8.0.0",
    "requests-aws4auth>=1.3.1",
    # Compression
    "brotli>=1.1.0",
    # Slack
    "slack-sdk>=3.35.0",
    # Logging
    "python-json-logger>=2.0.7",
    # Markdown
    "py-markdown-table>=1.1.0",
    # Documentation
    "mkdocs>=1.6.1",
    # Model Context Protocol
    "mcp>=1.29.0,<2",
    # Network Templates (render service)
    "nv-config-manager-templates",
    # Provider-neutral DCIM SDK
    "nv-config-manager-dcim",
    # Built-in reference DCIM provider (also distributed as a standalone provider package)
    "nv-config-manager-dcim-nautobot-2x",
    # Shared workflow contracts and implementations imported by the Temporal services
    "nv-config-manager-workflows",
]

[project.scripts]
# ZTP Service
nv-config-manager-ztp-api = "nv_config_manager.ztp.api.main:main"
nv-config-manager-ztp-sftp = "nv_config_manager.ztp.sftp.main:main"
# DHCP Service
nv-config-manager-dhcp-confgen = "nv_config_manager.dhcp.cli:main"
nv-config-manager-dhcp-api = "nv_config_manager.dhcp.api:main"

# Temporal Service
nv-config-manager-temporal-worker = "nv_config_manager.temporal.worker.main:cli_main"
nv-config-manager-temporal-api = "nv_config_manager.temporal.api.main:main"
nv-config-manager-temporal-archive = "nv_config_manager.temporal.archive.main:main"
nv-config-manager-temporal-scheduler = "nv_config_manager.temporal.ngc.schedulers.backup:main"
workflow-cli = "nv_config_manager.temporal.cli:main"

# Render Service
nv-config-manager-render-api = "nv_config_manager.render.api.main:main"
nv-config-manager-render-consumer = "nv_config_manager.render.pull_consumer:main"
nv-config-manager-render-template-updater = "nv_config_manager.render.producer:cli_main"

# Config Store Service
nv-config-manager-config-store-api = "nv_config_manager.config_store.api.main:main"
nv-config-manager-config-store-cache-refresh = "nv_config_manager.config_store.cache_refresh_service:cli_main"

# MCP Service
nv-config-manager-mcp = "nv_config_manager.mcp.main:main"
nvcm-mcp-cli = "nv_config_manager.mcp.cli:main"

[dependency-groups]
integration-test = [
    "pytest>=8.3.3",
]
dev = [
    # Testing
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "aioresponses>=0.7.9",
    "pytest-aioresponses>=0.2.0",
    "pytest-timeout>=2.3.1",
    "testcontainers>=3.7.1",
    "aiosqlite>=0.19.0",
    "responses>=0.25.3",
    "mock>=5.1.0",

    # Linting & Formatting
    "ruff==0.16.3",
    "black>=24.10.0",
    "isort>=6.1.0",
    "mypy>=1.12.0",
    "ty>=0.0.9",
    "flake8>=7.1.1",
    "flake8-bugbear>=24.8.19",
    "pylint>=3.3.1",
    "pylint-gitlab>=2.0.1",
    "pydocstyle>=6.3.0",
    "bandit>=1.7.10",

    # Type stubs
    "types-requests>=2.32.0",
    "types-pyyaml>=6.0.12.20240311",
    "types-redis>=4.6.0.20241004",
    "types-paramiko>=3.4.0",

    # Utilities
    "anybadge>=1.14.0",
    "lxml>=5.3.0",
]
promotion-gate = [
    "requests>=2.33.0",
    "responses>=0.25.3",
]
ipython = [
    "ipython>=8.28.0",
]
docs = [
    "mkdocs-material>=9.4.0",
    "mkdocs-autorefs==0.4.1",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.0",
    "pymdown-extensions>=10.0",
    "mkdocs-techdocs-core>=1.2.0",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/dcim", "packages/templates", "packages/workflows", "plugins/dcim/nautobot-2x"]

[tool.uv.sources]
nv-config-manager-dcim = { workspace = true }
nv-config-manager-dcim-nautobot-2x = { workspace = true }
nv-config-manager-templates = { workspace = true }
nv-config-manager-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest_cache"
asyncio_mode = "auto"
testpaths = [
    "src/tests",
    "development/mock_topology/tests",
    "development/ufm_mock/tests",
    "packages/workflows/tests",
]
timeout = 30  # Global timeout in seconds per test
# Exclude integration tests by default (they require a running cluster)
addopts = "--ignore=src/tests/integration"
markers = [
    "integration: marks tests as integration tests (require running NVIDIA Config Manager cluster)",
    "spiffe: marks tests that require a live SPIFFE/Workload-Identity setup (opt-in via --spiffe)",
    "rbac: marks tests that require live group-mapping RBAC (opt-in via --rbac)",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
cache_dir = ".cache/mypy_cache"
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "pyeapi.*",
    "jnpr.*",
    "py_markdown_table.*",
    "ruamel.*",
    "brotli.*",
    "netaddr.*",
    "macaddress",
    "requests",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ANN401", # Any type allowed - needed for generic HTTP/Redis clients
]

[tool.ruff.lint.isort]
known-first-party = ["nv_config_manager", "nv_config_manager_workflows"]

[tool.ruff.lint.per-file-ignores]
"src/tests/**/*.py" = ["B", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pylint.main]
analyse-fallback-blocks = "no"
jobs = 0
py-version = "3.13"

[tool.pylint.basic]
class-attribute-naming-style = "snake_case"
good-names = ["i", "j", "k", "v", "ex", "Run", "logger", "_", "f", "id", "nb"]
property-classes = ["abc.abstractproperty", "property"]

[tool.pylint.format]
ignore-long-lines = "^\\s*(# )?(from \\S+)?\\s?(import\\s)?(.+)?<?(http)?s?(://\\S+)?>?"

[tool.pylint.imports]
allow-wildcard-with-all = "no"

[tool.pylint.messages_control]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "line-too-long",
    "duplicate-code",
    "too-few-public-methods",
    "fixme"
]

[tool.pylint.miscellaneous]
notes = ["FIXME", "TODO"]

[tool.pylint.similarities]
min-similarity-lines = 16

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.pydocstyle]
convention = "google"
inherit = false
add_ignore = ["D200", "D212"]
